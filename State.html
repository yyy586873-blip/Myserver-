<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Arena — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131b;color:#f4f6ff;font-family:system-ui,sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px 14px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:24px;margin:0}.muted{color:#98a3b8;font-size:13px;margin-top:6px}.card{background:#191e29;border:1px solid #2c3445;border-radius:16px;padding:16px;margin-top:16px}.field,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #3a465c}.field{width:100%;background:#101722;color:white;margin:8px 0}button{background:#7898ff;color:#10182a;font-weight:700;cursor:pointer}.danger{background:#7b2834;border-color:#a54856;color:white}.row{display:flex;gap:9px;flex-wrap:wrap}.row button{flex:0 0 auto}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px;margin-top:12px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #30394b;font-size:13px}th{color:#aab5ca;font-weight:600}.badge{display:inline-block;border-radius:20px;padding:5px 9px;background:#293347;font-size:11px}.error{color:#ff8f9b;font-size:13px}.success{color:#7cf0b0;font-size:13px}.hidden{display:none!important}.empty{text-align:center;color:#aab5ca;padding:25px}
</style>
</head>
<body><main class="wrap">
<div class="head"><div><h1>♟ Chess Arena Admin</h1><div class="muted">Active rooms, player status and room termination.</div></div><button id="refreshButton">Refresh</button></div>
<section class="card" id="loginCard"><h3>Admin Login</h3><div class="muted">Set the Render environment variable ADMIN_PASSWORD before using this page.</div><input id="password" class="field" type="password" placeholder="Admin password" autocomplete="current-password"><div class="row"><button id="loginButton">Sign in</button></div><p id="loginMessage" class="error"></p></section>
<section class="card hidden" id="roomsCard"><div class="head"><div><h3 style="margin:0">Room Overview</h3><div class="muted" id="roomCount">0 rooms</div></div><span class="badge" id="updatedAt">Not refreshed</span></div><div class="table-wrap"><table><thead><tr><th>Room</th><th>White</th><th>Black</th><th>Status</th><th>Moves</th><th>Turn</th><th>Action</th></tr></thead><tbody id="roomRows"></tbody></table><div id="empty" class="empty hidden">No active rooms.</div></div><p id="actionMessage"></p></section>
</main>
<script>
(function(){
var token=sessionStorage.getItem("chessAdminToken")||"",rows=document.getElementById("roomRows");
function message(id,text,cls){var e=document.getElementById(id);e.textContent=text;e.className=cls||"";}
function authHeaders(){return {"Content-Type":"application/json","Authorization":"Bearer "+token};}
function login(){fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("password").value})}).then(function(r){return r.json().then(function(d){return {status:r.status,data:d};});}).then(function(x){if(!x.data.ok)throw new Error(x.data.message||"Login failed");token=x.data.token;sessionStorage.setItem("chessAdminToken",token);document.getElementById("loginCard").classList.add("hidden");document.getElementById("roomsCard").classList.remove("hidden");refresh();}).catch(function(e){message("loginMessage",e.message,"error");});}
function refresh(){if(!token)return;fetch("/api/admin/rooms",{headers:authHeaders()}).then(function(r){return r.json().then(function(d){return {status:r.status,data:d};});}).then(function(x){if(x.status===401){token="";sessionStorage.removeItem("chessAdminToken");document.getElementById("loginCard").classList.remove("hidden");document.getElementById("roomsCard").classList.add("hidden");throw new Error("Session expired. Sign in again.");}render(x.data.rooms||[]);message("actionMessage","Room list updated.","success");}).catch(function(e){message("actionMessage",e.message,"error");});}
function render(list){rows.innerHTML="";document.getElementById("roomCount").textContent=list.length+" active room"+(list.length===1?"":"s");document.getElementById("updatedAt").textContent="Updated "+new Date().toLocaleTimeString();document.getElementById("empty").classList.toggle("hidden",list.length>0);list.forEach(function(room){var tr=document.createElement("tr");function td(text){var e=document.createElement("td");e.textContent=text;tr.appendChild(e);}td(room.id);td(room.white?"Connected":"Empty");td(room.black?"Connected":"Empty");td(room.status);td(String(room.moves));td(room.turn==="w"?"White":room.turn==="b"?"Black":"—");var action=document.createElement("td"),button=document.createElement("button");button.textContent="Terminate";button.className="danger";button.addEventListener("click",function(){if(!confirm("Terminate room "+room.id+" and disconnect its players?"))return;fetch("/api/admin/terminate",{method:"POST",headers:authHeaders(),body:JSON.stringify({roomId:room.id})}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.message||"Failed");return d;});}).then(function(d){message("actionMessage",d.message,"success");refresh();}).catch(function(e){message("actionMessage",e.message,"error");});});action.appendChild(button);tr.appendChild(action);rows.appendChild(tr);});}
document.getElementById("loginButton").addEventListener("click",login);document.getElementById("password").addEventListener("keydown",function(e){if(e.key==="Enter")login();});document.getElementById("refreshButton").addEventListener("click",refresh);
if(token){document.getElementById("loginCard").classList.add("hidden");document.getElementById("roomsCard").classList.remove("hidden");refresh();}
setInterval(refresh,15000);
})();
</script></body></html>
