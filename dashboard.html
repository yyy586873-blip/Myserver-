<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Panel</title>

<style>
body {
    background:black;
    color:red;
    font-family:Arial;
    text-align:center;
}

h1 {
    text-shadow:0 0 10px red;
}

.card {
    border:1px solid red;
    margin:15px;
    padding:15px;
    border-radius:10px;
    box-shadow:0 0 10px red;
}

button {
    background:red;
    color:white;
    border:none;
    padding:10px;
    margin-top:10px;
}
</style>
</head>

<body>

<h1>🔥 FILE PANEL</h1>

<div id="files"></div>

<script>
fetch("/files-list")
.then(res => res.json())
.then(data => {
    let html = "";

    data.forEach(file => {
        html += `
        <div class="card">
            <h3>${file.name}</h3>
            <p>Size: ${file.size}</p>
            <a href="/files/${file.name}" download>
                <button>Download</button>
            </a>
        </div>
        `;
    });

    document.getElementById("files").innerHTML = html;
});
</script>

</body>
</html>
