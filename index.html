<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile 2D Racer</title>
<style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            overflow: hidden; /* Prevent scrolling */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Disable default touch actions like zoom */
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #333;
            overflow: hidden;
        }

        /* The Road */
        #road {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%; /* Road width relative to screen */
            background-color: #555;
            border-left: 5px solid white;
            border-right: 5px solid white;
            z-index: 1;
        }

        /* Moving Dashed Line */
        .lane-marker {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 40px;
            background-color: white;
        }

        /* The Player Car */
        #player {
            position: absolute;
            bottom: 20%; /* Fixed vertical position */
            left: 50%;
            width: 40px;
            height: 70px;
            background-color: #ff3333;
            border-radius: 8px;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        /* Simple car details */
        #player::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 2px;
            width: 36px;
            height: 15px;
            background-color: #333;
            border-radius: 2px;
        }
        #player::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 2px;
            width: 36px;
            height: 10px;
            background-color: #222;
        }

        /* Enemy Cars */
        .enemy {
            position: absolute;
            width: 40px;
            height: 70px;
            background-color: #3388ff;
            border-radius: 8px;
            z-index: 9;
            box-sizing: border-box;
            border: 1px solid #111;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let touches pass through to controls */
            z-index: 20;
        }

        #score-board {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 30;
        }

        h1 {
            color: #fff;
            font-size: 40px;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            text-shadow: 0 0 10px red;
        }

        button {
            background: #ff3333;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #990000;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 0 #990000;
        }

        /* Touch Controls Zones */
        #controls {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            display: flex;
            z-index: 15;
        }

        .control-zone {
            flex: 1;
            /* background: rgba(255,255,255,0.1); Debugging: reveals touch zones */ 
        }

        /* Instructions */
        #instructions {
            color: rgba(255,255,255,0.6);
            text-align: center;
            position: absolute;
            bottom: 10px;
            width: 100%;
            font-size: 14px;
        }

</style>
  </head>
  <body>

    <div id="game-container">
	  <div id="road">
		<!-- Lane markers injected via JS -->
	  </div>

	  <div id="player"></div>

	  <div id="ui-layer">
		<div id="score-board">Score: 0</div>
	  </div>

	  <!-- Invisible touch zones -->
	  <div id="controls">
		<div class="control-zone" id="btn-left"></div>
		<div class="control-zone" id="btn-right"></div>
	  </div>

	  <div id="game-over-screen" style="display: none;">
		<h1>CRASHED!</h1>
		<div style="color:white; font-size: 20px; margin-bottom: 20px;">Score: <span id="final-score">0</span></div>
		<button id="restart-btn">TRY AGAIN</button>
	  </div>

	  <div id="instructions">Tap LEFT or RIGHT side of screen to steer</div>
    </div>

<script>
        // --- Configuration ---
        const GAME_SPEED_START = 5;
        const SPEED_INCREMENT = 0.005;
        const SPAWN_RATE_START = 100; // Frames between spawns
        const LANE_COUNT = 3; // 3 Lanes

        // --- State ---
        let isGameRunning = false;
        let score = 0;
        let gameSpeed = GAME_SPEED_START;
        let frameCount = 0;
        let spawnRate = SPAWN_RATE_START;
        
        // Player State
        let playerX = 50; // Percentage (50% is center)
        let targetX = 50;
        
        // Elements
        const road = document.getElementById('road');
        const player = document.getElementById('player');
        const scoreEl = document.getElementById('score-board');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        // Arrays
        let enemies = [];
        let roadMarkers = [];

        // --- Initialization ---
        function init() {
            createRoadMarkers();
            
            // Touch Listeners
            btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); movePlayer(-15); }, {passive: false});
            btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); movePlayer(15); }, {passive: false});
            
            // Keyboard support for testing on PC
            document.addEventListener('keydown', (e) => {
                if(e.key === 'ArrowLeft') movePlayer(-15);
                if(e.key === 'ArrowRight') movePlayer(15);
            });

            restartBtn.addEventListener('click', startGame);
            
            startGame();
        }

        function startGame() {
            // Reset State
            isGameRunning = true;
            score = 0;
            gameSpeed = GAME_SPEED_START;
            spawnRate = SPAWN_RATE_START;
            frameCount = 0;
            playerX = 50;
            targetX = 50;
            
            // Clear existing items
            enemies.forEach(e => e.element.remove());
            enemies = [];
            
            // UI Reset
            gameOverScreen.style.display = 'none';
            scoreEl.innerText = 'Score: 0';
            
            // Start Loop
            requestAnimationFrame(gameLoop);
        }

        function movePlayer(amount) {
            if (!isGameRunning) return;
            targetX += amount;
            // Clamp
            if (targetX < 10) targetX = 10;
            if (targetX > 90) targetX = 90;
        }

        function createRoadMarkers() {
            const markerCount = 10;
            const height = 40;
            const gap = (window.innerHeight / markerCount);

            for(let i=0; i<markerCount; i++) {
                let m = document.createElement('div');
                m.className = 'lane-marker';
                m.style.height = height + 'px';
                m.style.top = (i * gap) + 'px';
                road.appendChild(m);
                roadMarkers.push({ element: m, y: i * gap });
            }
        }

        function spawnEnemy() {
            // Random Lane (0, 1, 2) mapped to X percentage
            const laneWidth = 100 / LANE_COUNT; // Not strictly used since road is centered, but logic applies
            const lane = Math.floor(Math.random() * 3);
            
            // Calculate X position based on lane center logic inside road
            // Road is 50% width (centered). 
            // Lanes: 16.6%, 50%, 83.3% roughly relative to screen?
            // Let's just pick 3 fixed X positions relative to the road center.
            // Road center is 50%. 
            // Lanes: 33%, 50%, 67% of the screen width (assuming road fills screen width mostly)
            // But road is 80% width. 
            // Road Left Edge = 10%, Right Edge = 90%.
            // Lane centers: 25%, 50%, 75%.
            
            const xPositions = [25, 50, 75];
            const x = xPositions[lane];

            const el = document.createElement('div');
            el.className = 'enemy';
            // Random color
            const r = Math.floor(Math.random() * 200);
            const g = Math.floor(Math.random() * 100);
            const b = Math.floor(Math.random() * 100);
            el.style.backgroundColor = `rgb(${r},${g},${b})`;
            
            el.style.left = x + '%';
            el.style.top = '-100px'; // Start above screen
            
            road.appendChild(el);
            
            enemies.push({
                element: el,
                x: x,
                y: -100
            });
        }

        function updateRoad() {
            roadMarkers.forEach(m => {
                m.y += gameSpeed;
                if (m.y > window.innerHeight) {
                    m.y = -50;
                }
                m.element.style.top = m.y + 'px';
            });
        }

        function updateEnemies() {
            // Spawn logic
            if (frameCount % Math.floor(spawnRate) === 0) {
                spawnEnemy();
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += gameSpeed * 1.5; // Enemies move faster than road to simulate player speed
                e.element.style.top = e.y + 'px';

                // Collision Detection
                // Player Y is fixed visually, but let's calculate based on container
                // Player is at bottom: 20% from bottom.
                // Container height H. Player Y range: H*0.8 to H.
                // Player W: 40px, H: 70px.
                
                const playerRect = player.getBoundingClientRect();
                const enemyRect = e.element.getBoundingClientRect();

                if (
                    playerRect.left < enemyRect.right - 5 &&
                    playerRect.right > enemyRect.left + 5 &&
                    playerRect.top < enemyRect.bottom - 5 &&
                    playerRect.bottom > enemyRect.top + 5
                ) {
                    gameOver();
                }

                // Remove if off screen
                if (e.y > window.innerHeight + 100) {
                    e.element.remove();
                    enemies.splice(i, 1);
                    score += 10;
                    scoreEl.innerText = 'Score: ' + score;
                    
                    // Increase difficulty
                    gameSpeed += 0.1;
                    if(spawnRate > 30) spawnRate -= 0.5;
                }
            }
        }

        function renderPlayer() {
            // Smooth movement
            playerX += (targetX - playerX) * 0.2; 
            player.style.left = playerX + '%';
        }

        function gameLoop() {
            if (!isGameRunning) return;

            frameCount++;
            updateRoad();
            updateEnemies();
            renderPlayer();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isGameRunning = false;
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'flex';
        }

        // Start
        init();

</script>
  </body>
</html>
