<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050805" />
  <title>Access Panel</title>

  <style>
    :root{
      --bg:#050805;
      --bg2:#020302;
      --panel:rgba(0, 40, 10, 0.60);
      --panel2:rgba(0, 25, 8, 0.82);
      --line:#00ff66;
      --line2:#8bffb0;
      --text:#d8ffe6;
      --muted:#7cff9a;
      --danger:#ff5c5c;
      --shadow:0 0 18px rgba(0,255,102,.35), 0 0 42px rgba(0,255,102,.12);
      --radius:18px;
      --radius2:14px;
      --maxw: 460px;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body{
      margin:0;
      min-height:100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(0,255,102,.12), transparent 35%),
        linear-gradient(180deg, var(--bg), var(--bg2) 70%);
      color: var(--text);
    }

    body{
      min-height:100svh;
      overflow-x:hidden;
    }

    .scanlines::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.02) 0%,
        rgba(255,255,255,0.00) 2%,
        rgba(255,255,255,0.03) 4%
      );
      background-size:100% 8px;
      opacity:.28;
      mix-blend-mode: screen;
    }

    .wrap{
      min-height:100svh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:
        max(18px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .panel{
      width:min(100%, var(--maxw));
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border: 1px solid rgba(0,255,102,.30);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
      backdrop-filter: blur(10px);
    }

    .panel::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius: var(--radius);
      pointer-events:none;
      border: 1px solid rgba(139,255,176,.10);
      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes pulse{
      0%,100%{ opacity:.35; }
      50%{ opacity:1; }
    }

    .header{
      padding: clamp(18px, 4vw, 24px);
      text-align:center;
      border-bottom: 1px solid rgba(0,255,102,.14);
      background: linear-gradient(180deg, rgba(0,255,102,.07), transparent);
    }

    .title{
      margin:0;
      font-size: clamp(24px, 6vw, 32px);
      letter-spacing: 2px;
      color:#e8fff0;
      text-shadow: 0 0 8px rgba(0,255,102,.7), 0 0 18px rgba(0,255,102,.28);
      line-height:1.1;
    }

    .subtitle{
      margin: 8px 0 0;
      font-size: clamp(12px, 3vw, 14px);
      letter-spacing: 1.2px;
      color: var(--muted);
    }

    .content{
      padding: clamp(16px, 4vw, 22px);
    }

    .box{
      background: rgba(0,0,0,.28);
      border: 1px solid rgba(0,255,102,.18);
      border-radius: var(--radius2);
      padding: clamp(14px, 3.5vw, 16px);
      box-shadow: inset 0 0 18px rgba(0,255,102,.06);
    }

    .label{
      display:block;
      margin: 0 0 8px;
      font-size: 12px;
      font-weight:700;
      letter-spacing: 1.3px;
      color: var(--line2);
    }

    .input{
      width:100%;
      appearance:none;
      border:none;
      outline:none;
      border-radius: 12px;
      padding: 14px 14px;
      font-size: 16px;
      color: var(--text);
      background: rgba(0,0,0,.72);
      border: 1px solid rgba(0,255,102,.30);
      box-shadow: inset 0 0 12px rgba(0,255,102,.06);
      margin-bottom: 12px;
    }

    .input::placeholder{
      color: rgba(216,255,230,.45);
    }

    .row{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .btn{
      width:100%;
      border:none;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      color:#041008;
      background: linear-gradient(180deg, #c5ffd7, #00ff66);
      box-shadow: 0 0 16px rgba(0,255,102,.42);
      cursor:pointer;
      transition: transform .16s ease, filter .16s ease, opacity .16s ease;
      touch-action: manipulation;
    }

    .btn:active{ transform: scale(.985); }
    .btn:hover{ filter: brightness(1.05); }
    .btn[disabled]{ opacity:.55; cursor:not-allowed; }

    .btn-secondary{
      background: transparent;
      color: var(--line);
      border: 1px solid rgba(0,255,102,.40);
      box-shadow: inset 0 0 10px rgba(0,255,102,.05);
    }

    .section{
      margin-top: 14px;
    }

    .progress-wrap{
      display:none;
      margin-top: 14px;
    }

    .progress-label{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      margin-bottom:8px;
      font-size:12px;
      color: var(--muted);
    }

    .bar{
      width:100%;
      height: 12px;
      border-radius: 999px;
      overflow:hidden;
      background: rgba(0,255,102,.10);
      border: 1px solid rgba(0,255,102,.20);
    }

    .bar > span{
      display:block;
      width:0%;
      height:100%;
      background: linear-gradient(90deg, var(--line), var(--line2), var(--line));
      box-shadow: 0 0 14px rgba(0,255,102,.75);
      transition: width .12s linear;
    }

    .status{
      margin-top: 12px;
      min-height: 22px;
      text-align:center;
      font-size: 14px;
      color: var(--text);
      word-break: break-word;
    }

    .result{
      display:none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(0,255,102,.22);
    }

    .code{
      text-align:center;
      font-size: clamp(16px, 4vw, 19px);
      word-break: break-all;
      line-height:1.5;
      color: #eaffef;
      text-shadow: 0 0 10px rgba(0,255,102,.25);
      margin-bottom: 12px;
    }

    .tiny{
      margin-top: 10px;
      text-align:center;
      font-size: 12px;
      color: rgba(216,255,230,.60);
      line-height:1.5;
    }

    .hidden{ display:none; }

    .note{
      margin-top: 12px;
      text-align:center;
      font-size: 12px;
      color: rgba(216,255,230,.45);
    }

    @media (min-width: 720px){
      .panel{
        width: min(100%, 520px);
      }
      .content{
        padding: 24px;
      }
      .btn{
        font-size: 17px;
      }
    }

    @media (max-width: 360px){
      .header{
        padding: 16px;
      }
      .content{
        padding: 14px;
      }
      .input{
        font-size: 15px;
        padding: 13px 12px;
      }
    }
  </style>
</head>
<body class="scanlines">
  <div class="wrap">
    <div class="panel">
      <div class="header">
        <h1 class="title">ACCESS PANEL</h1>
        <p class="subtitle">MOBILE OPTIMIZED • NEON GREEN UI</p>
      </div>

      <div class="content">
        <div class="box" id="loginBox">
          <span class="label">USERNAME</span>
          <input id="user" class="input" type="text" autocomplete="off" placeholder="Enter username" />

          <span class="label">PASSWORD</span>
          <input id="pass" class="input" type="password" autocomplete="off" placeholder="Enter password" />

          <button class="btn" id="loginBtn" onclick="siteLogin()">LOGIN</button>
          <div class="note">Only valid users can open the panel</div>
        </div>

        <div class="box hidden section" id="registerBox">
          <button class="btn" id="regBtn" onclick="startRegister()">GENERATE CODE</button>

          <div class="progress-wrap" id="progressWrap">
            <div class="progress-label">
              <span>Generating code</span>
              <span id="percent">0%</span>
            </div>
            <div class="bar"><span id="barFill"></span></div>
          </div>

          <div class="status" id="status"></div>

          <div class="result" id="resultBox">
            <div class="code" id="codeText"></div>
            <button class="btn btn-secondary" onclick="copyCode()">COPY CODE</button>
          </div>

          <div class="tiny">Code valid for 1 hour • Single use only</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var currentCode = "";
    var siteUsername = "";
    var sitePassword = "";

    function siteLogin() {
      var user = document.getElementById("user").value.trim();
      var pass = document.getElementById("pass").value.trim();

      if (!user || !pass) {
        alert("Enter username and password");
        return;
      }

      var btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.innerText = "CHECKING...";

      fetch("/site-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: user, password: pass })
      })
      .then(function(res){ return res.json(); })
      .then(function(data){
        btn.disabled = false;
        btn.innerText = "LOGIN";

        if (data.status === "success") {
          siteUsername = user;
          sitePassword = pass;
          document.getElementById("loginBox").classList.add("hidden");
          document.getElementById("registerBox").classList.remove("hidden");
          document.getElementById("status").innerHTML = "Login success. You can generate a code now.";
        } else {
          alert("Wrong username or password");
        }
      })
      .catch(function(){
        btn.disabled = false;
        btn.innerText = "LOGIN";
        alert("Server error");
      });
    }

    function startRegister() {
      var btn = document.getElementById("regBtn");
      btn.disabled = true;
      btn.innerText = "WORKING...";

      document.getElementById("status").innerHTML = "Initializing secure session...";
      document.getElementById("progressWrap").style.display = "block";
      document.getElementById("resultBox").style.display = "none";

      var percent = 0;
      var bar = document.getElementById("barFill");
      var p = document.getElementById("percent");

      var fake = setInterval(function () {
        percent += 4;
        if (percent > 100) percent = 100;

        bar.style.width = percent + "%";
        p.innerHTML = percent + "%";

        if (percent < 30) {
          document.getElementById("status").innerHTML = "Checking request...";
        } else if (percent < 60) {
          document.getElementById("status").innerHTML = "Preparing encrypted code...";
        } else if (percent < 90) {
          document.getElementById("status").innerHTML = "Finalizing registration...";
        } else {
          document.getElementById("status").innerHTML = "Generating access code...";
        }

        if (percent >= 100) {
          clearInterval(fake);

          fetch("/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: siteUsername, password: sitePassword })
          })
          .then(function(res){ return res.json(); })
          .then(function(data){
            if (data.status === "success") {
              currentCode = data.code;
              document.getElementById("codeText").innerHTML = data.code;
              document.getElementById("resultBox").style.display = "block";
              document.getElementById("status").innerHTML = "Registration complete. Copy the code below.";
            } else {
              document.getElementById("status").innerHTML = "Access denied.";
            }
            btn.disabled = false;
            btn.innerText = "GENERATE CODE";
          })
          .catch(function(){
            document.getElementById("status").innerHTML = "Server error";
            btn.disabled = false;
            btn.innerText = "GENERATE CODE";
          });
        }
      }, 80);
    }

    function copyCode() {
      if (!currentCode) return;
      navigator.clipboard.writeText(currentCode).then(function () {
        document.getElementById("status").innerHTML = "Code copied to clipboard.";
      });
    }
  </script>
</body>
              </html>
