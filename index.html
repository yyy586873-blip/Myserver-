<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Monitor Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }
        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: var(--accent); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        
        .dashboard-container {
            width: 100%;
            max-width: 600px;
            display: grid;
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            font-size: 0.9rem;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        .data-label { color: var(--text-sub); }
        .data-value { font-weight: bold; color: var(--text-main); }
        
        .status-dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .charging { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .discharging { background-color: #ef4444; }

        /* Log Section */
        .log-entry {
            border-bottom: 1px solid var(--border);
            padding: 10px 0;
            font-size: 0.9rem;
            word-break: break-all;
        }
        .log-time { color: var(--text-sub); font-size: 0.8rem; margin-left: 10px; }

        #loading { color: var(--text-sub); text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

    <h1>📱 System Monitor</h1>

    <div class="dashboard-container">
        <!-- Main Status Card -->
        <div class="card">
            <div class="card-header">Live Status</div>
            <div id="main-display">
                <div style="text-align:center; padding: 20px;">Waiting for connection...</div>
            </div>
        </div>

        <!-- Device Info Card -->
        <div class="card">
            <div class="card-header">Device Info</div>
            <div id="device-info">
                <div class="data-row"><span class="data-label">Model</span><span class="data-value" id="d-model">--</span></div>
                <div class="data-row"><span class="data-label">OS Version</span><span class="data-value" id="d-os">--</span></div>
                <div class="data-row"><span class="data-label">IMEI</span><span class="data-value" id="d-imei">--</span></div>
            </div>
        </div>

        <!-- Recent Logs -->
        <div class="card">
            <div class="card-header">Recent Activity Log</div>
            <div id="logs-container" style="max-height: 200px; overflow-y: auto;">
                <!-- Logs go here -->
            </div>
        </div>
    </div>

    <script>
        let lastLogCount = 0;

        function parseStatData(text) {
            // Simple parser to extract parts from "[STAT] Model: X | OS: Y ..."
            const map = {};
            const parts = text.split('|');
            parts.forEach(part => {
                const [key, val] = part.split(':').map(s => s.trim());
                if(key && val) map[key] = val;
            });
            return map;
        }

        function updateUI(data) {
            if (!data || !data.text) return;

            const info = parseStatData(data.text);
            
            // Update Main Display
            const mainDisplay = document.getElementById('main-display');
            const isCharging = info.Battery && info.Battery.includes("Charging");
            const dotClass = isCharging ? 'charging' : 'discharging';
            
            mainDisplay.innerHTML = `
                <div class="data-row">
                    <span class="data-label">Battery Level</span>
                    <span class="data-value">${info.Battery || 'N/A'}</span>
                </div>
                <div class="data-row">
                    <span class="data-label">Status</span>
                    <span class="data-value"><span class="status-dot ${dotClass}"></span>${isCharging ? 'Charging' : 'Discharging'}</span>
                </div>
                <div class="data-row">
                    <span class="data-label">RAM Usage</span>
                    <span class="data-value">${info.RAM || 'N/A'}</span>
                </div>
                <div class="data-row">
                    <span class="data-label">Active App</span>
                    <span class="data-value" style="color: var(--accent)">${info.App || 'Unknown'}</span>
                </div>
            `;

            // Update Device Info
            document.getElementById('d-model').innerText = info.Model || '--';
            document.getElementById('d-os').innerText = info.OS || '--';
            document.getElementById('d-imei').innerText = info.IMEI || '--';

            // Add to Logs
            const logContainer = document.getElementById('logs-container');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date(data.timestamp).toLocaleTimeString();
            entry.innerHTML = `${data.text.replace('[STAT]', '')} <span class="log-time">${time}</span>`;
            logContainer.prepend(entry);
        }

        // Polling loop
        async function fetchUpdates() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                if(data) updateUI(data);
            } catch(e) { console.error(e); }
        }

        // Initial load and interval
        fetchUpdates();
        setInterval(fetchUpdates, 2000); // Refresh every 2 seconds
    </script>
</body>
</html>
