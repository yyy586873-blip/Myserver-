
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web Minecraft</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Courier New', Courier, monospace; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.8);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255,255,255,0.8);
        }
        #crosshair::before { top: 8px; left: 0; width: 20px; height: 4px; }
        #crosshair::after { top: 0; left: 8px; width: 4px; height: 20px; }

        #ui {
            position: absolute; top: 10px; left: 10px;
            color: white; background: rgba(0,0,0,0.5); padding: 10px;
            pointer-events: none;
        }
        #hotbar {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 5px;
            background: rgba(0,0,0,0.5); padding: 5px;
            border-radius: 5px;
        }
        .slot {
            width: 40px; height: 40px; border: 2px solid #555;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold; color: white;
            cursor: pointer; pointer-events: auto;
        }
        .active { border-color: white; box-shadow: 0 0 5px yellow; }

        #instructions {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); color: white;
            padding: 20px; text-align: center;
            cursor: pointer; z-index: 20;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    
    <div id="ui">
        <div>FPS: <span id="fps">0</span></div>
        <div>Blocks: <span id="blockCount">0</span></div>
    </div>

    <div id="hotbar">
        <div class="slot active" id="slot1" onclick="setBlockType(1)">🟩</div>
        <div class="slot" id="slot2" onclick="setBlockType(2)">🟫</div>
        <div class="slot" id="slot3" onclick="setBlockType(3)">⬛</div>
        <div class="slot" id="slot4" onclick="setBlockType(4)">🟨</div>
        <div class="slot" id="slot5" onclick="setBlockType(5)">🍃</div>
    </div>

    <div id="instructions">
        <h1>Web Minecraft</h1>
        <p>Click to Play</p>
        <p>WASD: Move | Space: Jump | Click: Break/Place</p>
        <p>1-5: Change Block | Mouse: Look</p>
    </div>

    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- Setup Scene ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 80);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false }); // False for performance
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 200, 50);
        scene.add(dirLight);

        // --- Assets & Textures (Procedural) ---
        const materials = [];
        const blockTypes = {
            1: { name: 'Grass', color: '#567d46' },
            2: { name: 'Dirt', color: '#594028' },
            3: { name: 'Stone', color: '#555555' },
            4: { name: 'Wood', color: '#8B4513' },
            5: { name: 'Leaves', color: '#228B22' }
        };

        // Create materials
        for(let i=1; i<=5; i++) {
            materials.push(new THREE.MeshLambertMaterial({ color: blockTypes[i].color }));
        }

        // Shared Geometry
        const boxGeometry = new THREE.BoxGeometry(1, 1, 1);

        // World Data
        const blocks = new THREE.Map(); // Store block data: "x,y,z" -> Mesh
        const objects = []; // Array for raycasting

        // --- World Generation ---
        function createBlock(x, y, z, type) {
            const material = materials[type-1];
            const mesh = new THREE.Mesh(boxGeometry, material);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            objects.push(mesh);
            
            const key = `${x},${y},${z}`;
            blocks.set(key, mesh);
            return mesh;
        }

        function generateWorld() {
            const size = 20; // Small world for performance
            for (let x = -size; x <= size; x++) {
                for (let z = -size; z <= size; z++) {
                    // Simple terrain generation
                    let y = Math.floor(Math.sin(x/5) * 2 + Math.cos(z/5) * 2);
                    
                    // Bedrock/Stone
                    createBlock(x, y, z, 3);
                    // Dirt below
                    createBlock(x, y-1, z, 2);
                    // Grass on top
                    createBlock(x, y+1, z, 1);

                    // Random Trees
                    if (Math.random() < 0.02 && x > -size+2 && x < size-2 && z > -size+2 && z < size-2) {
                        createBlock(x, y+2, z, 4);
                        createBlock(x, y+3, z, 4);
                        createBlock(x, y+4, z, 5);
                        createBlock(x+1, y+4, z, 5);
                        createBlock(x-1, y+4, z, 5);
                        createBlock(x, y+4, z+1, 5);
                        createBlock(x, y+4, z-1, 5);
                    }
                }
            }
            document.getElementById('blockCount').innerText = objects.length;
        }

        generateWorld();

        // --- Player & Controls ---
        const player = {
            height: 1.8,
            speed: 0.1,
            velocity: new THREE.Vector3(),
            direction: new THREE.Vector3(),
            onGround: false
        };

        camera.position.set(0, 10, 0);
        
        // Pointer Lock
        let isLocked = false;
        const instructions = document.getElementById('instructions');
        instructions.addEventListener('click', () => {
            document.body.requestPointerLock();
        });
        document.addEventListener('pointerlockchange', () => {
            isLocked = (document.pointerLockElement === document.body);
            instructions.style.display = isLocked ? 'none' : 'block';
        });

        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let canJump = false;

        document.addEventListener('keydown', (event) => {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = true; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                case 'ArrowRight': case 'KeyD': moveRight = true; break;
                case 'Space': if(canJump) { player.velocity.y += 0.3; canJump = false; } break;
                case 'Digit1': setBlockType(1); break;
                case 'Digit2': setBlockType(2); break;
                case 'Digit3': setBlockType(3); break;
                case 'Digit4': setBlockType(4); break;
                case 'Digit5': setBlockType(5); break;
            }
        });
        document.addEventListener('keyup', (event) => {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = false; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                case 'ArrowRight': case 'KeyD': moveRight = false; break;
            }
        });

        // Mouse Look
        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
        document.addEventListener('mousemove', (event) => {
            if (!isLocked) return;
            const movementX = event.movementX || 0;
            const movementY = event.movementY || 0;
            euler.setFromQuaternion(camera.quaternion);
            euler.y -= movementX * 0.002;
            euler.x -= movementY * 0.002;
            euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
            camera.quaternion.setFromEuler(euler);
        });

        // --- Interaction (Raycasting) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        mouse.x = 0; mouse.y = 0; // Center of screen

        document.addEventListener('mousedown', (event) => {
            if (!isLocked) return;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                
                // Max reach distance
                if(intersect.distance > 6) return;

                if (event.button === 0) { // Left Click: Break
                    scene.remove(intersect.object);
                    objects.splice(objects.indexOf(intersect.object), 1);
                    blocks.delete(`${intersect.object.position.x},${intersect.object.position.y},${intersect.object.position.z}`);
                } else { // Right Click: Place
                    const pos = intersect.point.add(intersect.face.normal.multiplyScalar(0.5)).floor().addScalar(0.5);
                    
                    // Don't place block inside player
                    const playerPos = camera.position.clone();
                    if (Math.abs(playerPos.x - pos.x) < 0.8 && 
                        Math.abs(playerPos.z - pos.z) < 0.8 && 
                        (playerPos.y - 1 < pos.y && playerPos.y > pos.y)) return;

                    createBlock(pos.x, pos.y, pos.z, selectedBlockType);
                }
            }
        });

        // --- Game Logic ---
        let selectedBlockType = 1;
        let frameCount = 0;
        let lastTime = performance.now();

        function setBlockType(type) {
            selectedBlockType = type;
            document.querySelectorAll('.slot').forEach((el, i) => {
                if (i === type-1) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        function checkCollision(newPos) {
            const x = Math.round(newPos.x);
            const y = Math.round(newPos.y - 1.5); // Check feet
            const z = Math.round(newPos.z);
            
            // Check feet and head
            if (blocks.has(`${x},${y},${z}`) || blocks.has(`${x},${y+1},${z}`)) {
                return true;
            }
            return false;
        }

        function update() {
            const dt = (performance.now() - lastTime) / 1000;
            lastTime = performance.now();
            document.getElementById('fps').innerText = Math.round(1/dt);

            if (!isLocked) {
                requestAnimationFrame(update);
                renderer.render(scene, camera);
                return;
            }

            // Friction
            player.velocity.x -= player.velocity.x * 10.0 * dt;
            player.velocity.z -= player.velocity.z * 10.0 * dt;
            player.velocity.y -= 9.8 * 2.0 * dt; // Gravity

            player.direction.z = Number(moveForward) - Number(moveBackward);
            player.direction.x = Number(moveRight) - Number(moveLeft);
            player.direction.normalize();

            if (moveForward || moveBackward) player.velocity.z -= player.direction.z * 40.0 * dt;
            if (moveLeft || moveRight) player.velocity.x -= player.direction.x * 40.0 * dt;

            // Simple collision detection (AABB)
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            
            // X Axis Move
            camera.position.x -= player.velocity.x * dt * Math.cos(euler.y);
            camera.position.z -= player.velocity.z * dt * Math.sin(euler.y);
            
            // Check Y collision (Ground)
            const feetY = camera.position.y - player.height;
            const blockX = Math.round(camera.position.x);
            const blockY = Math.round(feetY);
            const blockZ = Math.round(camera.position.z);

            if (blocks.has(`${blockX},${blockY},${blockZ}`)) {
                player.velocity.y = Math.max(0, player.velocity.y);
                canJump = true;
                camera.position.y = blockY + 1 + player.height/2; // Snap to top of block
            } else {
                camera.position.y += player.velocity.y * dt;
                // Fall into void
                if(camera.position.y < -20) camera.position.y = 20;
            }

            renderer.render(scene, camera);
            requestAnimationFrame(update);
        }

        // Start
        update();
        
        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
