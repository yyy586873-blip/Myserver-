
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon 3D Runner - Fixed</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none; /* Prevents zoom/scroll on mobile */
        }
        #canvas-container {
            width: 100%;
            height: 100vh;
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 5px #00ffff;
            z-index: 10;
            pointer-events: none;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border: 2px solid #ff00ff;
            border-radius: 10px;
            box-shadow: 0 0 20px #ff00ff;
            z-index: 20;
            width: 80%;
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 40px;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
        }
        button {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 10px #00ffff;
            width: 100%;
        }
        button:active {
            transform: scale(0.95);
            background: #fff;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.6);
            pointer-events: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="ui">Score: <span id="score">0</span></div>
    
    <div id="game-over">
        <h1>CRASH!</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button id="restart-btn">TRY AGAIN</button>
    </div>

    <div id="instructions">Swipe Left/Right to Move</div>
    <div id="canvas-container"></div>

    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Variables ---
        var scene, camera, renderer;
        var player, floor, gridHelper;
        var obstacles = [];
        var score = 0;
        var gameSpeed = 0.6;
        var isGameOver = false;
        
        // Lane Logic
        var lanes = [-3, 0, 3]; // Left, Center, Right
        var currentLane = 1; 
        var targetX = 0;
        
        // Touch Variables
        var touchStartX = 0;
        var touchEndX = 0;

        // --- Initialization ---
        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            scene.fog = new THREE.Fog(0x111111, 10, 50);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 6, 12); // Higher up to see ahead
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lights
            var ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 15, 5);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            // Player (Neon Cube)
            var playerGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            var playerMat = new THREE.MeshStandardMaterial({ 
                color: 0x00ffff, 
                emissive: 0x005555,
                emissiveIntensity: 0.8
            });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.castShadow = true;
            player.position.y = 0.6;
            scene.add(player);

            // Floor Grid
            var gridSize = 400;
            var gridDivisions = 80;
            gridHelper = new THREE.GridHelper(gridSize, gridDivisions, 0xff00ff, 0x222222);
            scene.add(gridHelper);

            // Floor Plane (Shadow Receiver)
            var floorGeo = new THREE.PlaneGeometry(400, 400);
            var floorMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a });
            floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -0.01;
            floor.receiveShadow = true;
            scene.add(floor);

            // Event Listeners
            window.addEventListener('resize', onResize, false);
            
            // Touch Events
            document.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, false);

            document.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, false);

            // Keyboard Support
            document.addEventListener('keydown', function(e) {
                if (isGameOver) return;
                if (e.key === 'ArrowLeft' || e.key === 'a') changeLane(-1);
                if (e.key === 'ArrowRight' || e.key === 'd') changeLane(1);
            });
            
            document.getElementById('restart-btn').addEventListener('click', resetGame);

            animate();
        }

        // --- Input Logic ---
        function handleSwipe() {
            var threshold = 30; // Minimum swipe distance
            if (touchEndX < touchStartX - threshold) {
                changeLane(-1); // Swipe Left
            } else if (touchEndX > touchStartX + threshold) {
                changeLane(1);  // Swipe Right
            }
        }

        function changeLane(direction) {
            var newLaneIndex = currentLane + direction;
            if (newLaneIndex >= 0 && newLaneIndex < lanes.length) {
                currentLane = newLaneIndex;
                targetX = lanes[currentLane];
            }
        }

        // --- Game Loop ---
        function spawnObstacle() {
            var geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            var material = new THREE.MeshStandardMaterial({ 
                color: 0xff0000,
                emissive: 0x440000,
                emissiveIntensity: 0.6
            });
            var obstacle = new THREE.Mesh(geometry, material);
            
            var laneIndex = Math.floor(Math.random() * 3);
            obstacle.position.x = lanes[laneIndex];
            obstacle.position.y = 0.75;
            obstacle.position.z = -60; // Spawn far away
            obstacle.castShadow = true;
            obstacle.receiveShadow = true;
            
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function animate() {
            if (!isGameOver) {
                requestAnimationFrame(animate);
            }
            
            // Smooth Player Movement (Lerp)
            player.position.x += (targetX - player.position.x) * 0.15;
            
            // Visual tilt when moving
            player.rotation.z = (player.position.x - targetX) * -0.05;
            player.rotation.x += 0.05; // Rolling effect

            // Move Grid
            gridHelper.position.z += gameSpeed;
            if (gridHelper.position.z > 10) {
                gridHelper.position.z = 0;
            }

            // Spawn Logic
            // Spawn rate increases as score increases
            var spawnChance = 0.03 + (score * 0.0001);
            if (Math.random() < spawnChance) {
                spawnObstacle();
            }

            // Update Obstacles
            for (var i = obstacles.length - 1; i >= 0; i--) {
                var obs = obstacles[i];
                obs.position.z += gameSpeed;

                // Collision Detection (AABB)
                var playerBox = new THREE.Box3().setFromObject(player);
                var obsBox = new THREE.Box3().setFromObject(obs);
                
                // Make collision box slightly smaller for fairness
                playerBox.expandByScalar(-0.2);
                obsBox.expandByScalar(-0.2);

                if (playerBox.intersectsBox(obsBox)) {
                    gameOver();
                }

                // Remove if passed camera
                if (obs.position.z > 10) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;
                    
                    // Increase difficulty
                    if (gameSpeed < 1.5) {
                        gameSpeed += 0.002;
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = score;
        }

        function resetGame() {
            // Clear obstacles
            for (var i = obstacles.length - 1; i >= 0; i--) {
                scene.remove(obstacles[i]);
            }
            obstacles = [];
            
            score = 0;
            gameSpeed = 0.6;
            currentLane = 1;
            targetX = 0;
            player.position.x = 0;
            player.rotation.set(0,0,0);
            
            document.getElementById('score').innerText = '0';
            document.getElementById('game-over').style.display = 'none';
            
            isGameOver = false;
            animate();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start the game
        init();

    </script>
</body>
</html>
