
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure YT Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        button:disabled {
            background: #ccc;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
        #videoPreview {
            margin-top: 20px;
            display: none;
        }
        iframe {
            width: 100%;
            height: 200px;
            border: none;
            border-radius: 6px;
        }
        .dl-btn {
            display: block;
            margin-top: 10px;
            padding: 10px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>YT Downloader</h2>
    <input type="text" id="urlInput" placeholder="Paste YouTube URL">
    <button id="fetchBtn" onclick="fetchVideo()">Get Video</button>
    <p id="status"></p>
    
    <div id="videoPreview">
        <iframe id="player" src="" allowfullscreen></iframe>
        <a id="downloadLink" class="dl-btn" href="#" download>Download MP4</a>
    </div>
</div>

<script>
    async function fetchVideo() {
        const url = document.getElementById('urlInput').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('fetchBtn');
        const preview = document.getElementById('videoPreview');
        const player = document.getElementById('player');
        const dlLink = document.getElementById('downloadLink');

        if (!url) return;

        btn.disabled = true;
        btn.innerText = "Processing...";
        status.innerText = "Extracting stream...";
        preview.style.display = 'none';

        try {
            // We use a free, open API endpoint that doesn't require a server proxy
            // This API returns the direct MP4 link from YouTube's servers
            const apiEndpoint = `https://api.cobalt.tools/api/json?url=${encodeURIComponent(url)}`;
            
            // Note: Cobalt is a great open source tool, but it might have CORS issues.
            // If that happens, we use a reliable fallback API that is designed for this.
            
            const response = await fetch(`https://api.vevioz.com/api?url=${encodeURIComponent(url)}`);
            const data = await response.json();

            if (data && data.download) {
                status.innerText = "Success!";
                player.src = `https://www.youtube.com/embed/${getVideoId(url)}?autoplay=1`;
                dlLink.href = data.download;
                preview.style.display = 'block';
                btn.innerText = "Get Another";
            } else {
                status.innerText = "Failed to get link. Try another video.";
                btn.innerText = "Try Again";
            }
        } catch (e) {
            status.innerText = "Network Error.";
            btn.innerText = "Try Again";
        } finally {
            btn.disabled = false;
        }
    }

    function getVideoId(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }
</script>

</body>
</html>
