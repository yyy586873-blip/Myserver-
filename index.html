<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="theme-color" content="#080b20">
 <title>File Store</title>
 <style>
 :root {
 --bg: #070918;
 --card: rgba(21, 25, 55, .86);
 --card-2: rgba(12, 19, 43, .92);
 --text: #f5f6ff;
 --muted: #949abd;
 --border: rgba(147, 134, 255, .2);
 --primary: #684fff;
 --secondary: #0095ff;
 --danger: #ff5f75;
 }
 * {
 box-sizing: border-box;
 }
 body {
 margin: 0;
 min-height: 100vh;
 padding: 28px 16px;
 color: var(--text);
 font-family: Inter, system-ui, Arial, sans-serif;
 background:
 radial-gradient(circle at 10% 5%, rgba(101, 77, 255, .22), transparen
 radial-gradient(circle at 90% 10%, rgba(0, 157, 255, .16), transparen
 var(--bg);
 }
 button,
 input {
 font: inherit;
 }
 button {
 -webkit-tap-highlight-color: transparent;
 }
 .app {
 width: min(100%, 980px);
 margin: auto;
 }
 .header {
 margin-bottom: 22px;
 text-align: center;
 }
.logo {
 width: 64px;
 height: 64px;
 display: grid;
 place-items: center;
 margin: auto;
 border-radius: 20px;
 font-size: 32px;
 background: linear-gradient(135deg, #654dff, #009aff);
 box-shadow: 0 15px 40px rgba(40, 95, 255, .3);
 }
 h1 {
 margin: 13px 0 5px;
 font-size: clamp(24px, 5vw, 34px);
 }
 .subtitle {
 margin: 0;
 color: var(--muted);
 font-size: 13px;
 }
 .search-area {
 display: flex;
 gap: 10px;
 margin-bottom: 12px;
 }
 .search-box {
 position: relative;
 flex: 1;
 }
 .search-icon {
 position: absolute;
 top: 50%;
 left: 15px;
 color: var(--muted);
 transform: translateY(-50%);
 pointer-events: none;
 }
 .search {
 width: 100%;
 padding: 14px 40px 14px 43px;
 border: 1px solid var(--border);
 outline: none;
 border-radius: 14px;
 color: var(--text);
 background: rgba(18, 21, 45, .82);
 box-shadow: inset 0 1px rgba(255, 255, 255, .04);
 }
 .search:focus {
 border-color: rgba(0, 156, 255, .7);box-shadow: 0 0 0 3px rgba(0, 156, 255, .12);
 }
 .clear-search {
 position: absolute;
 top: 50%;
 right: 10px;
 display: none;
 width: 27px;
 height: 27px;
 border: 0;
 border-radius: 50%;
 color: white;
 background: rgba(255, 255, 255, .12);
 cursor: pointer;
 transform: translateY(-50%);
 }
 .refresh,
 .retry,
 .ready-button {
 border: 0;
 border-radius: 13px;
 color: white;
 background: linear-gradient(135deg, var(--primary), var(--secondary));
 font-weight: 800;
 cursor: pointer;
 }
 .refresh {
 min-width: 105px;
 padding: 0 16px;
 }
 .refresh:disabled {
 opacity: .6;
 cursor: wait;
 }
 .status {
 min-height: 20px;
 margin: 0 0 13px;
 color: var(--muted);
 font-size: 12px;
 }
 .file-grid {
 display: grid;
 grid-template-columns: repeat(2, minmax(0, 1fr));
 gap: 15px;
 }
 .file-card {
 position: relative;
 min-width: 0;
 min-height: 205px;
display: flex;
 flex-direction: column;
 justify-content: space-between;
 overflow: hidden;
 padding: 17px;
 border: 1px solid var(--border);
 border-radius: 19px;
 background: linear-gradient(145deg, var(--card), var(--card-2));
 box-shadow:
 0 12px 30px rgba(0, 0, 0, .28),
 inset 0 1px rgba(255, 255, 255, .05);
 isolation: isolate;
 transition: .2s ease;
 }
 .file-card:hover {
 border-color: rgba(73, 180, 255, .65);
 transform: translateY(-4px);
 }
 .file-card::before {
 position: absolute;
 inset: 0;
 content: "";
 background: linear-gradient(
 110deg,
 transparent 25%,
 rgba(255, 255, 255, .08) 50%,
 transparent 75%
 );
 transform: translateX(-100%);
 animation: shine 5s infinite;
 pointer-events: none;
 }
 @keyframes shine {
 65%, 100% {
 transform: translateX(100%);
 }
 }
 .file-top {
 display: flex;
 align-items: flex-start;
 gap: 12px;
 }
 .file-icon {
 flex: 0 0 auto;
 width: 55px;
 height: 55px;
 display: grid;
 place-items: center;
 border: 1px solid rgba(155, 145, 255, .25);
 border-radius: 16px;
 font-size: 28px;
background: linear-gradient(
 135deg,
 rgba(107, 88, 255, .25),
 rgba(0, 163, 255, .2)
 );
 }
 .file-name {
 min-width: 0;
 margin-top: 3px;
 overflow: hidden;
 color: #f4f3ff;
 font-size: 14px;
 font-weight: 800;
 line-height: 1.45;
 word-break: break-word;
 display: -webkit-box;
 -webkit-line-clamp: 3;
 -webkit-box-orient: vertical;
 }
 .file-meta {
 margin-top: 10px;
 color: var(--muted);
 font-size: 11px;
 }
 .download {
 position: relative;
 width: 100%;
 margin-top: 17px;
 padding: 12px;
 overflow: hidden;
 border: 0;
 border-radius: 11px;
 color: white;
 background: linear-gradient(135deg, #694dff, #158fff);
 font-size: 12px;
 font-weight: 900;
 cursor: pointer;
 box-shadow: 0 7px 20px rgba(37, 109, 255, .22);
 }
 .download::after {
 position: absolute;
 inset: 0 auto 0 -100%;
 width: 60%;
 content: "";
 background: linear-gradient(
 90deg,
 transparent,
 rgba(255, 255, 255, .3),
 transparent
 );
 animation: buttonShine 3.5s infinite;
 }
@keyframes buttonShine {
 45%, 100% {
 left: 150%;
 }
 }
 .download:active,
 .ready-button:active,
 .refresh:active {
 transform: scale(.97);
 }
 .loading,
 .empty,
 .error {
 grid-column: 1 / -1;
 padding: 48px 20px;
 text-align: center;
 border: 1px solid var(--border);
 border-radius: 17px;
 color: var(--muted);
 background: rgba(19, 20, 42, .72);
 }
 .error {
 color: #ffadb8;
 }
 .retry {
 margin-top: 15px;
 padding: 10px 18px;
 }
 .modal {
 position: fixed;
 inset: 0;
 z-index: 1000;
 display: none;
 place-items: center;
 padding: 18px;
 background: rgba(3, 4, 15, .8);
 backdrop-filter: blur(10px);
 }
 .modal.show {
 display: grid;
 }
 .modal-box {
 width: min(100%, 350px);
 padding: 26px;
 text-align: center;
 border: 1px solid rgba(128, 113, 255, .3);
 border-radius: 23px;
 background: linear-gradient(145deg, rgba(29, 25, 67, .98), rgba(8, 20, 43box-shadow: 0 25px 80px rgba(0, 0, 0, .55);
 animation: modalIn .22s ease;
 }
 @keyframes modalIn {
 from {
 opacity: 0;
 transform: scale(.9);
 }
 to {
 opacity: 1;
 transform: scale(1);
 }
 }
 .count-number {
 width: 88px;
 height: 88px;
 display: grid;
 place-items: center;
 margin: 0 auto 18px;
 border: 2px solid rgba(101, 147, 255, .55);
 border-radius: 50%;
 font-size: 38px;
 font-weight: 900;
 background: radial-gradient(circle, rgba(81, 101, 255, .35), rgba(8, 15, 
 box-shadow: 0 0 30px rgba(70, 114, 255, .28);
 }
 .count-number.pulse {
 animation: countPulse .55s ease;
 }
 @keyframes countPulse {
 0% {
 opacity: 0;
 transform: scale(.55);
 }
 70% {
 opacity: 1;
 transform: scale(1.08);
 }
 100% {
 transform: scale(1);
 }
 }
 .modal-title {
 margin-bottom: 7px;
 color: #f2f2ff;
 font-size: 17px;
 font-weight: 900;
 }
 .modal-text {
 color: #9298b6;font-size: 12px;
 line-height: 1.6;
 }
 .ready-button {
 width: 100%;
 margin-top: 17px;
 padding: 12px;
 }
 .close-button {
 width: 100%;
 margin-top: 9px;
 padding: 10px;
 border: 1px solid rgba(255, 255, 255, .12);
 border-radius: 11px;
 color: var(--muted);
 background: transparent;
 cursor: pointer;
 }
 .hidden {
 display: none !important;
 }
 @media (max-width: 600px) {
 body {
 padding: 18px 12px;
 }
 .file-grid {
 gap: 10px;
 }
 .file-card {
 min-height: 185px;
 padding: 13px;
 border-radius: 16px;
 }
 .file-top {
 display: block;
 }
 .file-icon {
 width: 47px;
 height: 47px;
 font-size: 24px;
 border-radius: 13px;
 }
 .file-name {
 margin-top: 12px;
 font-size: 13px;
 }.download {
 margin-top: 13px;
 padding: 10px 6px;
 font-size: 10px;
 }
 .refresh {
 min-width: 85px;
 padding: 0 11px;
 }
 }
 @media (max-width: 360px) {
 .file-grid {
 grid-template-columns: 1fr;
 }
 }
 @media (prefers-reduced-motion: reduce) {
 *,
 *::before,
 *::after {
 animation-duration: .01ms !important;
 animation-iteration-count: 1 !important;
 transition-duration: .01ms !important;
 }
 }
 </style>
</head>
<body>
 <main class="app">
 <header class="header">
 <div class="logo"> </div>
 <h1>File Store</h1>
 <p class="subtitle">Search and download your files easily</p>
 </header>
 <section class="search-area">
 <div class="search-box">
 <span class="search-icon">⌕</span>
 <input
 id="search"
class="search"
type="search"
placeholder="Search files..."
autocomplete="off"
 aria-label="Search files"
 >
 <button id="clearSearch" class="clear-search" type="button" aria-labe
 ×
 </button>
 </div>
 <button id="refreshButton" class="refresh" type="button">
 ↻ Refresh
</button>
 </section>
 <div id="status" class="status" aria-live="polite">Loading files...</div>
 <section id="files" class="file-grid" aria-live="polite"></section>
 </main>
 <div
 id="downloadModal"
 class="modal"
 role="dialog"
 aria-modal="true"
 aria-labelledby="modalTitle"
 aria-describedby="modalText"
 >
 <div class="modal-box">
 <div id="countNumber" class="count-number">3</div>
 <div id="modalTitle" class="modal-title">Preparing Download</div>
 <div id="modalText" class="modal-text">Please wait...</div>
 <button id="readyButton" class="ready-button hidden" type="button">
 Download
 </button>
 <button id="closeButton" class="close-button" type="button">
 Cancel
 </button>
 </div>
 </div>
 <script>
 "use strict";
 const state = {
 files: [],
 selectedUrl: "",
 timer: null,
 controller: null
 };
 const elements = {
 files: document.getElementById("files"),
 search: document.getElementById("search"),
 status: document.getElementById("status"),
 modal: document.getElementById("downloadModal"),
 count: document.getElementById("countNumber"),
 modalText: document.getElementById("modalText"),
 ready: document.getElementById("readyButton"),
 refresh: document.getElementById("refreshButton"),
 clearSearch: document.getElementById("clearSearch"),
 close: document.getElementById("closeButton")
 };
 function getIcon(name) {
 const ext = name.toLowerCase().split(".").pop();
const icons = {
 mp4: " ", mkv: " ", avi: " ", mov: " ", webm: " ",
 mp3: " ", wav: " ", ogg: " ", m4a: " ",
 jpg: "️", jpeg: "️", png: "️", gif: "️", webp: "️",
 zip: " ", rar: " ", "7z": " ",
 pdf: " ", apk: " ", js: " ", html: " ",
 css: " ", py: " ", java: "☕", txt: " "
 };
 return icons[ext] || " ";
 }
 function formatSize(bytes) {
 if (!Number.isFinite(Number(bytes)) || Number(bytes) <= 0) {
 return "Size unavailable";
 }
 const units = ["B", "KB", "MB", "GB", "TB"];
 let size = Number(bytes);
 let index = 0;
 while (size >= 1024 && index < units.length - 1) {
 size /= 1024;
 index++;
 }
 return `${size.toFixed(index === 0 ? 0 : 1)} ${units[index]}`;
 }
 function formatDate(value) {
 if (!value) return "";
 const date = new Date(value);
 if (Number.isNaN(date.getTime())) return "";
 return date.toLocaleDateString(undefined, {
 day: "2-digit",
 month: "short",
 year: "numeric"
 });
 }
 function createFileCard(file) {
 const card = document.createElement("article");
 card.className = "file-card";
 const top = document.createElement("div");
 top.className = "file-top";
 const icon = document.createElement("div");
 icon.className = "file-icon";
 icon.textContent = getIcon(file.name);
 icon.setAttribute("aria-hidden", "true");
 const name = document.createElement("div");
 name.className = "file-name";
name.textContent = file.name;
 const meta = document.createElement("div");
 meta.className = "file-meta";
 const size = formatSize(file.size);
 const date = formatDate(file.modified);
 meta.textContent = date ? `${size} • ${date}` : size;
 const button = document.createElement("button");
 button.className = "download";
 button.type = "button";
 button.textContent = "DOWNLOAD";
 button.addEventListener("click", () => {
 prepareDownload(file.name);
 });
 top.append(icon, name);
 card.append(top, meta, button);
 return card;
 }
 function renderFiles(list) {
 elements.files.replaceChildren();
 if (!list.length) {
 const empty = document.createElement("div");
 empty.className = "empty";
 empty.textContent = "No files found.";
 elements.files.appendChild(empty);
 return;
 }
 const fragment = document.createDocumentFragment();
 list.forEach(file => {
 if (!file || typeof file.name !== "string") return;
 fragment.appendChild(createFileCard(file));
 });
 elements.files.appendChild(fragment);
 }
 function showLoading() {
 elements.files.innerHTML = '<div class="loading">Loading files...</div>';
 }
 async function loadFiles() {
 if (state.controller) {
 state.controller.abort();
 }
 state.controller = new AbortController();
 const timeout = setTimeout(() => state.controller.abort(), 10000);
elements.refresh.disabled = true;
 elements.refresh.textContent = "Loading...";
 elements.status.textContent = "Loading files...";
 showLoading();
 try {
 const response = await fetch("/file-list", {
 method: "GET",
cache: "no-store",
signal: state.controller.signal,
 headers: {
 Accept: "application/json"
 }
 });
 if (!response.ok) {
 throw new Error(`Server error: ${response.status}`);
 }
 const data = await response.json();
 if (!data.ok || !Array.isArray(data.files)) {
 throw new Error("Invalid server response");
 }
 state.files = data.files
 .filter(file => file && typeof file.name === "string")
 .sort((a, b) => a.name.localeCompare(b.name));
 applySearch();
 elements.status.textContent = `${state.files.length} file(s) availabl
 } catch (error) {
 if (error.name === "AbortError") {
 elements.status.textContent = "Request timed out or cancelled.";
 } else {
 elements.status.textContent = error.message;
 }
 elements.files.innerHTML = `
 <div class="error">
 Unable to load files.
 <br>
 <button class="retry" type="button" onclick="loadFiles()">Try
 </div>
 `;
 } finally {
 clearTimeout(timeout);
 elements.refresh.disabled = false;
 elements.refresh.textContent = "↻ Refresh";
 }
 }
 function applySearch() {
 const query = elements.search.value.trim().toLowerCase();
 elements.clearSearch.style.display = query ? "block" : "none";
const filtered = state.files.filter(file =>
 file.name.toLowerCase().includes(query)
 );
 renderFiles(filtered);
 elements.status.textContent = query
 ? `${filtered.length} result(s) found`
 : `${state.files.length} file(s) available`;
 }
 function animateCounter() {
 elements.count.classList.remove("pulse");
 void elements.count.offsetWidth;
 elements.count.classList.add("pulse");
 }
 function prepareDownload(fileName) {
 closeModal();
 state.selectedUrl = `/download/${encodeURIComponent(fileName)}`;
 elements.modal.classList.add("show");
 elements.ready.classList.add("hidden");
 elements.count.textContent = "3";
 elements.modalText.textContent = "Preparing your download...";
 animateCounter();
 let count = 3;
 state.timer = setInterval(() => {
 count--;
 if (count > 0) {
 elements.count.textContent = count;
 animateCounter();
return;
 }
 clearInterval(state.timer);
 state.timer = null;
 elements.count.textContent = "✓";
 elements.modalText.textContent = "Your download is ready.";
 elements.ready.classList.remove("hidden");
 }, 1000);
 }
 function startDownload() {
 if (!state.selectedUrl) return;
 const link = document.createElement("a");
 link.href = state.selectedUrl;
 link.download = "";
 link.rel = "noopener";
document.body.appendChild(link);
 link.click();
 link.remove();
 closeModal();
 }
 function closeModal() {
 if (state.timer) {
 clearInterval(state.timer);
 state.timer = null;
 }
 state.selectedUrl = "";
 elements.modal.classList.remove("show");
 }
 elements.search.addEventListener("input", applySearch);
 elements.clearSearch.addEventListener("click", () => {
 elements.search.value = "";
 elements.search.focus();
 applySearch();
 });
 elements.refresh.addEventListener("click", loadFiles);
 elements.ready.addEventListener("click", startDownload);
 elements.close.addEventListener("click", closeModal);
 elements.modal.addEventListener("click", event => {
 if (event.target === elements.modal) {
 closeModal();
 }
 });
 document.addEventListener("keydown", event => {
 if (event.key === "Escape") {
 closeModal();
 }
 });
 loadFiles();
 </script>
</body>
</html>
