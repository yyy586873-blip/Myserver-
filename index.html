
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fixed VR TV Mode</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            touch-action: none;
        }

        /* 1. REAL CAMERA BACKGROUND (The Room) */
        #camera-stream {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            /* Mirror selfie cam for better UX, remove if you want rear cam view */
            transform: scaleX(-1); 
        }

        /* 2. THE FIXED SCREEN (The TV on the wall) */
        .tv-screen-container {
            position: fixed;
            top: 50%;
            left: 50%;
            /* Center it */
            transform: translate(-50%, -50%);
            
            /* Size of the TV */
            width: 70vw; 
            height: 45vh;
            
            /* No border, just shadow for depth */
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            z-index: 10;
            
            /* Keep it flat and facing you */
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        /* The actual video element */
        .tv-video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures video fits without stretching */
            display: block;
            background: #000;
        }

        /* 3. UI CONTROLS (Hidden by default, shown on tap) */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 10px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .controls:hover {
            opacity: 1;
        }

        button, label.file-label {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid #fff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }

        input[type="file"] {
            display: none;
        }

        /* Vignette to make it feel like a headset */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
            background: radial-gradient(circle, transparent 60%, black 100%);
        }

        /* Status Message */
        #status {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: yellow;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 100;
            display: none;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Status Msg -->
    <div id="status"></div>

    <!-- Background Camera -->
    <video id="camera-stream" autoplay playsinline muted></video>

    <!-- Fixed TV Screen -->
    <div class="tv-screen-container">
        <video id="movie-player" class="tv-video" loop controlsList="nodownload">
            <!-- Source will be set by JS -->
        </video>
    </div>

    <!-- Vignette Effect -->
    <div class="vignette"></div>

    <!-- Controls -->
    <div class="controls">
        <label for="file-upload" class="file-label">📂 Load Local Video</label>
        <input type="file" id="file-upload" accept="video/*">
        <button onclick="togglePlay()">⏯ Play/Pause</button>
        <button onclick="toggleFullscreen()">🖥 Fullscreen</button>
    </div>

    <script>
        const camera = document.getElementById('camera-stream');
        const player = document.getElementById('movie-player');
        const fileInput = document.getElementById('file-upload');
        const statusDiv = document.getElementById('status');

        // 1. Start Camera
        async function startCamera() {
            try {
                // Try rear camera first, fallback to front
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                camera.srcObject = stream;
                showStatus("✅ Camera Active");
            } catch (err) {
                console.error(err);
                showStatus("❌ Camera Error: Check Permissions");
            }
        }

        // 2. Handle Local File Upload
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                player.src = url;
                player.play();
                showStatus("✅ Video Loaded!");
            }
        });

        // 3. Play/Pause
        function togglePlay() {
            if (player.paused) player.play();
            else player.pause();
        }

        // 4. Fullscreen Toggle
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Helper
        function showStatus(msg) {
            statusDiv.textContent = msg;
            statusDiv.style.display = 'block';
            setTimeout(() => statusDiv.style.display = 'none', 3000);
        }

        // Init
        startCamera();
    </script>
</body>
</html>
