<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>
body {
    background:black;
    color:red;
    font-family:Arial;
    text-align:center;
    padding-top:50px;
}

button {
    padding:15px;
    background:red;
    border:none;
    color:white;
    margin-top:20px;
}

.box {
    margin-top:30px;
}
</style>
</head>

<body>

<h1>🔥 ACCESS SYSTEM</h1>

<button onclick="register()">Generate Code</button>

<div class="box">
    <p id="code"></p>
    <button onclick="copy()">Copy</button>
</div>

<script>
let current = "";

function register(){
    fetch("/register")
    .then(res => res.json())
    .then(data => {
        current = data.code;
        document.getElementById("code").innerText = data.code;
    });
}

function copy(){
    navigator.clipboard.writeText(current);
    alert("Copied!");
}
</script>

</body>
</html>
