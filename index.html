<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SecureChat</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --chat-bg: #161b22;
            --input-bg: #21262d;
            --primary: #58a6ff;
            --sent-msg: #1f6feb;
            --recv-msg: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            background: var(--chat-bg);
            padding: 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .logo { font-weight: 700; font-size: 1.2rem; color: var(--primary); letter-spacing: 1px; }
        .user-id { font-size: 0.8rem; color: var(--text-muted); }

        /* Chat Area */
        #messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-sent {
            align-self: flex-end;
            background: var(--sent-msg);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg-received {
            align-self: flex-start;
            background: var(--recv-msg);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .meta {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }

        /* Poll Styles */
        .poll-container {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 10px;
            margin-top: 5px;
        }
        .poll-option {
            display: block;
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            color: var(--text-main);
            transition: 0.2s;
        }
        .poll-option:hover { background: var(--border); }
        .poll-option.voted { background: var(--primary); color: white; border-color: var(--primary); }

        /* Typing Indicator */
        #typing-indicator {
            padding: 5px 15px;
            font-size: 0.8rem;
            color: var(--primary);
            height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .dots span {
            display: inline-block;
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            margin-right: 2px;
            animation: bounce 1s infinite;
        }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Input Area */
        .input-area {
            background: var(--chat-bg);
            padding: 10px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 20px;
            font-size: 1rem;
        }

        button.icon-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 10px;
        }

        button.send-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Modal for Polls */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--chat-bg);
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 300px;
            border: 1px solid var(--border);
        }
        .modal input { width: 100%; margin-bottom: 10px; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; }
        .btn-cancel { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 5px; }
        .btn-confirm { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 5px; }

    </style>
</head>
<body>

    <header>
        <div class="logo">SECURE_CHAT</div>
        <div class="user-id" id="userIdDisplay">Loading ID...</div>
    </header>

    <div id="messages-container">
        <!-- Messages will appear here -->
    </div>

    <div id="typing-indicator"><span class="dots"><span></span><span></span><span></span></span> Typing...</div>

    <div class="input-area">
        <button class="icon-btn" onclick="openPollModal()">📊</button>
        <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <!-- Poll Modal -->
    <div id="pollModal" class="modal">
        <div class="modal-content">
            <h3>Create Poll</h3>
            <input type="text" id="pollQuestion" placeholder="Question?">
            <input type="text" id="pollOpt1" placeholder="Option 1">
            <input type="text" id="pollOpt2" placeholder="Option 2">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closePollModal()">Cancel</button>
                <button class="btn-confirm" onclick="createPoll()">Post</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIG & STATE ---
        const SERVER_URL = window.location.origin; 
        let myId = localStorage.getItem('chat_user_id');
        if (!myId) {
            myId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('chat_user_id', myId);
        }
        document.getElementById('userIdDisplay').innerText = `ID: ${myId.substr(-6)}`;

        let messages = [];
        let pollingInterval;
        let typingTimeout;

        // --- INIT ---
        window.onload = () => {
            fetchMessages();
            setInterval(fetchMessages, 1000); // Poll server every second
            
            const input = document.getElementById('msgInput');
            input.addEventListener('input', handleTyping);
            input.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') sendMessage();
            });
        };

        // --- API FUNCTIONS ---
        async function fetchMessages() {
            try {
                const res = await fetch(`${SERVER_URL}/api/messages`);
                const data = await res.json();
                
                // Only update if data changed to avoid flickering
                if(JSON.stringify(data.messages) !== JSON.stringify(messages)) {
                    messages = data.messages;
                    renderMessages();
                }
                
                // Check for typing status from others
                if(data.typing && data.typing !== myId) {
                    showTyping(true);
                } else {
                    showTyping(false);
                }
            } catch (e) { console.error("Fetch error", e); }
        }

        async function sendMessage(text = null) {
            const input = document.getElementById('msgInput');
            const msgText = text || input.value.trim();
            if (!msgText) return;

            const payload = {
                action: 'send',
                id: myId,
                text: msgText,
                timestamp: Date.now()
            };

            await fetch(`${SERVER_URL}/api/messages`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            input.value = '';
            input.focus();
        }

        async function setTypingStatus(isTyping) {
            await fetch(`${SERVER_URL}/api/status`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id: myId, typing: isTyping })
            });
        }

        function handleTyping() {
            showTyping(true);
            setTypingStatus(true);
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                showTyping(false);
                setTypingStatus(false);
            }, 2000);
        }

        // --- RENDER UI ---
        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';

            messages.forEach(msg => {
                const div = document.createElement('div');
                
                if (msg.type === 'poll') {
                    div.className = `message ${msg.sender === myId ? 'msg-sent' : 'msg-received'}`;
                    div.innerHTML = `
                        <div style="font-weight:bold; margin-bottom:5px;">${msg.text}</div>
                        <div class="poll-container">
                            ${renderPollOptions(msg)}
                        </div>
                        <div class="meta">${new Date(msg.timestamp).toLocaleTimeString()}</div>
                    `;
                } else {
                    div.className = `message ${msg.sender === myId ? 'msg-sent' : 'msg-received'}`;
                    div.innerText = msg.text;
                    div.innerHTML += `<div class="meta">${new Date(msg.timestamp).toLocaleTimeString()}</div>`;
                }
                container.appendChild(div);
            });
            
            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        function renderPollOptions(pollMsg) {
            let html = '';
            pollMsg.options.forEach((opt, idx) => {
                const voted = pollMsg.votes.includes(myId);
                const count = pollMsg.votes.filter(v => v === idx).length;
                const percent = pollMsg.totalVotes > 0 ? Math.round((count / pollMsg.totalVotes) * 100) : 0;
                
                html += `<button class="poll-option ${voted ? 'voted' : ''}" 
                         onclick="votePoll('${pollMsg.id}', ${idx})" 
                         ${voted ? 'disabled' : ''}>
                         ${opt} (${percent}%)
                         </button>`;
            });
            return html;
        }

        // --- POLL LOGIC ---
        function openPollModal() { document.getElementById('pollModal').style.display = 'flex'; }
        function closePollModal() { document.getElementById('pollModal').style.display = 'none'; }

        async function createPoll() {
            const q = document.getElementById('pollQuestion').value;
            const o1 = document.getElementById('pollOpt1').value;
            const o2 = document.getElementById('pollOpt2').value;
            
            if(!q || !o1 || !o2) return alert("Fill all fields");

            const payload = {
                action: 'poll',
                id: myId,
                question: q,
                options: [o1, o2],
                votes: [],
                totalVotes: 0,
                timestamp: Date.now()
            };

            await fetch(`${SERVER_URL}/api/polls`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            
            closePollModal();
            document.getElementById('pollQuestion').value = '';
            document.getElementById('pollOpt1').value = '';
            document.getElementById('pollOpt2').value = '';
        }

        async function votePoll(pollId, optionIdx) {
            await fetch(`${SERVER_URL}/api/vote`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ pollId, voterId: myId, option: optionIdx })
            });
        }

        // --- UTILS ---
        function showTyping(show) {
            const el = document.getElementById('typing-indicator');
            el.style.opacity = show ? 1 : 0;
        }

    </script>
</body>
</html>!
