<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>World Chat</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#0d1117;color:#eef2f7;overflow:hidden}.app{height:100%;display:flex;flex-direction:column}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:#111821;border-bottom:1px solid #202833}.brand{display:flex;gap:10px;align-items:center}.logo{width:38px;height:38px;border-radius:12px;background:#202b39;display:grid;place-items:center}.title{font-weight:700}.sub{font-size:11px;color:#8995a5;margin-top:2px}.state{font-size:10px;padding:7px 9px;border-radius:18px}.chat{flex:1;overflow:auto;padding:12px}.row{display:flex;margin:8px 0}.me{justify-content:flex-end}.bubble{max-width:82%;background:#17202b;border:1px solid #263241;border-radius:15px;padding:9px 11px}.me .bubble{background:#1b3043}.name{font-size:11px;color:#73b6ff;margin-bottom:4px}.text{font-size:15px;line-height:1.35;white-space:pre-wrap;word-break:break-word}.meta{font-size:9px;color:#778394;text-align:right;margin-top:5px}.system{text-align:center;font-size:10px;color:#718093;margin:8px}.empty{height:100%;display:grid;place-items:center;text-align:center;color:#667385}.bottom{padding:9px;background:#111821;border-top:1px solid #202833}.composer{display:flex;gap:8px;align-items:flex-end}.btn{width:44px;height:44px;border:0;border-radius:13px;color:#fff;font-size:20px}.attach{background:#1c2733}.send{background:#4b8dca}.input{flex:1;background:#18212b;border:1px solid #253241;border-radius:13px;padding:4px 8px}textarea{width:100%;height:34px;max-height:100px;background:transparent;color:#fff;border:0;outline:0;resize:none;font:15px Arial;padding:6px}input[type=file]{display:none}.file{display:flex;gap:10px;align-items:center;background:#111923;padding:9px;border-radius:10px}.fileName{font-size:13px;word-break:break-all}.fileSize{font-size:10px;color:#7d8a9a;margin-top:3px}.fileLink{color:#8fc7ff;text-decoration:none}.progress{height:4px;background:#263342;border-radius:8px;margin-top:7px;overflow:hidden}.progress div{height:100%;width:0;background:#76afe1}</style></head><body><div class="app"><div class="top"><div class="brand"><div class="logo">🌐</div><div><div class="title">World Chat</div><div class="sub" id="user">Starting...</div></div></div><div class="state" id="state">STARTING</div></div><div class="chat" id="chat"><div class="empty" id="empty"><div>🌍<br>World Chat<br><small>Local messages are kept for 24 hours.</small></div></div></div><div class="bottom"><div class="composer"><button class="btn attach" id="attach">＋</button><div class="input"><textarea id="msg" placeholder="Message everyone..."></textarea></div><button class="btn send" id="send">➤</button></div><input id="file" type="file"></div></div><script>
(function(){'use strict';var SERVER='https://myserver-b0ls.onrender.com',WS='wss://myserver-b0ls.onrender.com/ws',UK='wc_user_v3',HK='wc_history_v3',TTL=86400000,chat=document.getElementById('chat'),empty=document.getElementById('empty'),state=document.getElementById('state'),userEl=document.getElementById('user'),msg=document.getElementById('msg'),file=document.getElementById('file'),sock=null,user=null,timer=null,delay=1000;
function id(){return Date.now()+'_'+Math.random().toString(36).slice(2)}function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function setState(x,on){state.textContent=x;state.style.color=on?'#80d991':'#e5b7b7';state.style.background=on?'#16241b':'#2a1b1d'}function init(){try{user=JSON.parse(localStorage.getItem(UK)||'null')}catch(e){}if(!user||!user.id){var n=prompt('World Chat name:','User'+Math.floor(1000+Math.random()*9000));if(!n||!n.trim())n='User'+Math.floor(1000+Math.random()*9000);user={id:id(),name:n.trim().slice(0,40)};try{localStorage.setItem(UK,JSON.stringify(user))}catch(e){}}userEl.textContent=user.name}function hist(){var a=[];try{a=JSON.parse(localStorage.getItem(HK)||'[]')}catch(e){}var now=Date.now(),b=[];for(var i=0;i<a.length;i++)if(now-(+a[i].timestamp||0)<=TTL)b.push(a[i]);try{localStorage.setItem(HK,JSON.stringify(b.slice(-500)))}catch(e){}return b.slice(-500)}function save(m){var a=hist();a.push(m);try{localStorage.setItem(HK,JSON.stringify(a.slice(-500)))}catch(e){}}function tm(t){try{return new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}function sz(n){n=+n||0;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(1)+' GB'}function render(m){if(empty)empty.style.display='none';var r=document.createElement('div');r.className='row'+(m.senderId===user.id?' me':'');var b=document.createElement('div');b.className='bubble';var h=m.senderId===user.id?'':'<div class="name">'+esc(m.senderName||'User')+'</div>';if(m.messageType==='file'){var u=SERVER+'/file/'+encodeURIComponent(m.fileId||'');h+='<a class="fileLink" target="_blank" href="'+esc(u)+'"><div class="file"><div>'+(String(m.mime||'').indexOf('image/')===0?'🖼️':String(m.mime||'').indexOf('video/')===0?'🎬':'📎')+'</div><div><div class="fileName">'+esc(m.fileName||'File')+'</div><div class="fileSize">'+sz(m.size)+'</div></div></div></a>'}else h+='<div class="text">'+esc(m.text||'')+'</div>';h+='<div class="meta">'+tm(m.timestamp)+'</div>';b.innerHTML=h;r.appendChild(b);chat.appendChild(r);chat.scrollTop=chat.scrollHeight}function historyRender(){chat.innerHTML='';var a=hist();if(!a.length){chat.appendChild(empty);empty.style.display='grid';return}empty.style.display='none';for(var i=0;i<a.length;i++)render(a[i])}function sys(x){var e=document.createElement('div');e.className='system';e.textContent=x;chat.appendChild(e);chat.scrollTop=chat.scrollHeight}function send(o){if(!sock||sock.readyState!==1){sys('Not connected');return false}try{sock.send(JSON.stringify(o));return true}catch(e){sys('Send failed');return false}}function connect(){clearTimeout(timer);setState('CONNECTING',false);try{sock=new WebSocket(WS)}catch(e){retry();return}sock.onopen=function(){delay=1000;setState('ONLINE',true);send({type:'hello',userId:user.id,name:user.name})};sock.onmessage=function(ev){var d;try{d=JSON.parse(ev.data)}catch(e){return}if(d.type==='connected'){setState('ONLINE',true);return}if(d.type==='ready'){setState('ONLINE',true);userEl.textContent=user.name+' • '+d.online+' online';return}if(d.type==='presence'){userEl.textContent=user.name+' • '+d.online+' online';return}if(d.type==='error'){sys(d.message||'Server error');return}if(d.type==='message'){save(d);render(d)}};sock.onerror=function(){setState('ERROR',false)};sock.onclose=function(){setState('OFFLINE',false);retry()}}function retry(){clearTimeout(timer);timer=setTimeout(connect,delay);delay=Math.min(delay*2,30000)}function sendText(){var x=msg.value.trim();if(!x)return;if(send({type:'message',messageId:id(),senderId:user.id,senderName:user.name,messageType:'text',text:x,timestamp:Date.now()})){msg.value='';msg.style.height='34px'}}function upload(f){if(!f)return;if(f.size>104857600){sys('Maximum file size is 100 MB');return}var line=document.createElement('div');line.className='system';line.textContent='Uploading '+f.name;var p=document.createElement('div');p.className='progress';var bar=document.createElement('div');p.appendChild(bar);line.appendChild(p);chat.appendChild(line);var x=new XMLHttpRequest();x.open('POST',SERVER+'/upload?name='+encodeURIComponent(f.name)+'&mime='+encodeURIComponent(f.type||'application/octet-stream'));x.setRequestHeader('Content-Type',f.type||'application/octet-stream');x.upload.onprogress=function(e){if(e.lengthComputable)bar.style.width=Math.round(e.loaded/e.total*100)+'%'};x.onload=function(){if(x.status<200||x.status>=300){sys('Upload failed: HTTP '+x.status);return}var r;try{r=JSON.parse(x.responseText)}catch(e){}if(!r||!r.ok){sys('Upload response invalid');return}send({type:'message',messageId:id(),senderId:user.id,senderName:user.name,messageType:'file',fileId:r.fileId,fileName:r.fileName,mime:r.mime,size:r.size,timestamp:Date.now()})};x.onerror=function(){sys('Upload network error')};x.send(f)}document.getElementById('send').onclick=sendText;msg.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}});msg.addEventListener('input',function(){msg.style.height='34px';msg.style.height=Math.min(msg.scrollHeight,100)+'px'});document.getElementById('attach').onclick=function(){file.click()};file.onchange=function(){if(file.files.length)upload(file.files[0]);file.value=''};init();historyRender();connect()})();
</script></body></html>
