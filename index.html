<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Character Scene</title>
<style>
      body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle, #2b2b2b, #000);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
        overflow: hidden;
        font-family: sans-serif;
      }

      .scene-container {
        width: 400px;
        height: 600px;
        position: relative;
        transform-style: preserve-3d;
        animation: float 6s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px) rotateY(0deg); }
        50% { transform: translateY(-20px) rotateY(5deg); }
      }

      /* Lighting Effects */
      .light-source {
        position: absolute;
        top: -100px;
        left: 50%;
        transform: translateX(-50%);
        width: 200px;
        height: 200px;
        background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
        z-index: 10;
        pointer-events: none;
      }

      /* Character Base */
      .character {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
      }

      /* Head */
      .head {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 120px;
        background: #f4c2a8;
        border-radius: 50px 50px 60px 60px;
        box-shadow: inset -5px -5px 20px rgba(0,0,0,0.2), 0 10px 30px rgba(0,0,0,0.5);
        z-index: 10;
      }

      .hair {
        position: absolute;
        top: -10px;
        left: -10px;
        width: 120px;
        height: 100px;
        background: #333;
        border-radius: 60px 60px 20px 20px;
        z-index: 11;
      }

      .hair-strand {
        position: absolute;
        top: 80px;
        width: 20px;
        height: 150px;
        background: #333;
        border-radius: 0 0 20px 20px;
        z-index: 9;
      }
      .hair-strand.left { left: 0; transform: rotate(10deg); }
      .hair-strand.right { right: 0; transform: rotate(-10deg); }

      .face-details {
        position: absolute;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 60px;
      }

      .eye {
        position: absolute;
        width: 15px;
        height: 15px;
        background: #000;
        border-radius: 50%;
        top: 10px;
      }
      .eye.left { left: 15px; }
      .eye.right { right: 15px; }
      
      .eye::after {
        content: '';
        position: absolute;
        top: 2px;
        right: 2px;
        width: 5px;
        height: 5px;
        background: #fff;
        border-radius: 50%;
      }

      .mouth {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 20px;
        height: 10px;
        border-bottom: 2px solid #d2691e;
        border-radius: 0 0 20px 20px;
      }

      /* Body & Torso */
      .torso {
        position: absolute;
        top: 130px;
        left: 50%;
        transform: translateX(-50%);
        width: 140px;
        height: 180px;
        background: #f4c2a8;
        border-radius: 40px 40px 20px 20px;
        box-shadow: inset -10px 0 20px rgba(0,0,0,0.1), 0 15px 30px rgba(0,0,0,0.3);
        z-index: 5;
        transform-style: preserve-3d;
      }

      /* Breasts (3D Spheres) */
      .breasts-container {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        height: 100px;
        display: flex;
        justify-content: space-between;
        padding: 0 20px;
        box-sizing: border-box;
      }

      .breast {
        width: 60px;
        height: 70px;
        background: radial-gradient(circle at 30% 30%, #f4c2a8, #e0b090);
        border-radius: 50% 50% 40% 40%;
        position: relative;
        box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1), 5px 10px 20px rgba(0,0,0,0.2);
        transition: all 0.5s ease;
      }

      /* Arms */
      .arm {
        position: absolute;
        width: 25px;
        height: 160px;
        background: #f4c2a8;
        border-radius: 15px;
        z-index: 6;
        transform-origin: top center;
        transition: transform 1s ease-in-out;
      }

      .arm.left {
        left: 35px;
        top: 130px;
        transform: rotate(15deg);
      }

      .arm.right {
        right: 35px;
        top: 130px;
        transform: rotate(-15deg);
      }

      /* Hands */
      .hand {
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 20px;
        height: 30px;
        background: #f4c2a8;
        border-radius: 10px;
        box-shadow: 0 5px 10px rgba(0,0,0,0.2);
      }

      /* Animation State: Arms Raising */
      .scene-container.interacting .arm.left {
        transform: rotate(-130deg) translateX(20px);
      }

      .scene-container.interacting .arm.right {
        transform: rotate(130deg) translateX(-20px);
      }

      /* Animation State: Hands on Chest */
      .scene-container.interacting .breast {
        transform: scale(1.1);
        box-shadow: inset -2px -2px 10px rgba(0,0,0,0.2), 0 0 15px rgba(255,255,255,0.2);
      }

      /* Shadow under character */
      .shadow {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 20px;
        background: rgba(0,0,0,0.4);
        border-radius: 50%;
        filter: blur(10px);
        z-index: 1;
      }

      /* Skirt/Lower Body */
      .skirt {
        position: absolute;
        top: 300px;
        left: 50%;
        transform: translateX(-50%);
        width: 160px;
        height: 150px;
        background: linear-gradient(to bottom, #333, #111);
        border-radius: 20px 20px 60px 60px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        z-index: 4;
      }

      /* Legs */
      .legs-container {
        position: absolute;
        top: 420px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        display: flex;
        gap: 15px;
        z-index: 3;
      }

      .leg {
        width: 30px;
        height: 130px;
        background: #f4c2a8;
        border-radius: 10px;
        box-shadow: inset -3px 0 10px rgba(0,0,0,0.1);
      }

      .shoe {
        position: absolute;
        bottom: 0;
        width: 35px;
        height: 15px;
        background: #000;
        border-radius: 10px 10px 5px 5px;
      }

      /* Interaction Button */
      .control-panel {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        background: #fff;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        transition: transform 0.2s;
      }

      button:hover {
        transform: scale(1.05);
      }

</style>
  </head>
  <body>

    <div class="scene-container" id="scene">
      <div class="light-source"></div>

      <div class="character">
        <div class="hair"></div>
        <div class="hair-strand left"></div>
        <div class="hair-strand right"></div>

        <div class="head">
          <div class="face-details">
            <div class="eye left"></div>
            <div class="eye right"></div>
          </div>
          <div class="mouth"></div>
        </div>

        <div class="torso">
          <div class="breasts-container">
            <div class="breast left-breast"></div>
            <div class="breast right-breast"></div>
          </div>
        </div>

        <div class="arm left">
          <div class="hand"></div>
        </div>
        <div class="arm right">
          <div class="hand"></div>
        </div>

        <div class="skirt"></div>

        <div class="legs-container">
          <div class="leg">
            <div class="shoe"></div>
          </div>
          <div class="leg">
            <div class="shoe"></div>
          </div>
        </div>
      </div>

      <div class="shadow"></div>
    </div>

    <div class="control-panel">
      <button onclick="toggleInteraction()">Press & Hold</button>
    </div>

<script>
      function toggleInteraction() {
        const scene = document.getElementById('scene');
        scene.classList.toggle('interacting');
      }
</script>

  </body>
</html>
