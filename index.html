<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Mobile Car Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Arial', sans-serif;
            touch-action: none; /* Mobile scrolling band karne ke liye */
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 20;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            height: 180px;
            pointer-events: auto;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* Joystick Styles */
        #joystick-area {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        #joystick-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Pedal Styles */
        #pedals {
            display: flex;
            gap: 20px;
            align-items: flex-end;
            margin-bottom: 10px;
        }

        .pedal {
            width: 70px;
            height: 90px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            user-select: none;
            -webkit-user-select: none;
        }

        #brake {
            background: #ff4444;
            border: 2px solid #cc0000;
        }

        #gas {
            background: #44ff44;
            border: 2px solid #00cc00;
        }

        /* Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }

        #start-screen h1 {
            color: white;
            font-size: 40px;
            margin-bottom: 10px;
            text-align: center;
        }

        #start-screen p {
            color: #ccc;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
        }

        #start-btn {
            background: #ff3333;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 51, 51, 0.4);
        }

        #start-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div id="score-board">Score: 0</div>
        
        <div id="controls">
            <div id="joystick-area">
                <div id="joystick-knob"></div>
            </div>
            <div id="pedals">
                <div class="pedal" id="brake">BRAKE</div>
                <div class="pedal" id="gas">GAS</div>
            </div>
        </div>
    </div>

    <!-- Start Screen Overlay -->
    <div id="start-screen">
        <h1>3D CITY RACER</h1>
        <p>Left Joystick: Steer<br>Green: Gas | Red: Brake</p>
        <button id="start-btn">START ENGINE</button>
    </div>

    <!-- Three.js Library (WebGL) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Game Variables ---
        var scene, camera, renderer;
        var car;
        var targets = [];
        var score = 0;
        var gameActive = false;
        var clock = new THREE.Clock();

        // Car Physics
        var speed = 0;
        var steering = 0;
        var maxSpeed = 0.8;
        var acceleration = 0.02;
        var friction = 0.98;
        var turnSpeed = 0.04;

        // Input State
        var joystickData = { x: 0, y: 0, active: false };
        var gasPressed = false;
        var brakePressed = false;

        // DOM Elements
        var joystickArea = document.getElementById('joystick-area');
        var joystickKnob = document.getElementById('joystick-knob');
        var gasBtn = document.getElementById('gas');
        var brakeBtn = document.getElementById('brake');
        var startBtn = document.getElementById('start-btn');
        var startScreen = document.getElementById('start-screen');
        var scoreEl = document.getElementById('score-board');

        // --- Initialization ---
        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky Blue
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, -15);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Lights
            var ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 50, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            // Ground
            var groundGeo = new THREE.PlaneGeometry(500, 500);
            var groundMat = new THREE.MeshStandardMaterial({ 
                color: 0x333333,
                roughness: 0.8 
            });
            var ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Grid
            var gridHelper = new THREE.GridHelper(500, 50, 0x555555, 0x444444);
            scene.add(gridHelper);

            // Car
            createCar();

            // Initial Targets
            for (var i = 0; i < 10; i++) {
                spawnTarget();
            }

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            setupControls();
            startBtn.addEventListener('click', startGame);

            // Start Loop
            animate();
        }

        function createCar() {
            car = new THREE.Group();

            // Body
            var bodyGeo = new THREE.BoxGeometry(2, 1, 4);
            var bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            var body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1;
            body.castShadow = true;
            car.add(body);

            // Cabin
            var cabinGeo = new THREE.BoxGeometry(1.8, 0.8, 2);
            var cabinMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            var cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.y = 1.8;
            cabin.position.z = -0.2;
            cabin.castShadow = true;
            car.add(cabin);

            // Wheels
            var wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16);
            var wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            
            var positions = [
                { x: -1, z: 1.2 }, { x: 1, z: 1.2 },
                { x: -1, z: -1.2 }, { x: 1, z: -1.2 }
            ];

            for (var i = 0; i < positions.length; i++) {
                var wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(positions[i].x, 0.4, positions[i].z);
                wheel.castShadow = true;
                car.add(wheel);
            }

            scene.add(car);
        }

        function spawnTarget() {
            var geometry = new THREE.BoxGeometry(2, 2, 2);
            var material = new THREE.MeshStandardMaterial({ 
                color: 0xffaa00,
                emissive: 0xff4400,
                emissiveIntensity: 0.5
            });
            var target = new THREE.Mesh(geometry, material);
            
            // Random Position
            var x = (Math.random() - 0.5) * 200;
            var z = (Math.random() - 0.5) * 200;
            
            target.position.set(x, 1, z);
            target.castShadow = true;
            scene.add(target);
            targets.push(target);
        }

        function setupControls() {
            // Joystick Logic
            var handleJoystick = function(e) {
                if (!joystickData.active) return;
                
                var rect = joystickArea.getBoundingClientRect();
                var centerX = rect.left + rect.width / 2;
                var centerY = rect.top + rect.height / 2;
                
                var clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                var dx = clientX - centerX;
                var dy = clientY - centerY;
                
                var distance = Math.sqrt(dx*dx + dy*dy);
                var maxDist = rect.width / 2 - 25;
                
                if (distance > maxDist) {
                    var angle = Math.atan2(dy, dx);
                    dx = Math.cos(angle) * maxDist;
                    dy = Math.sin(angle) * maxDist;
                }

                joystickKnob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
                
                joystickData.x = dx / maxDist;
                joystickData.y = dy / maxDist;
            };

            var endJoystick = function() {
                joystickData.active = false;
                joystickData.x = 0;
                joystickData.y = 0;
                joystickKnob.style.transform = 'translate(-50%, -50%)';
            };

            joystickArea.addEventListener('touchstart', function(e) {
                e.preventDefault();
                joystickData.active = true;
                handleJoystick(e);
            }, {passive: false});

            joystickArea.addEventListener('touchmove', function(e) {
                e.preventDefault();
                handleJoystick(e);
            }, {passive: false});

            joystickArea.addEventListener('touchend', endJoystick);

            // Pedals
            var bindPedal = function(btn, type) {
                btn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    if (type === 'gas') gasPressed = true;
                    else brakePressed = true;
                });
                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    if (type === 'gas') gasPressed = false;
                    else brakePressed = false;
                });
            };

            bindPedal(gasBtn, 'gas');
            bindPedal(brakeBtn, 'brake');
        }

        function startGame() {
            startScreen.style.display = 'none';
            gameActive = true;
            score = 0;
            scoreEl.innerText = 'Score: 0';
            speed = 0;
            car.position.set(0, 0, 0);
            car.rotation.set(0, 0, 0);
        }

        function updatePhysics() {
            if (!gameActive) return;

            // Steering
            if (speed > 0.01) {
                car.rotation.y -= joystickData.x * turnSpeed * (speed * 2);
            }

            // Acceleration
            if (gasPressed) {
                speed += acceleration;
            } else if (brakePressed) {
                speed -= acceleration * 2;
            } else {
                speed *= friction;
            }

            // Cap Speed
            if (speed > maxSpeed) speed = maxSpeed;
            if (speed < -maxSpeed / 2) speed = -maxSpeed / 2;

            // Apply Movement
            var direction = car.rotation.y;
            car.position.x += Math.sin(direction) * speed;
            car.position.z += Math.cos(direction) * speed;

            // Camera Follow
            var relativeCameraOffset = new THREE.Vector3(0, 8, -12);
            var cameraOffset = relativeCameraOffset.applyMatrix4(car.matrixWorld);
            
            // Smooth Lerp
            camera.position.x += (cameraOffset.x - camera.position.x) * 0.1;
            camera.position.y += (cameraOffset.y - camera.position.y) * 0.1;
            camera.position.z += (cameraOffset.z - camera.position.z) * 0.1;
            camera.lookAt(car.position.x, car.position.y + 2, car.position.z);
        }

        function updateTargets() {
            for (var i = targets.length - 1; i >= 0; i--) {
                var target = targets[i];
                
                // Rotate target
                target.rotation.x += 0.01;
                target.rotation.y += 0.01;

                // Collision Check
                var dist = car.position.distanceTo(target.position);
                
                if (dist < 3) {
                    // Hit
                    scene.remove(target);
                    targets.splice(i, 1);
                    score += 10;
                    scoreEl.innerText = 'Score: ' + score;
                    
                    spawnTarget();
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (gameActive) {
                updatePhysics();
                updateTargets();
            }
            
            renderer.render(scene, camera);
        }

        // Run Init
        init();

    </script>
</body>
</html>
