<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hill Climb Adventure</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky Blue */
            font-family: 'Arial', sans-serif;
            touch-action: none; /* Prevents scrolling on mobile while playing */
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 10;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 10px;
            color: white;
            z-index: 20;
            border: 2px solid #fff;
        }

        #game-over h1 {
            margin-top: 0;
            font-size: 48px;
            color: #ff4444;
        }

        #game-over button {
            padding: 15px 30px;
            font-size: 24px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        
        #game-over button:hover {
            background: #45a049;
        }

        /* Mobile Controls Styling */
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through empty areas */
        }

        .btn-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .control-btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            user-select: none;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background 0.1s;
        }

        .control-btn:active, .control-btn.active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.95);
        }

        .brake {
            background: rgba(255, 0, 0, 0.4);
            border-color: rgba(255, 0, 0, 0.6);
        }
        
        .brake:active, .brake.active {
            background: rgba(255, 0, 0, 0.7);
        }

        /* Hide controls on large screens if desired, but keeping them visible for all is safer for testing */
        @media (min-width: 1024px) {
            .controls {
                opacity: 0.6;
            }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        Distance: <span id="distance">0</span> m
    </div>

    <div id="game-over">
        <h1>CRASHED!</h1>
        <p>You flipped over.</p>
        <button onclick="resetGame()">Try Again</button>
    </div>

    <!-- Control Buttons -->
    <div class="controls">
        <div class="btn-group">
            <!-- Brake / Reverse -->
            <div class="control-btn brake" id="btn-brake">
                <span>🛑</span>
            </div>
        </div>
        <div class="btn-group">
            <!-- Gas -->
            <div class="control-btn" id="btn-gas">
                <span>🚀</span>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const distanceEl = document.getElementById('distance');
        const gameOverScreen = document.getElementById('game-over');

        // Resize handling
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Input State
        const keys = {
            right: false,
            left: false,
            brake: false
        };

        // Keyboard Events
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'Space') keys.brake = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'Space') keys.brake = false;
        });

        // Touch/Mouse Events for Buttons
        const btnGas = document.getElementById('btn-gas');
        const btnBrake = document.getElementById('btn-brake');

        const addTouch = (elem, key) => {
            elem.addEventListener('mousedown', (e) => { e.preventDefault(); keys[key] = true; elem.classList.add('active'); });
            elem.addEventListener('mouseup', (e) => { e.preventDefault(); keys[key] = false; elem.classList.remove('active'); });
            elem.addEventListener('mouseleave', (e) => { keys[key] = false; elem.classList.remove('active'); });
            
            elem.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; elem.classList.add('active'); }, {passive: false});
            elem.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; elem.classList.remove('active'); });
            elem.addEventListener('touchcancel', (e) => { keys[key] = false; elem.classList.remove('active'); });
        };

        addTouch(btnGas, 'right');
        addTouch(btnBrake, 'brake');

        // Game Constants
        const GRAVITY = 0.25;
        const FRICTION = 0.98;
        const ENGINE_POWER = 0.4;
        const BRAKE_POWER = 0.2;
        const MAX_SPEED = 15;
        const TERRAIN_BLOCK_SIZE = 40;

        // Game State
        let cameraX = 0;
        let distanceTraveled = 0;
        let isGameOver = false;

        // Car Object
        const car = {
            x: 200,
            y: 300,
            vx: 0,
            vy: 0,
            width: 60,
            height: 30,
            wheelRadius: 12,
            wheelOffsetX: 25,
            wheelYOffset: 15,
            angle: 0,
            angularVelocity: 0,
            onGround: false,

            update: function() {
                if (isGameOver) return;

                // Apply Gravity
                this.vy += GRAVITY;

                // Input Handling
                if (this.onGround) {
                    if (keys.right) {
                        this.vx += ENGINE_POWER;
                    }
                    if (keys.left) {
                        this.vx -= ENGINE_POWER;
                    }
                    if (keys.brake) {
                        this.vx *= 0.9; // Rapid deceleration
                        this.angularVelocity *= 0.9; // Stabilize when braking
                    }
                }

                // Cap Speed
                if (this.vx > MAX_SPEED) this.vx = MAX_SPEED;
                if (this.vx < -MAX_SPEED) this.vx = -MAX_SPEED;

                // Friction (Air resistance/Ground friction)
                this.vx *= 0.99; 

                // Update Position
                this.x += this.vx;
                this.y += this.vy;

                // Calculate Terrain Height
                const rearWheelX = this.x - this.wheelOffsetX * Math.cos(this.angle);
                const frontWheelX = this.x + this.wheelOffsetX * Math.cos(this.angle);
                
                const rearTerrainY = getTerrainHeight(rearWheelX);
                const frontTerrainY = getTerrainHeight(frontWheelX);

                const rearWheelBottom = this.y + this.wheelYOffset - this.wheelRadius;
                const frontWheelBottom = this.y + this.wheelYOffset - this.wheelRadius;

                let hitBack = false;
                let hitFront = false;

                // Check Rear Wheel Collision
                if (rearWheelBottom > rearTerrainY) {
                    hitBack = true;
                    const penetration = rearWheelBottom - rearTerrainY;
                    this.y -= penetration;
                    this.vy *= 0.7; // Bounce
                }

                // Check Front Wheel Collision
                if (frontWheelBottom > frontTerrainY) {
                    hitFront = true;
                    const penetration = frontWheelBottom - frontTerrainY;
                    this.y -= penetration;
                    this.vy *= 0.7;
                }

                this.onGround = hitBack || hitFront;

                // Calculate Target Angle based on terrain slope
                let targetAngle = 0;
                if (this.onGround) {
                    const dy = frontTerrainY - rearTerrainY;
                    const dx = frontWheelX - rearWheelX;
                    targetAngle = Math.atan2(dy, dx);
                }

                // Spring Physics for Rotation
                const angleDiff = targetAngle - this.angle;
                this.angularVelocity += angleDiff * 0.15;
                this.angularVelocity *= 0.85;
                this.angle += this.angularVelocity;

                // Game Over Logic (Head hitting ground)
                // Check if the "roof" of the car hits the ground
                const centerTerrainY = getTerrainHeight(this.x);
                
                // Calculate the position of the "roof" point relative to center
                // Roof is at top center. Rotate the point (0, -height/2) by current angle
                const roofX = this.x + (-this.height/2) * Math.sin(this.angle);
                const roofY = this.y + (-this.height/2) * Math.cos(this.angle);

                if (roofY > centerTerrainY) {
                    triggerGameOver();
                }
                
                // Update Distance
                if (this.x > distanceTraveled) {
                    distanceTraveled = this.x;
                }
                distanceEl.innerText = Math.floor(distanceTraveled / 10);
            },

            draw: function() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Draw Car Body
                ctx.fillStyle = '#FF4444'; 
                ctx.fillRect(-30, -15, 60, 30);
                
                // Draw Driver
                ctx.fillStyle = '#FFFF00';
                ctx.beginPath();
                ctx.arc(0, -5, 8, 0, Math.PI * 2);
                ctx.fill();
                
                // Outline
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.strokeRect(-30, -15, 60, 30);

                ctx.restore();

                // Draw Wheels
                this.drawWheel(this.x - this.wheelOffsetX, this.y + this.wheelYOffset, this.angle);
                this.drawWheel(this.x + this.wheelOffsetX, this.y + this.wheelYOffset, this.angle);
            },

            drawWheel: function(x, y, bodyAngle) {
                ctx.save();
                ctx.translate(x, y);
                // Spin wheel based on car speed
                ctx.rotate(Date.now() / 50); 
                
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(0, 0, this.wheelRadius, 0, Math.PI * 2);
                ctx.fill();
                
                // Rim
                ctx.fillStyle = '#888';
                ctx.beginPath();
                ctx.arc(0, 0, this.wheelRadius / 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Spokes
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-this.wheelRadius, 0);
                ctx.lineTo(this.wheelRadius, 0);
                ctx.moveTo(0, -this.wheelRadius);
                ctx.lineTo(0, this.wheelRadius);
                ctx.stroke();

                ctx.restore();
            }
        };

        // Terrain Generation
        const terrainPoints = [];
        const pointCount = 2000;

        function generateTerrain() {
            terrainPoints.length = 0;
            let y = canvas.height / 2;
            for (let i = 0; i < pointCount; i++) {
                const frequency = 0.01 + (Math.random() * 0.005);
                const amplitude = 50 + (Math.random() * 50);
                
                const noise = Math.sin(i * frequency) * amplitude + 
                              Math.sin(i * frequency * 2.5) * (amplitude / 2);
                
                y = (canvas.height / 2 + 100) + noise;
                terrainPoints.push({x: i * TERRAIN_BLOCK_SIZE, y: y});
            }
        }

        function getTerrainHeight(x) {
            const index = Math.floor(x / TERRAIN_BLOCK_SIZE);
            const nextIndex = index + 1;
            
            if (index < 0) return terrainPoints[0].y;
            if (index >= terrainPoints.length - 1) return terrainPoints[terrainPoints.length - 1].y;

            const p1 = terrainPoints[index];
            const p2 = terrainPoints[nextIndex];

            const t = (x - p1.x) / TERRAIN_BLOCK_SIZE;
            return p1.y + (p2.y - p1.y) * t;
        }

        function drawTerrain() {
            ctx.fillStyle = '#4CAF50'; 
            ctx.strokeStyle = '#388E3C'; 
            
            ctx.beginPath();
            const startX = Math.floor(cameraX / TERRAIN_BLOCK_SIZE) * TERRAIN_BLOCK_SIZE;
            const endX = startX + canvas.width + TERRAIN_BLOCK_SIZE;

            ctx.moveTo(cameraX, canvas.height);

            for (let i = 0; i < terrainPoints.length; i++) {
                if (terrainPoints[i].x > startX && terrainPoints[i].x < endX) {
                    ctx.lineTo(terrainPoints[i].x, terrainPoints[i].y);
                }
            }

            ctx.lineTo(endX, canvas.height);
            ctx.closePath();
            ctx.fill();
            
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        function drawBackground() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            for(let i=0; i<5; i++) {
                let cloudX = (cameraX * 0.1 + i * 300) % (canvas.width + 200);
                let cloudY = 50 + i * 30;
                ctx.beginPath();
                ctx.arc(canvas.width - cloudX, cloudY, 40, 0, Math.PI*2);
                ctx.arc(canvas.width - cloudX + 30, cloudY - 10, 50, 0, Math.PI*2);
                ctx.arc(canvas.width - cloudX + 60, cloudY, 40, 0, Math.PI*2);
                ctx.fill();
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            gameOverScreen.style.display = 'block';
        }

        function resetGame() {
            isGameOver = false;
            gameOverScreen.style.display = 'none';
            car.x = 200;
            car.y = 300;
            car.vx = 0;
            car.vy = 0;
            car.angle = 0;
            car.angularVelocity = 0;
            distanceTraveled = 0;
            generateTerrain();
        }

        function updateCamera() {
            cameraX = car.x - canvas.width / 3;
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            updateCamera();
            car.update();
            
            drawBackground();
            drawTerrain();
            car.draw();

            requestAnimationFrame(loop);
        }

        // Init
        generateTerrain();
        loop();

    </script>

</body>
</html>
