<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Live Mirror</title>
    <style>
        body { background: #000; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        video { width: 100%; max-width: 640px; border: 2px solid #333; }
        #status { position: absolute; top: 10px; left: 10px; color: lime; }
    </style>
</head>
<body>
    <div id="status">Connecting...</div>
    <video id="player" autoplay playsinline></video>

    <script>
        var video = document.getElementById('player');
        var status = document.getElementById('status');
        
        // Media Source setup
        var mediaSource = new MediaSource();
        video.src = URL.createObjectURL(mediaSource);
        
        mediaSource.addEventListener('sourceopen', function(e) {
            try {
                var sourceBuffer = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.42E01F, mp4a.40.2"');
                
                // Connect to WebSocket (Same server, different port)
                var ws = new WebSocket('ws://myserver-b0ls.onrender.com:8080');
                
                ws.binaryType = 'arraybuffer';
                
                ws.onopen = function() {
                    status.textContent = "Connected!";
                };
                
                ws.onmessage = function(event) {
                    if (sourceBuffer.updating) {
                        sourceBuffer.addEventListener('updateend', function() {
                            sourceBuffer.appendBuffer(event.data);
                        }, { once: true });
                    } else {
                        sourceBuffer.appendBuffer(event.data);
                    }
                };
            } catch (err) {
                status.textContent = "Error: " + err.message;
            }
        });
    </script>
</body>
</html>
