<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Chat Panel</title>

<style>
body{font-family:Arial;padding:20px}
.msg{padding:10px;margin:10px;border:1px solid #ccc;cursor:pointer}
#box{margin-top:20px}
</style>

</head>

<body>

<h2>Messages (Click to reply as Person B)</h2>

<div id="list"></div>

<h3>Reply Box (Person B)</h3>

<input id="text" placeholder="type reply">
<button onclick="send()">Send Reply</button>

<script>

let selectedUser="PersonB";

let selectedTo="";

function load(){

fetch("/api/messages")
.then(r=>r.json())
.then(data=>{

let html="";

data.forEach(m=>{

html+=`
<div class="msg" onclick="selectUser('${m.from}')">

<b>${m.from}</b>: ${m.text}<br>
<small>${m.time}</small>

</div>
`;

});

document.getElementById("list").innerHTML=html;

});

}

function selectUser(user){
selectedTo=user;
alert("Replying to: "+user);
}

function send(){

let text=document.getElementById("text").value;

fetch("/api/send",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
from:"PersonB",
text:text
})
});

document.getElementById("text").value="";

setTimeout(load,500);

}

load();
setInterval(load,2000);

</script>

</body>
</html>
