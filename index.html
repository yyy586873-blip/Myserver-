
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Transform Racer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            height: 120px;
            pointer-events: auto;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            align-items: flex-end;
        }

        .btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            background: rgba(0, 255, 255, 0.5);
        }

        .action-btn {
            width: 80px;
            height: 50px;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        #btn-trans {
            background: #ff0055;
            border-color: #cc0044;
        }

        #btn-gas {
            background: #ffcc00;
            border-color: #cc9900;
            color: black;
            font-weight: bold;
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #game-over h1 {
            color: #ff0000;
            font-size: 40px;
            margin-bottom: 20px;
        }

        #restart-btn {
            padding: 15px 30px;
            font-size: 20px;
            background: #00ff88;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <div id="score-board">Score: 0</div>

    <div id="controls">
        <div style="display:flex; gap: 20px; align-items:flex-end;">
            <button id="btn-left" class="btn">◄</button>
            <button id="btn-right" class="btn">►</button>
        </div>

        <div style="display:flex; align-items:flex-end; gap: 15px;">
            <button id="btn-trans" class="btn action-btn">TRANS</button>
            <button id="btn-gas" class="btn">GAS</button>
        </div>
    </div>
</div>

<div id="game-over">
    <h1>CRASHED!</h1>
    <button id="restart-btn">RESTART</button>
</div>

<script>
    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    var w, h;

    // Game State
    var isRunning = false;
    var score = 0;
    var speed = 0;
    var maxSpeed = 15;
    var frameCount = 0;

    // Player
    var player = {
        x: 0,
        y: 0, // Will be set on resize
        width: 40,
        height: 70,
        isRobot: false,
        transformAnim: 0,
        tilt: 0
    };

    // Arrays
    var enemies = [];
    var roadSegments = [];
    var particles = [];

    // Controls State
    var moveLeft = false;
    var moveRight = false;
    var gasPressed = false;

    // 3D Perspective Config
    var perspective = {
        horizon: 0.4, // Where the sky meets the ground (0 to 1)
        fov: 400 // Field of view
    };

    function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w;
        canvas.height = h;
        player.y = h - 180; // Player vertical position
    }
    window.addEventListener('resize', resize);
    resize();

    // Buttons
    var btnLeft = document.getElementById('btn-left');
    var btnRight = document.getElementById('btn-right');
    var gasBtn = document.getElementById('btn-gas');
    var transBtn = document.getElementById('btn-trans');
    var restartBtn = document.getElementById('restart-btn');

    function addTouch(elem, startFn, endFn) {
        elem.addEventListener('touchstart', function(e) { e.preventDefault(); startFn(); }, {passive: false});
        elem.addEventListener('touchend', function(e) { e.preventDefault(); endFn(); }, {passive: false});
        // Mouse support
        elem.addEventListener('mousedown', function() { startFn(); });
        elem.addEventListener('mouseup', function() { endFn(); });
        elem.addEventListener('touchstart', function() { startFn(); });
        elem.addEventListener('touchend', function() { endFn(); });
    }

    addTouch(btnLeft, function() { moveLeft = true; }, function() { moveLeft = false; });
    addTouch(btnRight, function() { moveRight = true; }, function() { moveRight = false; });
    addTouch(gasBtn, function() { gasPressed = true; }, function() { gasPressed = false; });

    transBtn.addEventListener('click', function() {
        player.isRobot = !player.isRobot;
        player.transformAnim = 0;
        createExplosion(player.x, player.y, '#00ffff');
    });

    restartBtn.addEventListener('click', startGame);

    function startGame() {
        document.getElementById('game-over').style.display = 'none';
        isRunning = true;
        score = 0;
        speed = 0;
        frameCount = 0;
        player.x = w / 2;
        player.isRobot = false;
        player.tilt = 0;
        enemies = [];
        roadSegments = [];
        particles = [];
        
        // Initialize road segments
        for(let i=0; i<20; i++) {
            roadSegments.push({z: i * 100});
        }

        animate();
    }

    function createExplosion(x, y, color) {
        for(var i=0; i<20; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: color
            });
        }
    }

    function spawnEnemy() {
        // Random X position
        var x = (Math.random() * w * 0.8) + (w * 0.1);
        enemies.push({
            x: x,
            y: -100,
            z: 2000, // Start far away
            speed: 10,
            color: '#ffaa00'
        });
    }

    function update() {
        // Speed
        if (gasPressed) {
            if (speed < maxSpeed) speed += 0.2;
        } else {
            if (speed > 0.5) speed -= 0.1;
            else speed = 0;
        }

        // Player Move
        var maxTilt = 0.3;
        if (moveLeft) {
            player.x -= 6;
            player.tilt = Math.max(player.tilt - 0.05, -maxTilt);
        } else if (moveRight) {
            player.x += 6;
            player.tilt = Math.min(player.tilt + 0.05, maxTilt);
        } else {
            player.tilt *= 0.9; // Return to center tilt
        }

        // Clamp Player X
        if (player.x < 50) player.x = 50;
        if (player.x > w - 50) player.x = w - 50;

        // Transform Animation
        if (player.transformAnim < 1) {
            player.transformAnim += 0.05;
        }

        // Road Generation
        // We move the segments "up" visually
        roadSegments.forEach(function(seg) {
            seg.z += speed * 10; // Move towards camera
            if (seg.z > 5000) seg.z = 0; // Loop
        });

        // Enemies
        if (frameCount % 50 === 0 && speed > 2) spawnEnemy();

        for (var i = enemies.length - 1; i >= 0; i--) {
            var e = enemies[i];
            
            // Simple 3D projection logic
            // If Z is high, it's far away. If Z is 0, it's here.
            // We simulate movement by decreasing Z
            e.z -= (speed * 15); 

            // Project to 2D
            var scale = perspective.fov / (perspective.fov + e.z);
            var screenX = e.x; 
            var screenY = (h * perspective.horizon) + (scale * (h - h * perspective.horizon));

            // Store projected values for drawing
            e.scale = scale;
            e.screenX = screenX;
            e.screenY = screenY;

            // Collision Check
            if (e.z < 100 && e.z > -50) {
                var projWidth = 40 * scale;
                var projHeight = 70 * scale;
                
                if (
                    player.x + 20 > e.screenX - projWidth/2 &&
                    player.x - 20 < e.screenX + projWidth/2 &&
                    player.y + 35 > e.screenY - projHeight/2 &&
                    player.y - 35 < e.screenY + projHeight/2
                ) {
                    gameOver();
                }
            }

            if (e.z < -200) {
                enemies.splice(i, 1);
                score += 10;
                document.getElementById('score-board').innerText = "Score: " + score;
            }
        }

        // Particles
        for(var i = particles.length - 1; i >= 0; i--) {
            var p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            if(p.life <= 0) particles.splice(i, 1);
        }
    }

    function draw() {
        // Sky
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, w, h);
        
        // Ground (Horizon)
        var horizonY = h * perspective.horizon;
        ctx.fillStyle = '#333';
        ctx.fillRect(0, horizonY, w, h - horizonY);

        // Draw Road Grid (3D Effect)
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        
        // Draw moving horizontal lines
        for(var i=0; i<roadSegments.length; i++) {
            var seg = roadSegments[i];
            var scale = perspective.fov / (perspective.fov + seg.z);
            var y = horizonY + (scale * (h - horizonY));
            
            if (y < h && y > horizonY) {
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(0, y, w, 2);
            }
        }
        
        // Draw vertical road edges
        ctx.beginPath();
        ctx.moveTo(w/2 - 20, horizonY);
        ctx.lineTo(0, h);
        ctx.moveTo(w/2 + 20, horizonY);
        ctx.lineTo(w, h);
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        // Draw Enemies (Sorted by Z so far ones draw first)
        enemies.sort(function(a,b){return b.z - a.z});
        
        for (var i = 0; i < enemies.length; i++) {
            var e = enemies[i];
            draw3DObject(e.screenX, e.screenY, e.scale, e.color, false);
        }

        // Draw Player (Always in front)
        drawPlayer3D(player.x, player.y);

        // Draw Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fillRect(p.x, p.y, 4, 4);
            ctx.globalAlpha = 1.0;
        });
    }

    function drawPlayer3D(x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(player.tilt); // Tilt car

        // Transform Effect
        var scale = 1;
        if (player.transformAnim < 1) {
            scale = 1 + Math.sin(player.transformAnim * 10) * 0.3;
        }
        ctx.scale(1, scale);

        if (player.isRobot) {
            drawRobot(x, y);
        } else {
            drawCar3D(x, y);
        }
        ctx.restore();
    }

    function draw3DObject(x, y, scale, color, isPlayer) {
        var w = 40 * scale;
        var h = 70 * scale;
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(x - w/2 + 10*scale, y - h/2 + h*0.8, w, h*0.2);

        // Body
        ctx.fillStyle = color;
        ctx.fillRect(x - w/2, y - h/2, w, h);
        
        // Top (Darker)
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(x - w/2 + 5*scale, y - h/2 + 5*scale, w - 10*scale, h - 10*scale);
    }

    function drawCar3D(x, y) {
        var w = 40;
        var h = 70;
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.beginPath();
        ctx.ellipse(x, y + 30, 25, 10, 0, 0, Math.PI*2);
        ctx.fill();

        // Car Body
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(x - 20, y - 35, 40, 70);
        
        // Windshield
        ctx.fillStyle = '#88ccff';
        ctx.beginPath();
        ctx.moveTo(x - 15, y - 15);
        ctx.lineTo(x - 10, y - 30);
        ctx.lineTo(x + 10, y - 30);
        ctx.lineTo(x + 15, y - 15);
        ctx.fill();

        // Wheels
        ctx.fillStyle = '#000';
        ctx.fillRect(x - 24, y - 30, 6, 15);
        ctx.fillRect(x + 18, y - 30, 6, 15);
        ctx.fillRect(x - 24, y + 15, 6, 15);
        ctx.fillRect(x + 18, y + 15, 6, 15);
    }

    function drawRobot(x, y) {
        // Robot Legs
        ctx.fillStyle = '#555';
        ctx.fillRect(x - 15, y + 10, 10, 25);
        ctx.fillRect(x + 5, y + 10, 10, 25);

        // Robot Body
        ctx.fillStyle = '#0055aa';
        ctx.fillRect(x - 20, y - 30, 40, 50);

        // Robot Head
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(x - 10, y - 50, 20, 20);
        
        // Robot Eyes
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(x - 6, y - 45, 4, 4);
        ctx.fillRect(x + 2, y - 45, 4, 4);

        // Robot Arms
        ctx.fillStyle = '#333';
        ctx.fillRect(x - 25, y - 20, 10, 30);
        ctx.fillRect(x + 15, y - 20, 10, 30);
        
        // Gun
        if(player.isRobot) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(x + 18, y - 10, 20, 5);
        }
    }

    function gameOver() {
        isRunning = false;
        document.getElementById('game-over').style.display = 'flex';
    }

    function animate() {
        if (!isRunning) return;
        update();
        draw();
        frameCount++;
        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
