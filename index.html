<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSH Ocem Style Panel</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #111; color: #eee; }
    .top {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr auto;
      gap: 8px;
      padding: 12px;
      background: #1b1b1b;
      border-bottom: 1px solid #333;
    }
    input, button {
      padding: 10px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      border-radius: 6px;
      outline: none;
    }
    button { cursor: pointer; background: #2d6cdf; border: none; }
    button:hover { opacity: 0.92; }
    #status { padding: 8px 12px; font-size: 14px; color: #9fe870; }
    #terminal {
      white-space: pre-wrap;
      padding: 12px;
      height: calc(100vh - 170px);
      overflow: auto;
      background: #000;
      color: #0f0;
      font-family: monospace;
      line-height: 1.4;
    }
    .bottom {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #1b1b1b;
      border-top: 1px solid #333;
    }
    #cmd { flex: 1; }
  </style>
</head>
<body>
  <div class="top">
    <input id="host" placeholder="Host" value="127.0.0.1">
    <input id="port" placeholder="Port" value="22">
    <button id="connect">Connect</button>
    <button id="clear">Clear</button>
  </div>

  <div id="status">Disconnected</div>
  <div id="terminal"></div>

  <div class="bottom">
    <input id="cmd" placeholder="Type command and press Enter">
  </div>

  <script src="/client.js"></script>
</body>
</html>
