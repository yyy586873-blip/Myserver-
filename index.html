
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flat Racer 2D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #87CEEB; /* Sky Blue */
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #score-board {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }

        h1 {
            color: #fff;
            font-size: 40px;
            margin: 0 0 20px 0;
            text-shadow: 2px 2px 0 #000;
        }

        button {
            background: #ff3333;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #990000;
        }

        button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 0 #990000;
        }

        /* Controls */
        #controls {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            pointer-events: none;
        }

        .control-zone {
            flex: 1;
        }

        .icon {
            position: absolute;
            bottom: 20px;
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            pointer-events: auto;
        }

        #btn-brake { left: 20px; border: 2px solid white; }
        #btn-gas { right: 20px; border: 2px solid white; }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="score-board">Speed: 0 km/h</div>
        
        <div id="controls">
            <div class="control-zone">
                <div id="btn-brake" class="icon">Brake</div>
            </div>
            <div class="control-zone">
                <div id="btn-gas" class="icon">Gas</div>
            </div>
        </div>

        <div id="game-over-screen">
            <h1>GAME OVER</h1>
            <div style="color:white; font-size: 20px; margin-bottom: 20px;">Distance: <span id="final-score">0</span>m</div>
            <button id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score-board');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const btnGas = document.getElementById('btn-gas');
        const btnBrake = document.getElementById('btn-brake');

        // Resize
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game State
        let isRunning = false;
        let distance = 0;
        
        // Input
        let gasPressed = false;
        let brakePressed = false;

        // Physics
        const ACCELERATION = 0.2;
        const BRAKE_FORCE = 0.1;
        const FRICTION = 0.98;
        const MAX_SPEED = 20;
        const ROAD_Y = 0; // Will be set in init

        // Car
        const car = {
            x: 0, // World X
            y: 0,
            speed: 0,
            wheelAngle: 0,
            width: 80,
            height: 30,
            wheelRadius: 12,
            
            update: function() {
                if (gasPressed) {
                    this.speed += ACCELERATION;
                }
                if (brakePressed) {
                    this.speed -= BRAKE_FORCE;
                }

                // Friction
                this.speed *= FRICTION;

                // Cap Speed
                if (this.speed > MAX_SPEED) this.speed = MAX_SPEED;
                if (this.speed < 0) this.speed = 0;

                // Move
                this.x += this.speed;
                
                // Wheel Rotation
                this.wheelAngle += this.speed * 0.15;

                // Update Score
                distance = Math.floor(this.x / 10);
                scoreEl.innerText = "Dist: " + distance + "m | Speed: " + Math.floor(this.speed * 10) + " km/h";
            },

            draw: function() {
                // Draw Car relative to camera
                const screenX = canvas.width / 2 - this.x; 
                
                ctx.save();
                ctx.translate(screenX, canvas.height * 0.6); // Fixed Y position on screen

                // Car Body
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(-40, -25, 80, 25);
                
                // Cabin
                ctx.fillStyle = '#c0392b';
                ctx.fillRect(-20, -45, 40, 20);

                // Wheels
                this.drawWheel(-25, 5);
                this.drawWheel(25, 5);

                ctx.restore();
            },

            drawWheel: function(x, y) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(this.wheelAngle);
                
                // Tire
                ctx.beginPath();
                ctx.arc(0, 0, this.wheelRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#333';
                ctx.fill();
                
                // Rim
                ctx.beginPath();
                ctx.arc(0, 0, this.wheelRadius * 0.6, 0, Math.PI * 2);
                ctx.fillStyle = '#888';
                ctx.fill();

                // Spokes
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-this.wheelRadius, 0); ctx.lineTo(this.wheelRadius, 0);
                ctx.moveTo(0, -this.wheelRadius); ctx.lineTo(0, this.wheelRadius);
                ctx.stroke();

                ctx.restore();
            }
        };

        // Background (Fixed)
        let bgOffset = 0;

        function drawBackground() {
            // Sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sun (Fixed)
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(canvas.width - 50, 50, 30, 0, Math.PI * 2);
            ctx.fill();

            // Clouds (Slowly moving for effect, but mostly fixed relative to road)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            const cloudX = (car.x * 0.1) % canvas.width; // Very slow parallax
            ctx.fillRect(100 - cloudX, 80, 100, 40);
            ctx.fillRect(300 - cloudX, 40, 120, 50);
        }

        function drawRoad() {
            const roadY = canvas.height * 0.65;
            
            // Grass
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(0, roadY, canvas.width, canvas.height - roadY);

            // Road Surface
            ctx.fillStyle = '#555';
            ctx.fillRect(0, roadY, canvas.width, 60);

            // Road Edge Lines
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, roadY, canvas.width, 5);
            ctx.fillRect(0, roadY + 55, canvas.width, 5);

            // Moving Dashed Line
            ctx.fillStyle = '#fff';
            const dashWidth = 40;
            const gapWidth = 40;
            const totalDash = dashWidth + gapWidth;
            
            // Calculate offset based on car position to make road move
            const offset = car.x % totalDash;

            for (let i = -1; i < canvas.width / totalDash + 2; i++) {
                ctx.fillRect(
                    (i * totalDash) - offset + canvas.width / 2, 
                    roadY + 25, 
                    dashWidth, 
                    10
                );
            }
        }

        function loop() {
            if (!isRunning) return;

            // Update
            car.update();

            // Draw
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawBackground();
            drawRoad();
            car.draw();

            requestAnimationFrame(loop);
        }

        function startGame() {
            car.x = 0;
            car.speed = 0;
            distance = 0;
            isRunning = true;
            gameOverScreen.style.display = 'none';
            loop();
        }

        function endGame() {
            isRunning = false;
            finalScoreEl.innerText = distance;
            gameOverScreen.style.display = 'flex';
        }

        // Controls
        function addTouch(elem, isGas) {
            elem.addEventListener('touchstart', (e) => { e.preventDefault(); isGas ? gasPressed = true : brakePressed = true; });
            elem.addEventListener('touchend', (e) => { e.preventDefault(); isGas ? gasPressed = false : brakePressed = false; });
            elem.addEventListener('mousedown', () => isGas ? gasPressed = true : brakePressed = true);
            elem.addEventListener('mouseup', () => isGas ? gasPressed = false : brakePressed = false);
        }

        addTouch(btnGas, true);
        addTouch(btnBrake, false);

        restartBtn.addEventListener('click', startGame);

        // Init
        startGame();

    </script>
</body>
</html>
