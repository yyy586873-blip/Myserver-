
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon 3D Runner</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            width: 100%;
            height: 100vh;
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 5px #00ffff;
            z-index: 10;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border: 2px solid #ff00ff;
            border-radius: 10px;
            box-shadow: 0 0 20px #ff00ff;
            z-index: 20;
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 40px;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
        }
        button {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 10px #00ffff;
        }
        button:active {
            transform: scale(0.95);
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">Score: <span id="score">0</span></div>
    
    <div id="game-over">
        <h1>CRASH!</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button id="restart-btn">RETRY</button>
    </div>

    <div id="instructions">Swipe Left/Right to Dodge</div>
    <div id="canvas-container"></div>

    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Variables ---
        var scene, camera, renderer;
        var player, floor, gridHelper;
        var obstacles = [];
        var particles = [];
        var score = 0;
        var gameSpeed = 0.5;
        var isGameOver = false;
        var animationId;
        
        // Lane positions: -3, 0, 3 (Left, Center, Right)
        var lanes = [-3, 0, 3];
        var currentLane = 1; // Start in center
        var targetX = 0;
        
        // --- Initialization ---
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            scene.fog = new THREE.Fog(0x111111, 10, 50);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lights
            var ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Player (Neon Cube)
            var playerGeo = new THREE.BoxGeometry(1, 1, 1);
            var playerMat = new THREE.MeshStandardMaterial({ 
                color: 0x00ffff, 
                emissive: 0x0044aa,
                emissiveIntensity: 0.5
            });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.castShadow = true;
            player.position.y = 0.5;
            scene.add(player);

            // Floor (Grid)
            var gridSize = 200;
            var gridDivisions = 40;
            gridHelper = new THREE.GridHelper(gridSize, gridDivisions, 0xff00ff, 0x222222);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            // Floor Plane (for shadows)
            var floorGeo = new THREE.PlaneGeometry(200, 200);
            var floorMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -0.01;
            floor.receiveShadow = true;
            scene.add(floor);

            // Controls
            window.addEventListener('resize', onResize, false);
            document.addEventListener('touchstart', handleTouchStart, false);
            document.addEventListener('touchmove', handleTouchMove, false);
            document.addEventListener('keydown', handleKeyDown, false);
            
            document.getElementById('restart-btn').addEventListener('click', resetGame);

            animate();
        }

        // --- Input Handling ---
        var touchStartX = 0;
        var touchEndX = 0;

        function handleTouchStart(evt) {
            touchStartX = evt.changedTouches[0].screenX;
        }

        function handleTouchMove(evt) {
            // Optional: Visual feedback or smooth follow if desired
        }

        function handleKeyDown(event) {
            if (isGameOver) return;
            if (event.key === 'ArrowLeft') changeLane(-1);
            if (event.key === 'ArrowRight') changeLane(1);
        }

        function handleTouchEnd(evt) {
            touchEndX = evt.changedTouches[0].screenX;
            handleSwipe();
        }

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) changeLane(-1); // Swipe Left
            if (touchEndX > touchStartX + 50) changeLane(1);  // Swipe Right
        }

        function changeLane(direction) {
            var newLaneIndex = currentLane + direction;
            if (newLaneIndex >= 0 && newLaneIndex < lanes.length) {
                currentLane = newLaneIndex;
                targetX = lanes[currentLane];
            }
        }

        // --- Game Logic ---
        function spawnObstacle() {
            var geometry = new THREE.BoxGeometry(1, 1, 1);
            var material = new THREE.MeshStandardMaterial({ 
                color: 0xff0000,
                emissive: 0x550000,
                emissiveIntensity: 0.5
            });
            var obstacle = new THREE.Mesh(geometry, material);
            
            // Pick random lane
            var laneIndex = Math.floor(Math.random() * 3);
            obstacle.position.x = lanes[laneIndex];
            obstacle.position.y = 0.5;
            obstacle.position.z = -50; // Start far away
            obstacle.castShadow = true;
            obstacle.receiveShadow = true;
            
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function updateParticles() {
            // Simple speed effect
            if (Math.random() > 0.5) {
                var geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
                var mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                var p = new THREE.Mesh(geo, mat);
                p.position.x = (Math.random() - 0.5) * 20;
                p.position.y = Math.random() * 5;
                p.position.z = -50;
                scene.add(p);
                particles.push({ mesh: p, speed: 1 });
            }
        }

        function updateParticles() {
             if (Math.random() > 0.8) {
                var geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                var mat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
                var p = new THREE.Mesh(geo, mat);
                p.position.x = (Math.random() - 0.5) * 30;
                p.position.y = Math.random() * 10;
                p.position.z = -60;
                scene.add(p);
                particles.push({ mesh: p, life: 1.0 });
            }
            
            for (var i = particles.length - 1; i >= 0; i--) {
                var p = particles[i];
                p.mesh.position.z += 2;
                p.life -= 0.02;
                p.mesh.material.opacity = p.life;
                p.mesh.material.transparent = true;
                
                if (p.life <= 0 || p.mesh.position.z > 10) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }
        }

        function animate() {
            if (!isGameOver) {
                requestAnimationFrame(animate);
            }
            
            // Smooth Player Movement
            player.position.x += (targetX - player.position.x) * 0.1;
            
            // Rotate player slightly for effect
            player.rotation.z = (player.position.x - targetX) * -0.1;
            player.rotation.x += 0.05; // Rolling effect

            // Move Grid to simulate speed
            gridHelper.position.z += gameSpeed;
            if (gridHelper.position.z > 10) {
                gridHelper.position.z = 0;
            }

            // Spawn Obstacles
            if (Math.random() < 0.02 + (score * 0.0001)) {
                spawnObstacle();
            }

            // Update Obstacles
            for (var i = obstacles.length - 1; i >= 0; i--) {
                var obs = obstacles[i];
                obs.position.z += gameSpeed;

                // Collision Detection
                var playerBox = new THREE.Box3().setFromObject(player);
                var obsBox = new THREE.Box3().setFromObject(obs);
                
                // Shrink boxes slightly for forgiving gameplay
                playerBox.expandByScalar(-0.2);
                obsBox.expandByScalar(-0.2);

                if (playerBox.intersectsBox(obsBox)) {
                    gameOver();
                }

                // Remove if passed camera
                if (obs.position.z > 10) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;
                    
                    // Increase speed gradually
                    if (gameSpeed < 1.0) {
                        gameSpeed += 0.001;
                    }
                }
            }
            
            updateParticles();

            renderer.render(scene, camera);
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = score;
        }

        function resetGame() {
            // Clear obstacles
            for (var i = obstacles.length - 1; i >= 0; i--) {
                scene.remove(obstacles[i]);
            }
            obstacles = [];
            
            score = 0;
            gameSpeed = 0.5;
            currentLane = 1;
            targetX = 0;
            player.position.x = 0;
            player.rotation.set(0,0,0);
            
            document.getElementById('score').innerText = '0';
            document.getElementById('game-over').style.display = 'none';
            
            isGameOver = false;
            animate();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start
        init();

    </script>
</body>
</html>
