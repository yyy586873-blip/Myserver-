<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robot Car Racer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            height: 120px;
            pointer-events: auto;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            align-items: flex-end;
        }

        .btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .btn:active {
            background: rgba(0, 255, 255, 0.5);
        }

        .action-btn {
            width: 80px;
            height: 50px;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        #btn-trans {
            background: #ff0055;
            border-color: #cc0044;
        }

        #btn-gas {
            background: #ffcc00;
            border-color: #cc9900;
            color: black;
            font-weight: bold;
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #game-over h1 {
            color: #ff0000;
            font-size: 40px;
        }

        #restart-btn {
            padding: 15px 30px;
            font-size: 20px;
            background: #00ff88;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <div id="score-board">Score: 0</div>

    <div id="controls">
        <div style="display:flex; gap: 20px; align-items:flex-end;">
            <button id="btn-left" class="btn">◄</button>
            <button id="btn-right" class="btn">►</button>
        </div>

        <div style="display:flex; align-items:flex-end; gap: 15px;">
            <button id="btn-trans" class="btn action-btn">TRANS</button>
            <button id="btn-gas" class="btn">GAS</button>
        </div>
    </div>
</div>

<div id="game-over">
    <h1>CRASHED!</h1>
    <button id="restart-btn">RESTART</button>
</div>

<script>
    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    var w, h;

    // Game State
    var isRunning = false;
    var score = 0;
    var speed = 0;
    var maxSpeed = 12;
    var frameCount = 0;

    // Player
    var player = {
        x: 0,
        y: 0,
        width: 40,
        height: 70,
        isRobot: false,
        transformAnim: 0
    };

    // Arrays
    var bullets = [];
    var enemies = [];
    var roadLines = [];

    // Controls State
    var moveLeft = false;
    var moveRight = false;
    var gasPressed = false;

    function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w;
        canvas.height = h;
        player.y = h - 180;
    }
    window.addEventListener('resize', resize);
    resize();

    // Buttons
    var btnLeft = document.getElementById('btn-left');
    var btnRight = document.getElementById('btn-right');
    var gasBtn = document.getElementById('btn-gas');
    var transBtn = document.getElementById('btn-trans');
    var restartBtn = document.getElementById('restart-btn');

    function addTouch(elem, startFn, endFn) {
        elem.addEventListener('touchstart', function(e) { e.preventDefault(); startFn(); });
        elem.addEventListener('touchend', function(e) { e.preventDefault(); endFn(); });
        elem.addEventListener('mousedown', function() { startFn(); });
        elem.addEventListener('mouseup', function() { endFn(); });
    }

    addTouch(btnLeft, function() { moveLeft = true; }, function() { moveLeft = false; });
    addTouch(btnRight, function() { moveRight = true; }, function() { moveRight = false; });
    addTouch(gasBtn, function() { gasPressed = true; }, function() { gasPressed = false; });

    transBtn.addEventListener('click', function() {
        player.isRobot = !player.isRobot;
        player.transformAnim = 0;
        bullets = []; // Clear bullets on transform
    });

    restartBtn.addEventListener('click', startGame);

    function startGame() {
        document.getElementById('game-over').style.display = 'none';
        isRunning = true;
        score = 0;
        speed = 0;
        frameCount = 0;
        player.x = w / 2;
        player.isRobot = false;
        bullets = [];
        enemies = [];
        roadLines = [];
        animate();
    }

    function fireBullet() {
        bullets.push({
            x: player.x,
            y: player.y - 20,
            speed: 15
        });
    }

    function spawnEnemy() {
        var lane = Math.random() * (w * 0.6) - (w * 0.3);
        enemies.push({
            x: player.x + lane,
            y: -100,
            speed: 5 + Math.random() * 3,
            color: '#00ccff'
        });
    }

    function update() {
        // Speed
        if (gasPressed) {
            if (speed < maxSpeed) speed += 0.2;
        } else {
            if (speed > 1) speed -= 0.1;
            else speed = 0;
        }

        // Player Move
        if (moveLeft && player.x > 50) player.x -= 6;
        if (moveRight && player.x < w - 50) player.x += 6;

        // Transform Effect
        if (player.transformAnim < 1) {
            player.transformAnim += 0.05;
        }

        // Road
        roadLines.push({y: -20});
        if (roadLines.length < 10) roadLines.push({y: -20 + (h/10)*2});
        
        for (var i = roadLines.length - 1; i >= 0; i--) {
            roadLines[i].y += speed * 2;
            if (roadLines[i].y > h) {
                roadLines.splice(i, 1);
            }
        }

        // Enemies
        if (frameCount % 60 === 0) spawnEnemy();

        for (var i = enemies.length - 1; i >= 0; i--) {
            var e = enemies[i];
            e.y += speed + e.speed;

            // Collision
            if (
                player.x + 20 > e.x - 20 &&
                player.x - 20 < e.x + 20 &&
                player.y + 35 > e.y - 35 &&
                player.y - 35 < e.y + 35
            ) {
                gameOver();
            }

            if (e.y > h + 100) {
                enemies.splice(i, 1);
                score += 10;
                document.getElementById('score-board').innerText = "Score: " + score;
            }
        }

        // Bullets
        for (var i = bullets.length - 1; i >= 0; i--) {
            var b = bullets[i];
            b.y -= b.speed;

            for (var j = enemies.length - 1; j >= 0; j--) {
                var enemy = enemies[j];
                if (b.x > enemy.x - 20 && b.x < enemy.x + 20 && b.y > enemy.y - 35 && b.y < enemy.y + 35) {
                    enemies.splice(j, 1);
                    bullets.splice(i, 1);
                    score += 20;
                    document.getElementById('score-board').innerText = "Score: " + score;
                    break;
                }
            }

            if (b.y < -50) bullets.splice(i, 1);
        }
    }

    function draw() {
        // BG
        ctx.fillStyle = '#222';
        ctx.fillRect(0, 0, w, h);

        // Road
        ctx.fillStyle = '#444';
        ctx.fillRect(w/2 - 200, 0, 400, h);
        
        // Lane
        ctx.fillStyle = '#fff';
        ctx.fillRect(w/2 - 2, 0, 4, h);

        // Lines
        for (var i = 0; i < roadLines.length; i++) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(w/2 - 10, roadLines[i].y, 20, 40);
        }

        drawPlayer(player.x, player.y);

        for (var i = 0; i < enemies.length; i++) {
            drawCar(enemies[i].x, enemies[i].y, enemies[i].color);
        }

        for (var i = 0; i < bullets.length; i++) {
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(bullets[i].x - 2, bullets[i].y, 4, 10);
        }
    }

    function drawPlayer(x, y) {
        ctx.save();
        ctx.translate(x, y);

        var scale = 1;
        if (player.transformAnim < 1) {
            scale = 1 + Math.sin(player.transformAnim * 10) * 0.2;
        }
        ctx.scale(1, scale);

        if (player.isRobot) {
            // Robot
            ctx.fillStyle = '#0055aa';
            ctx.fillRect(-15, -30, 30, 40);
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(-10, -50, 20, 20);
            ctx.fillStyle = '#555';
            ctx.fillRect(-25, -20, 10, 30);
            ctx.fillRect(15, -20, 10, 30);
        } else {
            // Car
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(-20, -35, 40, 70);
            ctx.fillStyle = '#aa0000';
            ctx.fillRect(-18, -15, 36, 30);
            ctx.fillStyle = '#88ccff';
            ctx.fillRect(-15, -10, 30, 15);
            ctx.fillStyle = '#000';
            ctx.fillRect(-22, -30, 5, 15);
            ctx.fillRect(17, -30, 5, 15);
            ctx.fillRect(-22, 15, 5, 15);
            ctx.fillRect(17, 15, 5, 15);
        }
        ctx.restore();
    }

    function drawCar(x, y, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x - 20, y - 35, 40, 70);
        ctx.fillStyle = '#333';
        ctx.fillRect(x - 18, y - 15, 36, 30);
        ctx.fillStyle = '#000';
        ctx.fillRect(x - 22, y - 30, 5, 15);
        ctx.fillRect(x + 17, y - 30, 5, 15);
        ctx.fillRect(x - 22, y + 15, 5, 15);
        ctx.fillRect(x + 17, y + 15, 5, 15);
    }

    function gameOver() {
        isRunning = false;
        document.getElementById('game-over').style.display = 'flex';
    }

    function animate() {
        if (!isRunning) return;
        update();
        draw();
        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
