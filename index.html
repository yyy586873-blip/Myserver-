
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Mobile Web Minecraft</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none; /* Prevents browser scrolling/zooming */
            user-select: none;
            -webkit-user-select: none;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        
        /* X Shape Crosshair */
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
        }
        #crosshair::before {
            top: 4px; left: 10px; width: 4px; height: 16px;
        }
        #crosshair::after {
            top: 10px; left: 4px; width: 16px; height: 4px;
        }

        /* Controls Visuals */
        .control-hint {
            position: absolute;
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 12px;
            padding: 5px;
            border-radius: 4px;
        }
        #hint-move { bottom: 20%; left: 5%; }
        #hint-look { top: 20%; right: 5%; }
        #hint-jump { bottom: 20%; right: 5%; background: rgba(255,255,255,0.2); }

        #instructions {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            z-index: 20;
            pointer-events: auto;
        }
        #instructions h1 { margin-bottom: 10px; text-shadow: 2px 2px 0 #000; }
        #instructions p { font-size: 14px; line-height: 1.5; max-width: 80%; }
        #start-btn {
            margin-top: 20px;
            padding: 15px 40px;
            background: #555;
            color: white;
            border: 2px solid #fff;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
        }

        /* Inventory Bar */
        #hotbar {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            background: rgba(0,0,0,0.4);
            padding: 5px;
            border-radius: 8px;
            pointer-events: auto;
        }
        .slot {
            width: 40px; height: 40px;
            border: 2px solid #444;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
        }
        .active { border-color: yellow; box-shadow: 0 0 10px yellow; transform: scale(1.1); }

        /* Jump Button */
        #jump-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            pointer-events: auto;
            user-select: none;
        }
        #jump-btn:active { background: rgba(255, 255, 255, 0.5); }

        /* Stats */
        #stats {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 12px;
            text-shadow: 1px 1px 0 black;
        }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="stats">FPS: <span id="fps">0</span></div>
        
        <div id="hint-move">MOVE</div>
        <div id="hint-look">LOOK</div>
        
        <div id="jump-btn">JUMP</div>

        <div id="hotbar">
            <div class="slot active" onclick="setBlockType(1)" style="background:#567d46">🌿</div>
            <div class="slot" onclick="setBlockType(2)" style="background:#594028">🟫</div>
            <div class="slot" onclick="setBlockType(3)" style="background:#555555">🪨</div>
            <div class="slot" onclick="setBlockType(4)" style="background:#8B4513">🪵</div>
            <div class="slot" onclick="setBlockType(5)" style="background:#228B22">🍃</div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="instructions">
        <h1>Web Minecraft Mobile</h1>
        <p>
            <b>Left Half:</b> Move (Drag)<br>
            <b>Right Half:</b> Look (Swipe)<br>
            <b>Tap Center:</b> Break Block<br>
            <b>Long Press Block:</b> Place Block<br>
            <b>Jump Button:</b> Jump
        </p>
        <button id="start-btn">TAP TO START</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- Setup Scene ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 15, 60);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap pixel ratio for performance
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        // --- Assets ---
        const materials = [];
        const blockTypes = {
            1: { color: '#567d46' }, // Grass
            2: { color: '#594028' }, // Dirt
            3: { color: '#555555' }, // Stone
            4: { color: '#8B4513' }, // Wood
            5: { color: '#228B22' }  // Leaves
        };

        for (let i = 1; i <= 5; i++) {
            materials.push(new THREE.MeshLambertMaterial({ color: blockTypes[i].color }));
        }

        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const blocks = new Map(); // Map for fast lookup
        const objects = []; // Array for raycasting

        // --- World Generation ---
        function createBlock(x, y, z, type) {
            const mat = materials[type-1];
            const mesh = new THREE.Mesh(geometry, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            objects.push(mesh);
            blocks.set(`${x},${y},${z}`, mesh);
        }

        function generateWorld() {
            const size = 12; // Small world for mobile FPS
            for (let x = -size; x <= size; x++) {
                for (let z = -size; z <= size; z++) {
                    // Simple terrain
                    let y = Math.floor(Math.sin(x/4) * 2 + Math.cos(z/4) * 2);
                    
                    // Base layers
                    createBlock(x, y-1, z, 3); // Stone
                    createBlock(x, y, z, 1);   // Grass
                    
                    // Random Tree
                    if (Math.random() < 0.03 && Math.abs(x) < size-2 && Math.abs(z) < size-2) {
                        createBlock(x, y+1, z, 4);
                        createBlock(x, y+2, z, 4);
                        createBlock(x, y+3, z, 5);
                        createBlock(x+1, y+3, z, 5);
                        createBlock(x-1, y+3, z, 5);
                        createBlock(x, y+3, z+1, 5);
                        createBlock(x, y+3, z-1, 5);
                        createBlock(x, y+4, z, 5);
                    }
                }
            }
        }
        generateWorld();

        // --- Player & Physics ---
        const player = {
            height: 1.8,
            radius: 0.3,
            velocity: new THREE.Vector3(),
            direction: new THREE.Vector3(),
            canJump: false
        };
        
        camera.position.set(0, 15, 0);

        // --- Mobile Controls Logic ---
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        
        // Touch Zones
        const width = window.innerWidth;
        const midX = width / 2;

        // Touch State
        let touchIdMove = null;
        let touchIdLook = null;
        let lastTouchX = 0;
        let lastTouchY = 0;
        let lastLongPressBlock = null;

        // UI Elements
        const instructions = document.getElementById('instructions');
        const startBtn = document.getElementById('start-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const fpsEl = document.getElementById('fps');

        // Start Game
        startBtn.addEventListener('click', () => {
            instructions.style.display = 'none';
            // Try to lock pointer for smoother mouse-like feel if possible, 
            // but for mobile touch, we handle raw touch events.
        });

        // Raycaster for interaction
        const raycaster = new THREE.Raycaster();
        const center = new THREE.Vector2(0, 0); // Center of screen

        // Input Handling
        document.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                
                // Check if touching UI (Hotbar/Jump)
                if (t.target.id === 'jump-btn') return;
                if (t.target.classList.contains('slot')) return;

                if (t.clientX < midX) {
                    // Move Zone
                    touchIdMove = t.identifier;
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                } else {
                    // Look Zone
                    touchIdLook = t.identifier;
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                    
                    // Start Long Press Timer for Placement
                    lastLongPressBlock = null;
                }
            }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];

                if (t.identifier === touchIdMove) {
                    const dx = t.clientX - lastTouchX;
                    const dy = t.clientY - lastTouchY;
                    
                    // Sensitivity
                    moveRight = dx > 10;
                    moveLeft = dx < -10;
                    moveForward = dy < -10;
                    moveBackward = dy > 10;
                    
                    // Reset after a bit to stop auto-repeat if finger stays
                    // Simple logic: just map delta to flags. 
                    // For smooth movement, we'd accumulate delta, but simple flags work for basic feel.
                }

                if (t.identifier === touchIdLook) {
                    const dx = t.clientX - lastTouchX;
                    const dy = t.clientY - lastTouchY;
                    
                    euler.y -= dx * 0.005;
                    euler.x -= dy * 0.005;
                    euler.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, euler.x));
                    camera.quaternion.setFromEuler(euler);
                }

                lastTouchX = t.clientX;
                lastTouchY = t.clientY;
            }
        }, { passive: false });

        const handleTouchEnd = (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === touchIdMove) touchIdMove = null;
                if (t.identifier === touchIdLook) {
                    touchIdLook = null;
                    // If it was a tap (didn't move much), check break/place
                }
            }
            // Reset movement flags if all fingers up
            if (touchIdMove === null) {
                moveForward = moveBackward = moveLeft = moveRight = false;
            }
        };
        document.addEventListener('touchend', handleTouchEnd);
        document.addEventListener('touchcancel', handleTouchEnd);

        // Jump Logic
        jumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (player.canJump) {
                player.velocity.y = 0.25; // Jump force
                player.canJump = false;
            }
        }, { passive: false });

        // Break/Place Logic (Raycast)
        function interact() {
            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(objects);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                if (intersect.distance > 5) return; // Reach distance

                const point = intersect.point;
                const normal = intersect.face.normal;
                
                // Check if we tapped or held
                // Simplified: If we just touched right side, we check if it was a tap or hold
                // But here we handle it in a separate timeout logic or just tap-to-break, hold-to-place
                
                // For this implementation: 
                // Tap = Break
                // Hold = Place (detected in touchstart/move logic or via a separate timer)
            }
        }
        
        // Helper to handle Tap vs Hold
        let tapStart = 0;
        let isHolding = false;
        
        document.addEventListener('touchstart', (e) => {
             // Find the touch that triggered this if it's not move/look UI
             // Actually, let's use the touchend to determine if it was a tap
        });

        document.addEventListener('touchend', (e) => {
            // Find touches that were on the Right Side (Look zone)
            for (let i=0; i<e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.clientX > midX && t.identifier === touchIdLook) {
                    // It was a release of look touch. 
                    // If we didn't move much, it's a tap/click.
                    // We already handle look movement in touchmove.
                    // If we are here, it means finger lifted.
                    
                    // To differentiate Tap vs Hold, we check duration.
                    // But simpler: 
                    // 1. If we just clicked (no move), Break.
                    // 2. If we held (finger down for > 300ms), Place at last hovered block.
                    
                    // For this simple version: 
                    // Click center of screen = Break
                    // Click on a block = Break
                    // If we want Place, we can use the "Long Press" logic.
                    
                    // Let's do: Tap = Break. To Place, user needs to select block type and... 
                    // actually, let's add a specific "Place" logic on long press.
                }
            }
        });

        // Better Interaction: 
        // Tap anywhere = Break nearest block.
        // Long Press on a block = Place block against it.
        
        let longPressTimer = null;
        let lastIntersectedBlock = null;

        document.addEventListener('touchstart', (e) => {
            for(let i=0; i<e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if(t.clientX > midX) { // Look zone touch
                    // Raycast to find what we are touching
                    raycaster.setFromCamera(center, camera);
                    const intersects = raycaster.intersectObjects(objects);
                    if(intersects.length > 0 && intersects[0].distance < 5) {
                        lastIntersectedBlock = intersects[0];
                        longPressTimer = setTimeout(() => {
                            placeBlock(lastIntersectedBlock);
                        }, 300); // 300ms hold to place
                    }
                }
            }
        });

        document.addEventListener('touchend', (e) => {
            // If timer is still running, it was a Tap, so Break
            if(longPressTimer) {
                clearTimeout(longPressTimer);
                breakBlock(lastIntersectedBlock);
                longPressTimer = null;
            }
        });

        function breakBlock(intersect) {
            if(!intersect) return;
            const obj = intersect.object;
            scene.remove(obj);
            const idx = objects.indexOf(obj);
            if (idx > -1) objects.splice(idx, 1);
            blocks.delete(`${obj.position.x},${obj.position.y},${obj.position.z}`);
        }

        function placeBlock(intersect) {
            if(!intersect) return;
            const pos = intersect.point.clone().add(intersect.face.normal.clone().multiplyScalar(0.5)).floor().addScalar(0.5);
            
            // Don't place inside player
            const pPos = camera.position;
            if (Math.abs(pPos.x - pos.x) < 0.8 && Math.abs(pPos.z - pos.z) < 0.8 && 
                (pPos.y - 1.5 < pos.y && pPos.y > pos.y)) return;

            createBlock(pos.x, pos.y, pos.z, selectedBlockType);
        }

        // --- Game Loop ---
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        let selectedBlockType = 1;
        let lastTime = performance.now();
        let frameCount = 0;

        function setBlockType(id) {
            selectedBlockType = id;
            document.querySelectorAll('.slot').forEach((el, i) => {
                el.classList.toggle('active', i === id-1);
            });
        }

        function update() {
            const dt = (performance.now() - lastTime) / 1000;
            lastTime = performance.now();
            fpsEl.innerText = Math.round(1/dt);

            // Movement
            player.velocity.x -= player.velocity.x * 10.0 * dt;
            player.velocity.z -= player.velocity.z * 10.0 * dt;
            player.velocity.y -= 9.8 * 2.0 * dt; // Gravity

            player.direction.z = Number(moveForward) - Number(moveBackward);
            player.direction.x = Number(moveRight) - Number(moveLeft);
            player.direction.normalize();

            if (moveForward || moveBackward) player.velocity.z -= player.direction.z * 100.0 * dt;
            if (moveLeft || moveRight) player.velocity.x -= player.direction.x * 100.0 * dt;

            // Collision Detection (Simplified)
            // Check Y
            const feetY = camera.position.y - player.height;
            const blockX = Math.round(camera.position.x);
            const blockY = Math.round(feetY);
            const blockZ = Math.round(camera.position.z);

            if (blocks.has(`${blockX},${blockY},${blockZ}`)) {
                player.velocity.y = Math.max(0, player.velocity.y);
                player.canJump = true;
                camera.position.y = blockY + 1 + player.height/2;
            } else {
                camera.position.y += player.velocity.y * dt;
                if(camera.position.y < -10) camera.position.y = 20; // Respawn
            }

            renderer.render(scene, camera);
            requestAnimationFrame(update);
        }

        // Init
        update();
        
        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
