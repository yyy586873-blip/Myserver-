
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Mobile Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue */
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            z-index: 10;
        }
        #joystick-zone {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }
        #joystick-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>
</div>
<div id="instructions">Drag left to move<br>Drag right to rotate camera</div>

<script type="module">
    import * as THREE from 'https://unpkg.com/three@0.150.0/build/three.module.js';

    // --- Setup ---
    const container = document.getElementById('game-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.camera.top = 20;
    dirLight.shadow.camera.bottom = -20;
    dirLight.shadow.camera.left = -20;
    dirLight.shadow.camera.right = 20;
    scene.add(dirLight);

    // --- World ---
    // Ground
    const groundGeo = new THREE.PlaneGeometry(200, 200);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x4CAF50 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Simple Trees/Blocks
    for (let i = 0; i < 50; i++) {
        const h = Math.random() * 2 + 1;
        const treeGeo = new THREE.BoxGeometry(0.5, h, 0.5);
        const treeMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
        const tree = new THREE.Mesh(treeGeo, treeMat);
        
        const x = (Math.random() - 0.5) * 100;
        const z = (Math.random() - 0.5) * 100;
        
        // Don't spawn on start area
        if (Math.abs(x) < 5 && Math.abs(z) < 5) continue;

        tree.position.set(x, h / 2, z);
        tree.castShadow = true;
        tree.receiveShadow = true;
        scene.add(tree);

        // Leaves
        const leafGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const leafMat = new THREE.MeshStandardMaterial({ color: 0x228B22 });
        const leaves = new THREE.Mesh(leafGeo, leafMat);
        leaves.position.set(x, h + 0.5, z);
        leaves.castShadow = true;
        scene.add(leaves);
    }

    // --- Player Character (Simple Blocky) ---
    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    // Body
    const bodyGeo = new THREE.BoxGeometry(1, 1.5, 0.6);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xFF0000 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.5;
    body.castShadow = true;
    playerGroup.add(body);

    // Head
    const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xFFCCAA });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 2.6;
    head.castShadow = true;
    playerGroup.add(head);

    // Arms
    const armGeo = new THREE.BoxGeometry(0.3, 1, 0.3);
    const armMat = new THREE.MeshStandardMaterial({ color: 0xFFCCAA });
    
    const leftArm = new THREE.Mesh(armGeo, armMat);
    leftArm.position.set(-0.7, 1.5, 0);
    playerGroup.add(leftArm);

    const rightArm = new THREE.Mesh(armGeo, armMat);
    rightArm.position.set(0.7, 1.5, 0);
    playerGroup.add(rightArm);

    // Legs
    const legGeo = new THREE.BoxGeometry(0.4, 1, 0.4);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x0000FF });
    
    const leftLeg = new THREE.Mesh(legGeo, legMat);
    leftLeg.position.set(-0.25, 0.5, 0);
    playerGroup.add(leftLeg);

    const rightLeg = new THREE.Mesh(legGeo, legMat);
    rightLeg.position.set(0.25, 0.5, 0);
    playerGroup.add(rightLeg);

    playerGroup.position.set(0, 0, 0);

    // --- Camera Logic ---
    let cameraAngleH = 0; // Horizontal angle
    let cameraAngleV = 0.5; // Vertical angle
    const cameraDistance = 5;
    const cameraTarget = new THREE.Vector3();

    // --- Controls ---
    let moveX = 0;
    let moveZ = 0;
    let isDraggingJoystick = false;
    let isDraggingCamera = false;
    let lastJoystickX = 0;
    let lastJoystickY = 0;
    let lastCameraX = 0;
    let lastCameraY = 0;

    const joystickZone = document.getElementById('joystick-zone');
    const joystickKnob = document.getElementById('joystick-knob');
    const instructions = document.getElementById('instructions');

    // Touch Events
    joystickZone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = joystickZone.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        isDraggingJoystick = true;
        lastJoystickX = touch.clientX;
        lastJoystickY = touch.clientY;
        updateJoystick(touch.clientX, touch.clientY);
    }, {passive: false});

    document.addEventListener('touchmove', (e) => {
        if (isDraggingJoystick) {
            const touch = e.touches[0];
            // Check if touch is still roughly near joystick or if we are dragging camera
            // Simple logic: Left half of screen moves joystick, Right half rotates camera
            
            const screenHalfWidth = window.innerWidth / 2;
            
            if (touch.clientX < screenHalfWidth) {
                updateJoystick(touch.clientX, touch.clientY);
            } else {
                // Camera rotation
                const deltaX = touch.clientX - lastCameraX;
                const deltaY = touch.clientY - lastCameraY;
                
                cameraAngleH -= deltaX * 0.01;
                cameraAngleV += deltaY * 0.01;
                cameraAngleV = Math.max(0.1, Math.min(1.5, cameraAngleV)); // Clamp vertical view
                
                lastCameraX = touch.clientX;
                lastCameraY = touch.clientY;
            }
        }
    }, {passive: false});

    document.addEventListener('touchend', () => {
        isDraggingJoystick = false;
        moveX = 0;
        moveZ = 0;
        joystickKnob.style.transform = `translate(-50%, -50%)`;
    });

    function updateJoystick(touchX, touchY) {
        const rect = joystickZone.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        let dx = touchX - centerX;
        let dy = touchY - centerY;
        
        const maxDist = 50;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist > maxDist) {
            dx = (dx / dist) * maxDist;
            dy = (dy / dist) * maxDist;
        }
        
        joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        
        // Normalize -1 to 1
        moveX = dx / maxDist;
        moveZ = dy / maxDist;
    }

    // --- Animation Loop ---
    let time = 0;

    function animate() {
        requestAnimationFrame(animate);
        
        // Movement
        if (moveX !== 0 || moveZ !== 0) {
            // Calculate movement direction relative to camera angle
            const speed = 0.1;
            const angle = Math.atan2(moveX, moveZ); // Joystick angle
            
            // Move player
            const moveAngle = angle + cameraAngleH;
            playerGroup.position.x += Math.sin(moveAngle) * speed;
            playerGroup.position.z += Math.cos(moveAngle) * speed;
            
            // Rotate player to face movement direction
            const targetRotation = angle + cameraAngleH;
            const targetQuat = new THREE.Quaternion();
            targetQuat.setFromEuler(new THREE.Euler(0, targetRotation, 0));
            playerGroup.quaternion.slerp(targetQuat, 0.1);
            
            // Animate Legs
            time += 0.2;
            leftLeg.rotation.x = Math.sin(time) * 0.5;
            rightLeg.rotation.x = Math.sin(time + Math.PI) * 0.5;
            leftArm.rotation.x = Math.sin(time + Math.PI) * 0.5;
            rightArm.rotation.x = Math.sin(time) * 0.5;
        } else {
            // Idle Animation
            leftLeg.rotation.x = 0;
            rightLeg.rotation.x = 0;
            leftArm.rotation.x = 0;
            rightArm.rotation.x = 0;
        }

        // Camera Follow
        const camX = playerGroup.position.x - Math.sin(cameraAngleH) * Math.cos(cameraAngleV) * cameraDistance;
        const camY = playerGroup.position.y + Math.sin(cameraAngleV) * cameraDistance;
        const camZ = playerGroup.position.z - Math.cos(cameraAngleH) * Math.cos(cameraAngleV) * cameraDistance;
        
        camera.position.set(camX, camY, camZ);
        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

        renderer.render(scene, camera);
    }

    // Handle Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();

</script>
</body>
</html>
