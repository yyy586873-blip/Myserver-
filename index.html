<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>Call History</title>

<style>

body{
font-family:Arial;
padding:20px;
}

.item{
padding:10px;
margin:10px;
border:1px solid #ddd;
}

</style>

</head>

<body>

<h1>Call History</h1>

<div id="history"></div>

<script>

fetch("/api/history")
.then(r=>r.json())
.then(data=>{

let html="";

data.forEach(x=>{

html+=`
<div class=item>

<b>From:</b> ${x.from}<br>
<b>To:</b> ${x.to}<br>
<b>Status:</b> ${x.status}<br>
<b>Time:</b> ${x.time}

</div>
`;

});

document.getElementById(
"history"
).innerHTML=html;

});

</script>

</body>
</html>
