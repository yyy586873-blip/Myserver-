<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>True Spatial AR - Integrated Screen</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            touch-action: none;
        }

        /* 3D Scene Container */
        .scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 600px; /* Depth perception */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The World that rotates with your head */
        .world {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s linear; /* Smoothness */
        }

        /* 1. Background Camera Layer */
        #camera-stream {
            position: absolute;
            top: -50%; 
            left: -50%;
            width: 200%; 
            height: 200%;
            object-fit: cover;
            z-index: 1;
            transform: translateZ(-200px); /* Push it back slightly for depth */
        }

        /* 2. The Video Screen (Floating in Space) */
        .video-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 70vw;
            height: 45vh;
            transform: translate(-50%, -50%) translateZ(0px); /* Center but at Z=0 */
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.5s ease;
            background: #000;
        }

        .tv-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
        }

        button, label.file-label {
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 1px solid #fff;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }

        input[type="file"] { display: none; }

        #status {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #0f0;
            background: rgba(0,0,0,0.8);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 100;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="status">Initializing...</div>

    <!-- 3D Scene -->
    <div class="scene">
        <div class="world" id="world">
            <!-- Background Camera -->
            <video id="camera-stream" autoplay playsinline muted></video>
            
            <!-- Video Screen (Integrated into the world) -->
            <div class="video-screen" id="tvScreen">
                <video id="movie-player" class="tv-video" loop controlsList="nodownload"></video>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <label for="file-upload" class="file-label">📂 Load Video</label>
        <input type="file" id="file-upload" accept="video/*">
        <button onclick="togglePlay()">⏯ Play/Pause</button>
    </div>

    <script>
        const camera = document.getElementById('camera-stream');
        const player = document.getElementById('movie-player');
        const fileInput = document.getElementById('file-upload');
        const tvScreen = document.getElementById('tvScreen');
        const world = document.getElementById('world');
        const statusDiv = document.getElementById('status');

        let beta = 0; // Tilt Front/Back
        let gamma = 0; // Tilt Left/Right

        // 1. Start Camera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });
                camera.srcObject = stream;
                statusDiv.innerText = "Camera Active. Loading Sensors...";

                // Request Permission for iOS
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(response => {
                            if (response == 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                                statusDiv.innerText = "Sensors Active! Move phone.";
                            } else {
                                statusDiv.innerText = "Sensors denied.";
                            }
                        })
                        .catch(console.error);
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                    statusDiv.innerText = "Sensors Active! Move phone.";
                }

            } catch (err) {
                statusDiv.innerText = "Camera Error: " + err.message;
            }
        }

        // 2. Handle Orientation (The Core Logic)
        function handleOrientation(event) {
            let b = event.beta;   // Front/Back tilt
            let g = event.gamma;  // Left/Right tilt

            // Clamp values to prevent weird flips
            if (b > 150) b = 150;
            if (b < 30) b = 30;
            if (g > 60) g = 60;
            if (g < -60) g = -60;

            // Calculate Rotation for the ENTIRE WORLD
            // This moves both Camera and Video together, preserving their relative positions
            // We invert gamma because moving phone right makes the world appear to move left
            const xRotation = -(b - 90); 
            const yRotation = g; 

            world.style.transform = `rotateX(${xRotation}deg) rotateY(${yRotation}deg)`;
        }

        // 3. Load Local Video
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                player.src = url;
                tvScreen.style.opacity = '1'; // Show screen
                togglePlay(); // Auto play
                statusDiv.innerText = "Video Loaded. Move phone to see integration.";
            }
        });

        // 4. Play/Pause
        function togglePlay() {
            if (player.paused) {
                player.play();
            } else {
                player.pause();
            }
        }

        // Initialize
        startCamera();

    </script>
</body>
</html>
