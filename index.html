
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <style>
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            padding: 40px;
            width: 350px;
            text-align: center;
            margin-bottom: 10px;
        }

        .logo {
            font-family: 'Grand Hotel', cursive; /* Fallback if Google Fonts isn't linked, but using system font for simplicity */
            font-size: 36px;
            margin-bottom: 20px;
            font-weight: normal;
            font-style: italic;
        }

        .input-group {
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 14px 8px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 12px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border: 1px solid #a8a8a8;
        }

        .login-btn {
            background-color: #0095f6;
            border: none;
            color: #fff;
            padding: 7px 16px;
            border-radius: 8px;
            width: 100%;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: default;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0;
        }

        .line {
            flex-grow: 1;
            height: 1px;
            background-color: #dbdbdb;
        }

        .or-text {
            margin: 0 16px;
            font-size: 13px;
            font-weight: 600;
            color: #8e8e8e;
            text-transform: uppercase;
        }

        .forgot {
            display: block;
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
            margin-top: 16px;
            margin-bottom: 20px;
        }

        .signup-box {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            padding: 20px;
            width: 350px;
            text-align: center;
            font-size: 14px;
        }

        .signup-box a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
    <!-- Google Font for Logo -->
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
</head>
<body>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div class="login-container">
            <div class="logo">Instagram</div>
            <form>
                <div class="input-group">
                    <input type="text" placeholder="Phone number, username, or email" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" required>
                </div>
                <button type="submit" class="login-btn">Log in</button>
            </form>
            <div class="divider">
                <div class="line"></div>
                <span class="or-text">or</span>
                <div class="line"></div>
            </div>
            <a href="#" class="forgot">Forgot password?</a>
        </div>
        
        <div class="signup-box">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>

</body>
</html>
