<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>World Chat</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#080b10;color:#f3f6fb}body{overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 20% 0%,#172435 0,#080b10 42%)}
.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #222b36;background:rgba(12,17,24,.92)}
.brand{display:flex;align-items:center;gap:11px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#263b51,#111923);display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 5px 18px #0006}.title{font-size:18px;font-weight:800}.sub{font-size:10px;color:#8290a1;margin-top:3px}.state{font-size:10px;padding:7px 10px;border-radius:20px}
.chat{flex:1;overflow:auto;padding:14px 12px}.row{margin:8px 0;display:flex}.row.me{justify-content:flex-end}.bubble{max-width:84%;background:#141d27;border:1px solid #253241;border-radius:17px;padding:10px 12px;box-shadow:0 5px 16px #0003}.me .bubble{background:#183148;border-color:#28516e}.admin .bubble{background:#332817;border-color:#7a5b20}.name{font-size:10px;color:#7fc2ff;margin-bottom:5px;font-weight:700}.adminName{color:#f2c45c}.text{white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.4}.meta{font-size:9px;color:#778494;margin-top:5px;text-align:right}.system{text-align:center;color:#738093;font-size:10px;margin:9px}.sync{font-size:10px;color:#8d9bad;text-align:center;padding:5px}
.fileCard{border:1px solid #2a3a4b;border-radius:13px;padding:10px;min-width:190px}.fileTop{display:flex;gap:10px;align-items:center}.fileIcon{font-size:24px}.fileName{font-size:13px;word-break:break-all}.fileSize{font-size:10px;color:#8290a1;margin-top:3px}.downloadBtn{margin-top:9px;border:1px solid #39566e;border-radius:9px;padding:7px 10px;background:#172635;color:#9fd0f7;font-size:11px;text-decoration:none;display:inline-block}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#657286;text-align:center}.bottom{padding:9px;border-top:1px solid #222b36;background:rgba(10,15,21,.96)}.composer{display:flex;gap:8px;align-items:flex-end}.attach,.send{width:45px;height:45px;border:0;border-radius:14px;color:#fff;font-size:20px}.attach{background:#1b2734}.send{background:#4a8fc9}.inputWrap{flex:1;background:#151e28;border:1px solid #293745;border-radius:14px;padding:4px 8px}textarea{width:100%;height:35px;max-height:100px;resize:none;border:0;outline:0;background:transparent;color:#fff;font-family:inherit;font-size:15px;padding:7px}
.progress{height:4px;background:#273443;border-radius:9px;margin-top:8px;overflow:hidden}.progress>div{height:100%;width:0;background:#74b4e8}input[type=file]{display:none}
</style></head><body>
<div class="app"><div class="top"><div class="brand"><div class="logo">🌐</div><div><div class="title">World Chat</div><div class="sub" id="userLine">Connecting...</div></div></div><div class="state" id="state">CONNECTING</div></div>
<div class="chat" id="chat"><div class="empty" id="empty"><div><div style="font-size:34px">🌍</div><div style="margin-top:8px">Welcome to World Chat</div><div style="font-size:11px;margin-top:5px">Your local history is kept for 24 hours.</div></div></div></div>
<div class="bottom"><div class="composer"><button class="attach" id="attach">＋</button><div class="inputWrap"><textarea id="input" placeholder="Message everyone..."></textarea></div><button class="send" id="send">➤</button></div><input id="file" type="file"></div></div>
<script>
(function(){
"use strict";
var SERVER="https://myserver-b0ls.onrender.com",WS="wss://myserver-b0ls.onrender.com/ws";
var USERKEY="wc_user_v3",CHATKEY="wc_chat_v3",TTL=86400000;
var chat=document.getElementById("chat"),empty=document.getElementById("empty"),state=document.getElementById("state"),userLine=document.getElementById("userLine"),input=document.getElementById("input"),send=document.getElementById("send"),attach=document.getElementById("attach"),file=document.getElementById("file");
var user,socket,reconnectTimer,reconnectDelay=1000,settings={messageEnabled:true,attachmentEnabled:true,cooldownMs:0};

function id(){return Date.now()+"_"+Math.random().toString(36).slice(2)+"_"+Math.random().toString(36).slice(2)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function setState(t,on){state.textContent=t;state.style.color=on?"#82dfa0":"#efb4b4";state.style.background=on?"#14271c":"#2b1b1d"}
function loadUser(){try{user=JSON.parse(localStorage.getItem(USERKEY)||"null")}catch(e){user=null}if(!user||!user.id){var n=prompt("World Chat name:","User"+Math.floor(1000+Math.random()*9000));if(!n||!n.trim())n="User"+Math.floor(1000+Math.random()*9000);user={id:id(),name:n.trim().substring(0,40)};try{localStorage.setItem(USERKEY,JSON.stringify(user))}catch(e2){}}userLine.textContent=user.name}
function history(){var a=[];try{a=JSON.parse(localStorage.getItem(CHATKEY)||"[]")}catch(e){}var now=Date.now(),b=[];for(var i=0;i<a.length;i++)if(now-Number(a[i].timestamp||0)<=TTL)b.push(a[i]);try{localStorage.setItem(CHATKEY,JSON.stringify(b.slice(-500)))}catch(e2){}return b.slice(-500)}
function save(m){var a=history();var found=false;for(var i=0;i<a.length;i++)if(a[i].messageId===m.messageId)found=true;if(!found)a.push(m);try{localStorage.setItem(CHATKEY,JSON.stringify(a.slice(-500)))}catch(e){}}
function time(t){try{return new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
function size(n){n=Number(n||0);if(n<1024)return n+" B";if(n<1048576)return(n/1024).toFixed(1)+" KB";if(n<1073741824)return(n/1048576).toFixed(1)+" MB";return(n/1073741824).toFixed(1)+" GB"}
function render(m){
if(empty)empty.style.display="none";var row=document.createElement("div");row.className="row"+(m.senderId===user.id?" me":"")+(m.role==="admin"?" admin":"");var b=document.createElement("div");b.className="bubble";var h="";
if(m.senderId!==user.id){h+='<div class="name '+(m.role==="admin"?"adminName":"")+'">'+(m.role==="admin"?"★ ":"")+esc(m.senderName||"User")+"</div>"}
if(m.messageType==="file"){var u=SERVER+"/file/"+encodeURIComponent(m.fileId||""),icon=(m.mime||"").indexOf("image/")===0?"🖼️":((m.mime||"").indexOf("video/")===0?"🎬":"📎");h+='<div class="fileCard"><div class="fileTop"><div class="fileIcon">'+icon+'</div><div><div class="fileName">'+esc(m.fileName||"Attachment")+'</div><div class="fileSize">'+size(m.size)+'</div></div></div><a class="downloadBtn" href="'+esc(u)+'" download="'+esc(m.fileName||"download")+'">Download</a></div>'}else h+='<div class="text">'+esc(m.text||"")+"</div>";
h+='<div class="meta">'+time(m.timestamp)+'</div>';b.innerHTML=h;row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight}
function system(t){var e=document.createElement("div");e.className="system";e.textContent=t;chat.appendChild(e);chat.scrollTop=chat.scrollHeight}
function renderHistory(){var a=history();chat.innerHTML="";if(!a.length){chat.appendChild(empty);empty.style.display="flex";return}for(var i=0;i<a.length;i++)render(a[i])}
function packet(o){if(!socket||socket.readyState!==1){system("Server connection unavailable.");return false}try{socket.send(JSON.stringify(o));return true}catch(e){return false}}
function connect(){clearTimeout(reconnectTimer);setState("CONNECTING",false);try{socket=new WebSocket(WS)}catch(e){retry();return}
socket.onopen=function(){reconnectDelay=1000;setState("ONLINE",true);packet({type:"hello",userId:user.id,name:user.name})};
socket.onmessage=function(ev){var d;try{d=JSON.parse(ev.data)}catch(e){return}
if(d.type==="connected")return;
if(d.type==="ready"){settings=d.settings||settings;setState("ONLINE",true);userLine.textContent=user.name+" • "+d.online+" online";if(d.notice)system(d.notice);return}
if(d.type==="presence"){userLine.textContent=user.name+" • "+d.online+" online";return}
if(d.type==="settings"){settings=d.settings||settings;return}
if(d.type==="history_sync"){var a=d.messages||[];for(var i=0;i<a.length;i++){save(a[i])}renderHistory();system("Synced "+a.length+" recent messages.");return}
if(d.type==="history_cleared"){localStorage.removeItem(CHATKEY);renderHistory();system("Chat history was cleared.");return}
if(d.type==="error"){system(d.message||"Server error");return}
if(d.type==="message"){save(d);render(d)}};
socket.onerror=function(){setState("ERROR",false)};socket.onclose=function(){setState("OFFLINE",false);retry()}}
function retry(){clearTimeout(reconnectTimer);reconnectTimer=setTimeout(connect,reconnectDelay);reconnectDelay=Math.min(reconnectDelay*2,30000)}
function sendText(){var t=input.value.trim();if(!t)return;if(!settings.messageEnabled){system("Messages are disabled.");return}if(packet({type:"message",messageId:id(),senderId:user.id,senderName:user.name,messageType:"text",text:t,timestamp:Date.now()})){input.value="";input.style.height="35px"}}
function upload(f){if(!settings.attachmentEnabled){system("Attachments are disabled.");return}if(!f)return;if(f.size>104857600){system("Maximum file size is 100 MB.");return}
var line=document.createElement("div");line.className="system";line.textContent="Uploading "+f.name;var p=document.createElement("div");p.className="progress";var bar=document.createElement("div");p.appendChild(bar);line.appendChild(p);chat.appendChild(line);
var x=new XMLHttpRequest();x.open("POST",SERVER+"/upload?name="+encodeURIComponent(f.name)+"&mime="+encodeURIComponent(f.type||"application/octet-stream"),true);x.setRequestHeader("Content-Type",f.type||"application/octet-stream");
x.upload.onprogress=function(e){if(e.lengthComputable)bar.style.width=Math.round(e.loaded/e.total*100)+"%"};
x.onload=function(){if(x.status<200||x.status>=300){system("Upload failed.");return}var r;try{r=JSON.parse(x.responseText)}catch(e){r=null}if(!r||!r.ok){system("Upload response invalid.");return}packet({type:"message",messageId:id(),senderId:user.id,senderName:user.name,messageType:"file",fileId:r.fileId,fileName:r.fileName,mime:r.mime,size:r.size,timestamp:Date.now()})};x.onerror=function(){system("Upload network error.")};x.send(f)}
send.onclick=sendText;input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendText()}});input.addEventListener("input",function(){input.style.height="35px";input.style.height=Math.min(input.scrollHeight,100)+"px"});attach.onclick=function(){if(settings.attachmentEnabled)file.click();else system("Attachments are disabled.")};file.onchange=function(){if(file.files&&file.files.length)upload(file.files[0]);file.value=""};
loadUser();renderHistory();connect();
})();
</script></body></html>
