
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Endless City Racer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky Blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        /* UI Container */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let touches pass through to 3D canvas */
            z-index: 10;
        }

        /* Speedometer */
        #speedometer {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #fff;
            font-size: 32px;
            font-weight: 900;
            text-shadow: 2px 2px 0 #000;
            font-style: italic;
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 10px;
        }

        /* Control Buttons */
        .controls-area {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            box-sizing: border-box;
            pointer-events: auto;
        }

        .dpad {
            position: relative;
            width: 160px;
            height: 160px;
        }

        .btn {
            position: absolute;
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            user-select: none;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn:active { background: rgba(255, 255, 255, 0.6); border-color: #fff; transform: scale(0.95); }
        
        /* D-Pad positioning */
        .btn-up { top: 0; left: 52px; border-radius: 10px 10px 0 0; border-bottom: none; }
        .btn-down { bottom: 0; left: 52px; border-radius: 0 0 10px 10px; border-top: none; }
        .btn-left { top: 52px; left: 0; border-radius: 10px 0 0 10px; border-right: none; }
        .btn-right { top: 52px; right: 0; border-radius: 0 10px 10px 0; border-left: none; }

        /* Camera Control Zone (Right side of screen) */
        #camera-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            pointer-events: auto;
            /* background: rgba(255,255,255,0.05); Debugging */
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 20;
            max-width: 200px;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="info">
            Endless Open World<br>
            Swipe Right Screen to Rotate Camera<br>
            Use Buttons to Drive
        </div>
        <div id="speedometer">0 KM/H</div>
        
        <div class="controls-area">
            <div class="dpad">
                <div class="btn btn-up" id="btn-up">▲</div>
                <div class="btn btn-down" id="btn-down">▼</div>
                <div class="btn btn-left" id="btn-left">◄</div>
                <div class="btn btn-right" id="btn-right">►</div>
            </div>
        </div>
    </div>

    <div id="camera-zone"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- Configuration ---
        var WORLD_SIZE = 1000; // 1km x 1km city
        var GRID_SIZE = 20;    // Size of each road block
        var ROAD_WIDTH = 12;
        var AI_COUNT = 20;
        
        // Globals
        var scene, camera, renderer;
        var car;
        var traffic = [];
        var worldObjects = []; // Buildings, etc.
        
        // State
        var keys = { up: false, down: false, left: false, right: false };
        var camMode = 'follow'; // 'follow' or 'free'
        var camAngleH = 0; // Horizontal rotation
        var camAngleV = 0.5; // Vertical tilt
        var camDist = 12;
        
        // Physics
        var speed = 0;
        var maxSpeed = 2.5;
        var acceleration = 0.03;
        var friction = 0.985;
        var turnSpeed = 0.05;
        var angle = 0;

        // --- Init ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); 
            scene.fog = new THREE.Fog(0x87CEEB, 80, 400);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            var ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 200, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 500;
            dirLight.shadow.camera.left = -150;
            dirLight.shadow.camera.right = 150;
            dirLight.shadow.camera.top = 150;
            dirLight.shadow.camera.bottom = -150;
            scene.add(dirLight);

            createWorld();
            createCar();
            spawnTraffic();
            setupInputs();

            window.addEventListener('resize', onResize, false);

            animate();
        }

        // --- World Generation ---
        function createWorld() {
            // Ground (Grass)
            var groundGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE);
            var groundMat = new THREE.MeshStandardMaterial({ color: 0x4caf50 });
            var ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Road Grid
            var roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            var lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

            for (var x = -WORLD_SIZE/2; x < WORLD_SIZE/2; x += GRID_SIZE) {
                // Vertical Roads
                var roadV = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, WORLD_SIZE), roadMat);
                roadV.rotation.x = -Math.PI / 2;
                roadV.position.set(x, 0.01, 0);
                scene.add(roadV);

                // Center Line V
                var lineV = new THREE.Mesh(new THREE.PlaneGeometry(0.2, WORLD_SIZE), lineMat);
                lineV.rotation.x = -Math.PI / 2;
                lineV.position.set(x, 0.02, 0);
                scene.add(lineV);
            }

            for (var z = -WORLD_SIZE/2; z < WORLD_SIZE/2; z += GRID_SIZE) {
                // Horizontal Roads
                var roadH = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_SIZE, ROAD_WIDTH), roadMat);
                roadH.rotation.x = -Math.PI / 2;
                roadH.position.set(0, 0.02, z);
                scene.add(roadH);
            }

            // Buildings
            var buildMat = new THREE.MeshStandardMaterial({ color: 0x666666 });
            for (var i = 0; i < 150; i++) {
                var h = 10 + Math.random() * 40;
                var bGeo = new THREE.BoxGeometry(10 + Math.random()*10, h, 10 + Math.random()*10);
                var building = new THREE.Mesh(bGeo, buildMat);
                
                // Random pos on grid
                var bx = (Math.random() - 0.5) * WORLD_SIZE;
                var bz = (Math.random() - 0.5) * WORLD_SIZE;
                
                // Snap to grid roughly (simplified)
                bx = Math.round(bx / (GRID_SIZE/2)) * (GRID_SIZE/2);
                bz = Math.round(bz / (GRID_SIZE/2)) * (GRID_SIZE/2);

                building.position.set(bx, h/2, bz);
                building.castShadow = true;
                building.receiveShadow = true;
                scene.add(building);
                worldObjects.push(building);
            }
        }

        // --- Car Creation ---
        function createCar() {
            car = new THREE.Group();

            // Body
            var bodyGeo = new THREE.BoxGeometry(2, 0.8, 4.5);
            var bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0000, metalness: 0.6, roughness: 0.2 });
            var body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            car.add(body);

            // Cabin
            var cabinGeo = new THREE.BoxGeometry(1.8, 0.6, 2.5);
            var cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
            var cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.y = 1.2;
            cabin.position.z = -0.2;
            car.add(cabin);

            // Spoiler
            var spoilerGeo = new THREE.BoxGeometry(2, 0.1, 0.5);
            var spoiler = new THREE.Mesh(spoilerGeo, bodyMat);
            spoiler.position.set(0, 1.4, 2.2);
            car.add(spoiler);

            // Wheels
            var wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.4, 24);
            var wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            
            var positions = [
                { x: -1.1, y: 0.45, z: 1.5 },
                { x: 1.1, y: 0.45, z: 1.5 },
                { x: -1.1, y: 0.45, z: -1.5 },
                { x: 1.1, y: 0.45, z: -1.5 }
            ];

            for (var i = 0; i < positions.length; i++) {
                var w = new THREE.Mesh(wheelGeo, wheelMat);
                w.rotation.z = Math.PI / 2;
                w.position.set(positions[i].x, positions[i].y, positions[i].z);
                w.castShadow = true;
                car.add(w);
            }

            // Lights
            var hlGeo = new THREE.BoxGeometry(0.3, 0.15, 0.1);
            var hlMat = new THREE.MeshBasicMaterial({ color: 0xffffcc });
            var hl1 = new THREE.Mesh(hlGeo, hlMat);
            hl1.position.set(-0.6, 0.7, 2.25);
            car.add(hl1);
            var hl2 = new THREE.Mesh(hlGeo, hlMat);
            hl2.position.set(0.6, 0.7, 2.25);
            car.add(hl2);

            scene.add(car);
        }

        // --- Traffic AI ---
        function spawnTraffic() {
            for (var i = 0; i < AI_COUNT; i++) {
                var color = Math.random() > 0.5 ? 0x3333ff : 0xffff00; // Blue or Yellow
                var aiCar = createSimpleCar(color);
                
                // Random start pos
                var x = (Math.random() - 0.5) * WORLD_SIZE;
                var z = (Math.random() - 0.5) * WORLD_SIZE;
                
                aiCar.position.set(x, 0.5, z);
                aiCar.userData = {
                    speed: 0.5 + Math.random() * 0.5,
                    direction: Math.random() * Math.PI * 2,
                    changeTime: 0
                };
                
                scene.add(aiCar);
                traffic.push(aiCar);
            }
        }

        function createSimpleCar(color) {
            var group = new THREE.Group();
            var body = new THREE.Mesh(
                new THREE.BoxGeometry(1.8, 0.6, 4),
                new THREE.MeshStandardMaterial({ color: color })
            );
            body.position.y = 0.3;
            body.castShadow = true;
            group.add(body);
            
            var top = new THREE.Mesh(
                new THREE.BoxGeometry(1.6, 0.5, 2),
                new THREE.MeshStandardMaterial({ color: 0x111111 })
            );
            top.position.y = 0.8;
            top.position.z = -0.2;
            group.add(top);
            
            return group;
        }

        function updateTraffic() {
            for (var i = 0; i < traffic.length; i++) {
                var t = traffic[i];
                
                // Simple AI: Move forward, turn occasionally
                t.position.z += Math.cos(t.userData.direction) * t.userData.speed;
                t.position.x += Math.sin(t.userData.direction) * t.userData.speed;
                t.rotation.y = t.userData.direction;

                // Change direction if hitting edge or randomly
                if (t.position.x < -WORLD_SIZE/2 || t.position.x > WORLD_SIZE/2 || 
                    t.position.z < -WORLD_SIZE/2 || t.position.z > WORLD_SIZE/2) {
                    t.userData.direction += Math.PI; // Turn around
                }
                
                // Random turns
                if (Math.random() < 0.01) {
                    t.userData.direction += (Math.random() > 0.5 ? 1 : -1) * (Math.PI / 2);
                }
            }
        }

        // --- Inputs ---
        function setupInputs() {
            // Buttons
            var setKey = function(id, key) {
                var el = document.getElementById(id);
                el.addEventListener('touchstart', function(e) { e.preventDefault(); keys[key] = true; }, {passive: false});
                el.addEventListener('touchend', function(e) { e.preventDefault(); keys[key] = false; }, {passive: false});
                el.addEventListener('mousedown', function(e) { keys[key] = true; });
                el.addEventListener('mouseup', function(e) { keys[key] = false; });
                el.addEventListener('mouseleave', function(e) { keys[key] = false; });
            };

            setKey('btn-up', 'up');
            setKey('btn-down', 'down');
            setKey('btn-left', 'left');
            setKey('btn-right', 'right');

            // Camera Swipe
            var camZone = document.getElementById('camera-zone');
            var startX = 0;
            var startY = 0;

            camZone.addEventListener('touchstart', function(e) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });

            camZone.addEventListener('touchmove', function(e) {
                var currentX = e.touches[0].clientX;
                var currentY = e.touches[0].clientY;
                
                var deltaX = currentX - startX;
                var deltaY = currentY - startY;

                camAngleH -= deltaX * 0.005;
                camAngleV += deltaY * 0.005;
                camAngleV = Math.max(0.1, Math.min(1.5, camAngleV)); // Clamp vertical

                startX = currentX;
                startY = currentY;
            });
        }

        // --- Game Loop ---
        function updatePhysics() {
            if (keys.up) speed += acceleration;
            else if (keys.down) speed -= acceleration;
            else speed *= friction;

            speed = Math.max(-1.0, Math.min(maxSpeed, speed));

            if (keys.left) angle += turnSpeed * (speed / maxSpeed);
            if (keys.right) angle -= turnSpeed * (speed / maxSpeed);

            // Movement
            car.position.x += Math.sin(angle) * speed;
            car.position.z += Math.cos(angle) * speed;
            car.rotation.y = angle;

            // Boundary check (Circle)
            var dist = Math.sqrt(car.position.x*car.position.x + car.position.z*car.position.z);
            if (dist > WORLD_SIZE/2 - 10) {
                car.position.x *= 0.99;
                car.position.z *= 0.99;
                speed *= 0.5;
            }

            document.getElementById('speedometer').innerText = Math.floor(Math.abs(speed) * 100) + " KM/H";
        }

        function updateCamera() {
            // Calculate ideal camera position based on car and user angle
            var offset = new THREE.Vector3(0, 5, -10);
            
            // Rotate offset by camera user angle
            offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), camAngleH);
            // Apply vertical tilt (simple approximation)
            offset.y = 5 + Math.sin(camAngleV) * 10;
            offset.z = -10 * Math.cos(camAngleH); // Simplified distance logic

            var targetPos = car.position.clone().add(offset);
            targetPos.y += 5; // Lift up

            camera.position.lerp(targetPos, 0.1);
            camera.lookAt(car.position);
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            updateCamera();
            updateTraffic();
            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
