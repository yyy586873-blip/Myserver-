<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Chess</title>
    <style>
        :root {
            --bg-color: #2c3e50;
            --board-light: #eeeed2;
            --board-dark: #769656;
            --highlight: rgba(255, 255, 0, 0.5);
            --text-color: #ecf0f1;
            --accent: #3498db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 { margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        /* Menu Styles */
        #menu-container {
            background: rgba(0,0,0,0.2);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 5px;
            margin: 5px;
            transition: transform 0.1s;
        }
        
        button:active { transform: scale(0.95); }
        button.secondary { background-color: #95a5a6; }

        /* Game Board Styles */
        #game-container {
            display: none; /* Hidden initially */
            flex-direction: column;
            align-items: center;
        }

        #status-bar {
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 5px solid #4a3021;
            user-select: none;
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            cursor: pointer;
            position: relative;
        }

        .light { background-color: var(--board-light); color: black; }
        .dark { background-color: var(--board-dark); color: black; }
        
        .selected { background-color: #baca44 !important; }
        
        .possible-move::after {
            content: '';
            width: 15px;
            height: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 50%;
            position: absolute;
        }

        .piece {
            cursor: grab;
            z-index: 2;
        }
        .piece.white { color: #fff; text-shadow: 0 0 2px #000; }
        .piece.black { color: #000; }

        /* Promotion Modal */
        #promotion-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .promo-options {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
        }
        .promo-piece {
            font-size: 40px;
            cursor: pointer;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .promo-piece:hover { background: #eee; }

        @media (max-width: 600px) {
            #board {
                grid-template-columns: repeat(8, 11vw);
                grid-template-rows: repeat(8, 11vw);
            }
            .square { width: 11vw; height: 11vw; font-size: 8vw; }
        }
    </style>
</head>
<body>

    <!-- Main Menu -->
    <div id="menu-container">
        <h1>Instant Chess</h1>
        <p>Click below to join the public lobby.</p>
        <button onclick="joinGame()">Join Game</button>
    </div>

    <!-- Game Area -->
    <div id="game-container">
        <div id="status-bar">
            <span id="status-text">Connecting...</span>
        </div>
        <div id="board"></div>
        <div style="margin-top: 15px;">
            <button class="secondary" onclick="requestReset()">Rematch</button>
            <button class="secondary" onclick="leaveGame()">Leave</button>
        </div>
    </div>

    <!-- Promotion Modal -->
    <div id="promotion-modal">
        <div class="promo-options" id="promo-options">
            <!-- Injected via JS -->
        </div>
    </div>

<script>
    // --- GAME CONSTANTS ---
    const PIECES = {
        w: { k: '♔', q: '♕', r: '♖', b: '♗', n: '♘', p: '♙' },
        b: { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' }
    };

    let board = [];
    let selectedSquare = null;
    let turn = 'white'; 
    let myRole = null; // 'white' or 'black'
    let myId = null;
    let pollingInterval = null;
    let isWaitingForOpponent = false;

    // --- DOM ELEMENTS ---
    const menuContainer = document.getElementById('menu-container');
    const gameContainer = document.getElementById('game-container');
    const statusText = document.getElementById('status-text');
    const boardEl = document.getElementById('board');
    const promoModal = document.getElementById('promotion-modal');
    const promoOptions = document.getElementById('promo-options');

    // --- POLLING LOGIC ---

    window.joinGame = function() {
        fetch('/api/join', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                myId = data.playerId;
                myRole = data.role;
                
                menuContainer.style.display = 'none';
                gameContainer.style.display = 'flex';
                
                initBoard();
                renderBoard();

                if (data.started) {
                    updateStatus("Game Started!");
                    startPolling();
                    checkTurn();
                } else {
                    updateStatus("Waiting for opponent...");
                    startPolling();
                }
            }
        });
    };

    window.leaveGame = function() {
        stopPolling();
        location.reload();
    };

    window.requestReset = function() {
        fetch('/api/reset', { method: 'POST' })
            .then(() => {
                // Force refresh to reset state cleanly
                location.reload();
            });
    };

    function startPolling() {
        if (pollingInterval) clearInterval(pollingInterval);
        
        pollingInterval = setInterval(() => {
            fetch(`/api/state?id=${myId}`)
                .then(res => res.json())
                .then(data => {
                    updateGameState(data);
                });
        }, 1000); // Poll every 1 second
    }

    function stopPolling() {
        if (pollingInterval) clearInterval(pollingInterval);
    }

    function updateGameState(data) {
        // Update local board only if different to avoid flicker
        if (JSON.stringify(board) !== JSON.stringify(data.board)) {
            board = data.board;
            turn = data.turn;
            renderBoard();
            
            // Check if game just started
            if (!data.started && data.white && data.black) {
                updateStatus("Game Started!");
            }
        }
        
        // Update status text based on state
        if (!data.started) {
            if (data.white && !data.black) {
                updateStatus("Waiting for Black Player...");
            } else if (!data.white && !data.black) {
                updateStatus("Lobby Empty...");
            }
        } else {
            checkTurn();
        }
    }

    function checkTurn() {
        if (turn === 'white') {
            if (myRole === 'white') updateStatus("Your Turn (White)");
            else updateStatus("Opponent's Turn (Black)");
        } else {
            if (myRole === 'black') updateStatus("Your Turn (Black)");
            else updateStatus("Opponent's Turn (White)");
        }
    }

    function updateStatus(msg) {
        statusText.innerText = msg;
    }

    // --- CHESS LOGIC ---

    function initBoard() {
        board = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];
        turn = 'white';
        selectedSquare = null;
    }

    function renderBoard() {
        boardEl.innerHTML = '';
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                square.dataset.row = r;
                square.dataset.col = c;
                square.onclick = () => handleSquareClick(r, c);

                const pieceCode = board[r][c];
                if (pieceCode) {
                    const color = pieceCode === pieceCode.toUpperCase() ? 'white' : 'black';
                    const symbol = PIECES[color === 'white' ? 'w' : 'b'][pieceCode.toLowerCase()];
                    
                    const span = document.createElement('span');
                    span.className = `piece ${color}`;
                    span.textContent = symbol;
                    square.appendChild(span);
                }

                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    square.classList.add('selected');
                }

                if (selectedSquare && isValidMove(selectedSquare.r, selectedSquare.c, r, c, true)) {
                    square.classList.add('possible-move');
                }

                boardEl.appendChild(square);
            }
        }
    }

    function handleSquareClick(r, c) {
        // Block interaction if waiting for opponent or wrong turn
        if (isWaitingForOpponent) return;
        
        // Check if it's my turn
        const isMyTurn = (turn === 'white' && myRole === 'white') || (turn === 'black' && myRole === 'black');
        if (!isMyTurn) return;

        const clickedPiece = board[r][c];
        const isMyPiece = clickedPiece && ((myRole === 'white' && clickedPiece === clickedPiece.toUpperCase()) || (myRole === 'black' && clickedPiece === clickedPiece.toLowerCase()));

        if (isMyPiece) {
            selectedSquare = { r, c };
            renderBoard();
            return;
        }

        if (selectedSquare) {
            if (isValidMove(selectedSquare.r, selectedSquare.c, r, c)) {
                // Check for promotion
                const piece = board[selectedSquare.r][selectedSquare.c];
                const isPromotion = (piece === 'P' && r === 0) || (piece === 'p' && r === 7);

                if (isPromotion) {
                    showPromotionModal(selectedSquare.r, selectedSquare.c, r, c);
                } else {
                    executeMove(selectedSquare.r, selectedSquare.c, r, c);
                }
            } else {
                selectedSquare = null;
                renderBoard();
            }
        }
    }

    function executeMove(fromR, fromC, toR, toC) {
        const piece = board[fromR][fromC];
        
        // Optimistic UI update
        board[toR][toC] = piece;
        board[fromR][fromC] = '';
        renderBoard();
        
        // Send to server
        fetch('/api/move', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                from: {r: fromR, c: fromC},
                to: {r: toR, c: toC},
                playerId: myId
            })
        }).catch(err => console.error("Move failed", err));
    }

    // --- MOVE VALIDATION ENGINE ---
    function isValidMove(r1, c1, r2, c2, checkCheck = false) {
        const piece = board[r1][c1].toLowerCase();
        const dx = c2 - c1;
        const dy = r2 - r1;
        const target = board[r2][c2];
        
        // Cannot capture own piece
        if (target) {
            const isTargetWhite = target === target.toUpperCase();
            const isMoverWhite = board[r1][c1] === board[r1][c1].toUpperCase();
            if (isTargetWhite === isMoverWhite) return false;
        }

        switch(piece) {
            case 'p': 
                const direction = (board[r1][c1] === 'P') ? -1 : 1;
                const startRow = (board[r1][c1] === 'P') ? 6 : 1;
                if (dx === 0 && dy === direction && !target) return true;
                if (dx === 0 && dy === 2 * direction && r1 === startRow && !target && !board[r1+direction][c1]) return true;
                if (Math.abs(dx) === 1 && dy === direction && target) return true;
                return false;
            case 'r': 
                if (dx !== 0 && dy !== 0) return false;
                return isPathClear(r1, c1, r2, c2);
            case 'b': 
                if (Math.abs(dx) !== Math.abs(dy)) return false;
                return isPathClear(r1, c1, r2, c2);
            case 'q': 
                if ((dx !== 0 && dy !== 0) && (Math.abs(dx) !== Math.abs(dy))) return false;
                return isPathClear(r1, c1, r2, c2);
            case 'n': 
                return (Math.abs(dx) * Math.abs(dy)) === 2;
            case 'k': 
                return Math.abs(dx) <= 1 && Math.abs(dy) <= 1;
            default: return false;
        }
    }

    function isPathClear(r1, c1, r2, c2) {
        const dr = Math.sign(r2 - r1);
        const dc = Math.sign(c2 - c1);
        let r = r1 + dr;
        let c = c1 + dc;
        while (r !== r2 || c !== c2) {
            if (board[r][c] !== '') return false;
            r += dr;
            c += dc;
        }
        return true;
    }

    function findKing(color) {
        const target = color === 'white' ? 'K' : 'k';
        for(let r=0; r<8; r++) {
            for(let c=0; c<8; c++) {
                if(board[r][c] === target) return {r, c};
            }
        }
        return null;
    }

    function isKingInCheck(kingColor) {
        const kingPos = findKing(kingColor);
        if (!kingPos) return true;

        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const piece = board[r][c];
                if (!piece) continue;
                const isEnemy = (kingColor === 'white') ? (piece === piece.toLowerCase()) : (piece === piece.toUpperCase());
                if (isEnemy) {
                    if (isValidMove(r, c, kingPos.r, kingPos.c, false)) return true;
                }
            }
        }
        return false;
    }

    // --- PROMOTION UI ---
    function showPromotionModal(r1, c1, r2, c2) {
        const isWhite = board[r1][c1] === 'P';
        const pieces = isWhite ? ['♕','♖','♗','♘'] : ['♛','♜','♝','♞'];
        
        promoOptions.innerHTML = '';
        pieces.forEach(p => {
            const div = document.createElement('div');
            div.className = 'promo-piece';
            div.textContent = p;
            div.onclick = () => {
                promoModal.style.display = 'none';
                // Apply promotion
                const map = {'♕':'Q','♛':'q','♖':'R','♜':'r','♗':'B','♝':'b','♘':'N','♞':'n'};
                board[r2][c2] = map[p];
                board[r1][c1] = '';
                
                // Send move with promotion info if needed, but server auto-promotes
                fetch('/api/move', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        from: {r:r1, c:c1},
                        to: {r:r2, c:c2},
                        playerId: myId
                    })
                });
                
                renderBoard();
            };
            promoOptions.appendChild(div);
        });
        promoModal.style.display = 'flex';

    }

</script>
</body>
</html>
