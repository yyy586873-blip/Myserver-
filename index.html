
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Cards</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff; /* Pure White Background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .card {
            width: 180px;
            height: 100px;
            background-color: #1a1a1a; /* Dark Card */
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            color: white;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #333;
        }

        /* The active card style */
        .card.active {
            border-color: #00d2ff;
            box-shadow: 0 0 15px #00d2ff;
            transform: scale(1.05);
        }

        /* The moving dot */
        .dot {
            width: 12px;
            height: 12px;
            background-color: #00d2ff;
            border-radius: 50%;
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card.active .dot {
            opacity: 1;
        }

        /* Animation class */
        .fly {
            animation: flyToNext 0.6s ease-in-out forwards;
        }

        @keyframes flyToNext {
            0% {
                left: 50%;
                transform: translateX(-50%);
            }
            50% {
                left: 50%;
                transform: translateX(-50%) scale(1.5);
            }
            100% {
                left: 50%;
                transform: translateX(-50%);
            }
        }
    </style>
</head>
<body>

    <div id="game-container" style="display: flex; gap: 40px;">
        <div class="card" id="card-0">Mohit</div>
        <div class="card" id="card-1">Rohit</div>
        <div class="card" id="card-2">Rahul</div>
        <div class="card" id="card-3">Rohan</div>
    </div>

    <script>
        const cards = document.querySelectorAll('.card');
        let currentIndex = 0;

        function highlightNext() {
            // Remove active class from current card
            cards[currentIndex].classList.remove('active');

            // Move to next card index
            currentIndex = (currentIndex + 1) % cards.length;

            // Add active class to new card
            cards[currentIndex].classList.add('active');

            // Create a flying dot effect
            createFlyingEffect(cards[currentIndex]);

            // Loop
            setTimeout(highlightNext, 1000);
        }

        function createFlyingEffect(targetCard) {
            const dot = document.createElement('div');
            dot.className = 'dot fly';
            
            // Start position (center of the previous card)
            const prevCard = cards[(currentIndex - 1 + cards.length) % cards.length];
            
            // We clone the visual style briefly to show movement
            // But for simplicity in this specific request, 
            // the 'fly' animation moves it to the center of the target.
            
            // Actually, to make it look like it flies TO the card:
            // We create a temporary element at the previous card's position
            const startRect = prevCard.getBoundingClientRect();
            const endRect = targetCard.getBoundingClientRect();

            const flyer = document.createElement('div');
            flyer.style.position = 'fixed';
            flyer.style.width = '12px';
            flyer.style.height = '12px';
            flyer.style.background = '#00d2ff';
            flyer.style.borderRadius = '50%';
            flyer.style.zIndex = '1000';
            flyer.style.transition = 'all 0.6s ease-in-out';
            
            // Start at previous card center
            flyer.style.left = (startRect.left + startRect.width / 2 - 6) + 'px';
            flyer.style.top = (startRect.top + startRect.height / 2 - 6) + 'px';

            document.body.appendChild(flyer);

            // Trigger reflow
            flyer.offsetHeight;

            // Move to new card center
            flyer.style.left = (endRect.left + endRect.width / 2 - 6) + 'px';
            flyer.style.top = (endRect.top + endRect.height / 2 - 6) + 'px';

            // Remove after animation
            setTimeout(() => {
                flyer.remove();
            }, 600);
        }

        // Start the loop
        setTimeout(highlightNext, 500);
    </script>

</body>
</html>
