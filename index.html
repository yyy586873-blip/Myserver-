<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>World Chat</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#0d1117;color:#eef2f7}
body{overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #202833;background:#111821}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:12px;background:#202b39;display:flex;align-items:center;justify-content:center;font-size:20px}
.title{font-size:18px;font-weight:700}
.sub{font-size:11px;color:#8995a5;margin-top:2px}
.state{font-size:11px;color:#80d991;background:#16241b;padding:7px 10px;border-radius:20px}
.chat{flex:1;overflow:auto;padding:14px 12px 10px}
.row{margin:8px 0;display:flex}
.row.me{justify-content:flex-end}
.bubble{max-width:82%;background:#17202b;border:1px solid #222f3d;border-radius:15px;padding:9px 11px}
.me .bubble{background:#1b3043}
.name{font-size:11px;color:#73b6ff;margin-bottom:4px}
.text{white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.35}
.meta{font-size:9px;color:#778394;margin-top:5px;text-align:right}
.file{display:flex;gap:10px;align-items:center;padding:9px;background:#111923;border-radius:11px}
.fileIcon{font-size:23px}
.fileName{font-size:13px;word-break:break-all}
.fileSize{font-size:10px;color:#7d8a9a;margin-top:3px}
.fileLink{color:#8fc7ff;text-decoration:none}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#667385;text-align:center;padding:30px}
.bottom{padding:9px;border-top:1px solid #202833;background:#111821}
.composer{display:flex;gap:8px;align-items:flex-end}
.attach{width:44px;height:44px;border:0;border-radius:13px;background:#1c2733;color:#eef2f7;font-size:21px}
.inputWrap{flex:1;background:#18212b;border-radius:13px;border:1px solid #253241;padding:4px 8px}
textarea{width:100%;border:0;outline:0;background:transparent;color:#eef2f7;resize:none;height:34px;max-height:100px;font-family:inherit;font-size:15px;padding:6px}
.send{width:44px;height:44px;border:0;border-radius:13px;background:#4b8dca;color:white;font-size:18px}
.system{margin:9px auto;text-align:center;font-size:10px;color:#6e7b8b}
.progress{height:4px;background:#263342;border-radius:8px;margin-top:8px;overflow:hidden}
.progress>div{height:100%;width:0;background:#76afe1;transition:width .15s}
input[type=file]{display:none}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#263342;border-radius:8px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <div class="logo">🌐</div>
      <div>
        <div class="title">World Chat</div>
        <div class="sub" id="userLine">Connecting...</div>
      </div>
    </div>
    <div class="state" id="state">OFFLINE</div>
  </div>

  <div class="chat" id="chat">
    <div class="empty" id="empty">
      <div>
        <div style="font-size:30px;margin-bottom:10px">🌍</div>
        <div>World Chat</div>
        <div style="font-size:12px;margin-top:5px">Messages are stored locally for 24 hours.</div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="composer">
      <button class="attach" id="attachBtn">＋</button>
      <div class="inputWrap">
        <textarea id="messageInput" placeholder="Message everyone..." rows="1"></textarea>
      </div>
      <button class="send" id="sendBtn">➤</button>
    </div>
    <input id="fileInput" type="file">
  </div>
</div>

<script>
(function () {
    "use strict";

    var SERVER_BASE = "https://myserver-b0ls.onrender.com";
    var WS_URL = SERVER_BASE.replace(/^https:/, "wss:")
                            .replace(/^http:/, "ws:") + "/ws";
    var STORAGE_KEY = "worldchat_messages_v1";
    var USER_KEY = "worldchat_user_v1";
    var TTL = 24 * 60 * 60 * 1000;

    var chat = document.getElementById("chat");
    var empty = document.getElementById("empty");
    var state = document.getElementById("state");
    var userLine = document.getElementById("userLine");
    var input = document.getElementById("messageInput");
    var sendBtn = document.getElementById("sendBtn");
    var attachBtn = document.getElementById("attachBtn");
    var fileInput = document.getElementById("fileInput");

    var user = null;
    var socket = null;
    var reconnectDelay = 1000;
    var reconnectTimer = null;

    function esc(value) {
        return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function makeId() {
        return String(Date.now()) + "_" +
            Math.random().toString(36).substring(2) +
            "_" + Math.random().toString(36).substring(2);
    }

    function loadUser() {
        try {
            var raw = localStorage.getItem(USER_KEY);

            if (raw) {
                user = JSON.parse(raw);
            }
        } catch (e) {
            user = null;
        }

        if (!user || !user.id || !user.name) {
            var defaultName = "User" +
                Math.floor(1000 + Math.random() * 9000);

            var entered = window.prompt(
                "World Chat name:",
                defaultName
            );

            if (entered == null || !String(entered).trim()) {
                entered = defaultName;
            }

            user = {
                id: makeId(),
                name: String(entered).trim().substring(0, 40)
            };

            try {
                localStorage.setItem(USER_KEY, JSON.stringify(user));
            } catch (e2) {
            }
        }

        userLine.textContent = user.name;
    }

    function cleanHistory() {
        var list = [];

        try {
            list = JSON.parse(
                localStorage.getItem(STORAGE_KEY) || "[]"
            );
        } catch (e) {
            list = [];
        }

        var now = Date.now();
        var kept = [];

        for (var i = 0; i < list.length; i++) {
            if (now - Number(list[i].timestamp || 0) <= TTL) {
                kept.push(list[i]);
            }
        }

        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(kept));
        } catch (e2) {
        }

        return kept;
    }

    function saveMessage(message) {
        var list = cleanHistory();
        list.push(message);

        try {
            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(list.slice(-300))
            );
        } catch (e) {
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (e2) {
            }
        }
    }

    function formatTime(timestamp) {
        try {
            return new Date(timestamp).toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });
        } catch (e) {
            return "";
        }
    }

    function formatSize(bytes) {
        bytes = Number(bytes || 0);

        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB";

        return (bytes / (1024 * 1024 * 1024)).toFixed(1) + " GB";
    }

    function renderMessage(message) {
        if (empty) {
            empty.style.display = "none";
        }

        var row = document.createElement("div");
        row.className = "row" +
            (message.senderId === user.id ? " me" : "");

        var bubble = document.createElement("div");
        bubble.className = "bubble";

        var content = "";

        if (message.senderId !== user.id) {
            content += '<div class="name">' +
                esc(message.senderName || "User") +
                '</div>';
        }

        if (message.messageType === "text") {
            content += '<div class="text">' +
                esc(message.text || "") +
                '</div>';
        } else {
            var fileUrl = SERVER_BASE +
                "/file/" + encodeURIComponent(message.fileId || "");

            var icon = "📎";

            if ((message.mime || "").indexOf("image/") === 0) {
                icon = "🖼️";
            } else if ((message.mime || "").indexOf("video/") === 0) {
                icon = "🎬";
            }

            content +=
                '<a class="fileLink" href="' + esc(fileUrl) + '" target="_blank">' +
                '<div class="file">' +
                '<div class="fileIcon">' + icon + '</div>' +
                '<div>' +
                '<div class="fileName">' + esc(message.fileName || "File") + '</div>' +
                '<div class="fileSize">' + formatSize(message.size) + '</div>' +
                '</div>' +
                '</div></a>';
        }

        content += '<div class="meta">' +
            formatTime(message.timestamp) +
            '</div>';

        bubble.innerHTML = content;
        row.appendChild(bubble);
        chat.appendChild(row);

        chat.scrollTop = chat.scrollHeight;
    }

    function renderHistory() {
        var list = cleanHistory();
        chat.innerHTML = "";

        if (!list.length) {
            chat.appendChild(empty);
            empty.style.display = "flex";
            return;
        }

        empty.style.display = "none";

        for (var i = 0; i < list.length; i++) {
            renderMessage(list[i]);
        }
    }

    function systemMessage(text) {
        var row = document.createElement("div");
        row.className = "system";
        row.textContent = text;
        chat.appendChild(row);
        chat.scrollTop = chat.scrollHeight;
    }

    function setState(text, online) {
        state.textContent = text;

        if (online) {
            state.style.color = "#80d991";
            state.style.background = "#16241b";
        } else {
            state.style.color = "#e5b7b7";
            state.style.background = "#2a1b1d";
        }
    }

    function connect() {
        clearTimeout(reconnectTimer);

        setState("CONNECTING", false);

        try {
            socket = new WebSocket(WS_URL);
        } catch (e) {
            scheduleReconnect();
            return;
        }

        socket.onopen = function () {
            reconnectDelay = 1000;
            setState("ONLINE", true);

            socket.send(JSON.stringify({
                type: "hello",
                userId: user.id,
                name: user.name
            }));
        };

        socket.onmessage = function (event) {
            var data;

            try {
                data = JSON.parse(event.data);
            } catch (e) {
                return;
            }

            if (data.type === "ready") {
                setState("ONLINE", true);
                return;
            }

            if (data.type === "presence") {
                return;
            }

            if (data.type === "message") {
                saveMessage(data);
                renderMessage(data);
            }
        };

        socket.onerror = function () {
            setState("ERROR", false);
        };

        socket.onclose = function () {
            setState("OFFLINE", false);
            scheduleReconnect();
        };
    }

    function scheduleReconnect() {
        clearTimeout(reconnectTimer);

        reconnectTimer = setTimeout(function () {
            connect();
        }, reconnectDelay);

        reconnectDelay = Math.min(reconnectDelay * 2, 30000);
    }

    function sendText() {
        var text = String(input.value || "").trim();

        if (!text) {
            return;
        }

        if (!socket || socket.readyState !== 1) {
            systemMessage("Server se connection nahi hai.");
            return;
        }

        socket.send(JSON.stringify({
            type: "message",
            messageId: makeId(),
            senderId: user.id,
            senderName: user.name,
            messageType: "text",
            text: text,
            timestamp: Date.now()
        }));

        input.value = "";
        input.style.height = "34px";
    }

    function uploadFile(file) {
        if (!file) {
            return;
        }

        if (file.size > 100 * 1024 * 1024) {
            systemMessage("Maximum file size 100 MB hai.");
            return;
        }

        var progressRow = document.createElement("div");
        progressRow.className = "system";
        progressRow.textContent = "Uploading " + file.name;

        var progress = document.createElement("div");
        progress.className = "progress";

        var bar = document.createElement("div");
        progress.appendChild(bar);
        progressRow.appendChild(progress);
        chat.appendChild(progressRow);
        chat.scrollTop = chat.scrollHeight;

        var xhr = new XMLHttpRequest();

        xhr.open(
            "POST",
            SERVER_BASE +
            "/upload?name=" + encodeURIComponent(file.name) +
            "&mime=" + encodeURIComponent(file.type || "application/octet-stream"),
            true
        );

        xhr.setRequestHeader(
            "Content-Type",
            file.type || "application/octet-stream"
        );

        xhr.upload.onprogress = function (event) {
            if (event.lengthComputable) {
                bar.style.width =
                    Math.round((event.loaded / event.total) * 100) + "%";
            }
        };

        xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) {
                return;
            }

            if (xhr.status >= 200 && xhr.status < 300) {
                var result;

                try {
                    result = JSON.parse(xhr.responseText);
                } catch (e) {
                    result = null;
                }

                if (!result || !result.fileId) {
                    systemMessage("Upload response invalid.");
                    return;
                }

                if (!socket || socket.readyState !== 1) {
                    systemMessage("File upload ho gaya, lekin chat connection offline hai.");
                    return;
                }

                socket.send(JSON.stringify({
                    type: "message",
                    messageId: makeId(),
                    senderId: user.id,
                    senderName: user.name,
                    messageType: "file",
                    fileId: result.fileId,
                    fileName: result.fileName,
                    mime: result.mime,
                    size: result.size,
                    text: "",
                    timestamp: Date.now()
                }));
            } else {
                systemMessage("File upload failed.");
            }
        };

        xhr.onerror = function () {
            systemMessage("Network error while uploading.");
        };

        try {
            xhr.send(file);
        } catch (e) {
            systemMessage("Upload start nahi ho saka.");
        }
    }

    sendBtn.onclick = sendText;

    input.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendText();
        }
    });

    input.addEventListener("input", function () {
        input.style.height = "34px";
        input.style.height =
            Math.min(input.scrollHeight, 100) + "px";
    });

    attachBtn.onclick = function () {
        fileInput.click();
    };

    fileInput.onchange = function () {
        if (fileInput.files && fileInput.files.length) {
            uploadFile(fileInput.files[0]);
        }

        fileInput.value = "";
    };

    loadUser();
    renderHistory();
    connect();
})();
</script>
</body>
</html>
