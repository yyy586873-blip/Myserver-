<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robo-Car Infinite Racer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Arial', sans-serif;
            touch-action: none;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            height: 180px;
            pointer-events: auto;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* Joystick */
        #joystick-area {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        #joystick-knob {
            width: 50px;
            height: 50px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Pedals */
        #pedals {
            display: flex;
            gap: 20px;
            align-items: flex-end;
            margin-bottom: 10px;
        }

        .pedal {
            width: 70px;
            height: 90px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: white;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #brake { background: #ff4444; border: 2px solid #cc0000; }
        #gas { background: #44ff44; border: 2px solid #00cc00; }

        /* Transform Button */
        #transform-btn {
            position: absolute;
            bottom: 220px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff00ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 0 10px #ff00ff;
            pointer-events: auto;
            display: none; /* Shown only if needed or always visible for style */
        }

        /* Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }

        #start-screen h1 {
            color: #00ffcc;
            font-size: 40px;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
        }

        #start-btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div id="score-board">Score: 0</div>
        
        <div id="controls">
            <div id="joystick-area">
                <div id="joystick-knob"></div>
            </div>
            <div id="pedals">
                <div class="pedal" id="brake">BRAKE</div>
                <div class="pedal" id="gas">GAS</div>
            </div>
        </div>
        
        <button id="transform-btn">TRANSFORM (T)</button>
    </div>

    <div id="start-screen">
        <h1>Robo-Car<br>Infinite Racer</h1>
        <p style="color:#ccc; text-align:center; max-width: 300px;">
            Steering: Joystick<br>
            Move: Gas/Brake<br>
            Transform: T Button<br>
            Shoot: Tap Transform Button Fast
        </p>
        <button id="start-btn">START</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Variables ---
        var scene, camera, renderer;
        var carGroup, carBody, carChassis;
        var robotGroup, robotBody, robotHead, robotArm;
        var isRobot = false;
        var groundTexture;
        var trafficCars = [];
        var bullets = [];
        var score = 0;
        var gameActive = false;
        var clock = new THREE.Clock();

        // Physics
        var speed = 0;
        var maxSpeed = 1.0;
        var acceleration = 0.03;
        var friction = 0.98;
        var turnSpeed = 0.04;
        
        // Input
        var joystickData = { x: 0, y: 0, active: false };
        var gasPressed = false;
        var brakePressed = false;
        var transformPressed = false;
        var lastTapTime = 0;

        // DOM
        var joystickArea = document.getElementById('joystick-area');
        var joystickKnob = document.getElementById('joystick-knob');
        var gasBtn = document.getElementById('gas');
        var brakeBtn = document.getElementById('brake');
        var transformBtn = document.getElementById('transform-btn');
        var startScreen = document.getElementById('start-screen');
        var startBtn = document.getElementById('start-btn');
        var scoreEl = document.getElementById('score-board');

        init();

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);
            scene.fog = new THREE.Fog(0x111122, 20, 100);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, -15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Lights
            var ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 50, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Infinite Ground Logic
            createInfiniteGround();

            // Create Car
            createCarParts();

            // Event Listeners
            window.addEventListener('resize', onResize);
            setupControls();
            startBtn.addEventListener('click', startGame);
            
            animate();
        }

        function createInfiniteGround() {
            // Create a grid texture that scrolls
            var canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            var context = canvas.getContext('2d');
            context.fillStyle = '#222';
            context.fillRect(0, 0, 512, 512);
            context.strokeStyle = '#00ffcc';
            context.lineWidth = 4;
            context.beginPath();
            context.moveTo(0, 0);
            context.lineTo(512, 0);
            context.moveTo(0, 0);
            context.lineTo(0, 512);
            context.stroke();
            
            var texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(10, 10);
            
            groundTexture = texture;

            var geo = new THREE.PlaneGeometry(500, 500);
            var mat = new THREE.MeshStandardMaterial({ 
                map: texture,
                roughness: 0.8 
            });
            var ground = new THREE.Mesh(geo, mat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        function createCarParts() {
            carGroup = new THREE.Group();
            
            // Car Body
            var bodyGeo = new THREE.BoxGeometry(2, 1, 4);
            var bodyMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
            carBody = new THREE.Mesh(bodyGeo, bodyMat);
            carBody.position.y = 1;
            carBody.castShadow = true;
            carGroup.add(carBody);

            // Cabin
            var cabinGeo = new THREE.BoxGeometry(1.8, 0.8, 2);
            var cabinMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            var cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.y = 1.8;
            cabin.position.z = -0.2;
            carGroup.add(cabin);

            // Wheels
            var wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16);
            var wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            var wheelPositions = [
                { x: -1, z: 1.2 }, { x: 1, z: 1.2 },
                { x: -1, z: -1.2 }, { x: 1, z: -1.2 }
            ];
            
            carGroup.userData.wheels = []; // Store for animation

            for (var i = 0; i < wheelPositions.length; i++) {
                var wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(wheelPositions[i].x, 0.4, wheelPositions[i].z);
                wheel.castShadow = true;
                carGroup.add(wheel);
                carGroup.userData.wheels.push(wheel);
            }

            // Robot Parts (Hidden initially)
            robotGroup = new THREE.Group();
            robotGroup.visible = false;

            // Robot Body
            var rBodyGeo = new THREE.BoxGeometry(2, 1.5, 1);
            var rBodyMat = new THREE.MeshStandardMaterial({ color: 0x0000aa });
            robotBody = new THREE.Mesh(rBodyGeo, rBodyMat);
            robotBody.position.y = 1.5;
            robotGroup.add(robotBody);

            // Robot Head
            var rHeadGeo = new THREE.BoxGeometry(1, 1, 1);
            var rHeadMat = new THREE.MeshStandardMaterial({ color: 0xffff00 });
            robotHead = new THREE.Mesh(rHeadGeo, rHeadMat);
            robotHead.position.y = 3;
            robotHead.position.z = -0.5;
            robotGroup.add(robotHead);

            // Robot Arm (Gun)
            var rArmGeo = new THREE.BoxGeometry(0.5, 0.5, 2);
            var rArmMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
            robotArm = new THREE.Mesh(rArmGeo, rArmMat);
            robotArm.position.set(0, 2, 1); // Holding gun forward
            robotGroup.add(robotArm);

            scene.add(carGroup);
            scene.add(robotGroup);
            
            // Initialize Car
            carGroup.position.set(0, 0, 0);
        }

        function setupControls() {
            // Joystick
            var handleJoystick = function(e) {
                if (!joystickData.active) return;
                var rect = joystickArea.getBoundingClientRect();
                var centerX = rect.left + rect.width / 2;
                var centerY = rect.top + rect.height / 2;
                
                var clientX = e.touches[0].clientX;
                var clientY = e.touches[0].clientY;
                
                var dx = clientX - centerX;
                var dy = clientY - centerY;
                var distance = Math.sqrt(dx*dx + dy*dy);
                var maxDist = rect.width / 2 - 25;
                
                if (distance > maxDist) {
                    var angle = Math.atan2(dy, dx);
                    dx = Math.cos(angle) * maxDist;
                    dy = Math.sin(angle) * maxDist;
                }

                joystickKnob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
                joystickData.x = dx / maxDist;
                joystickData.y = dy / maxDist;
            };

            var endJoystick = function() {
                joystickData.active = false;
                joystickData.x = 0;
                joystickData.y = 0;
                joystickKnob.style.transform = 'translate(-50%, -50%)';
            };

            joystickArea.addEventListener('touchstart', function(e) {
                e.preventDefault();
                joystickData.active = true;
                handleJoystick(e);
            }, {passive: false});

            joystickArea.addEventListener('touchmove', function(e) {
                e.preventDefault();
                handleJoystick(e);
            }, {passive: false});

            joystickArea.addEventListener('touchend', endJoystick);

            // Pedals
            var bindPedal = function(btn, type) {
                btn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    if (type === 'gas') gasPressed = true;
                    else brakePressed = true;
                });
                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    if (type === 'gas') gasPressed = false;
                    else brakePressed = false;
                });
            };

            bindPedal(gasBtn, 'gas');
            bindPedal(brakeBtn, 'brake');

            // Transform Button
            transformBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                var now = new Date().getTime();
                if (now - lastTapTime < 300) {
                    // Double tap for shoot
                    shootGun();
                } else {
                    toggleTransform();
                }
                lastTapTime = now;
            });
            
            // Keyboard Support for testing
            document.addEventListener('keydown', function(e) {
                if(e.key === 't') toggleTransform();
                if(e.key === ' ') shootGun();
                if(e.key === 'ArrowLeft') joystickData.x = -1;
                if(e.key === 'ArrowRight') joystickData.x = 1;
            });
            document.addEventListener('keyup', function(e) {
                if(e.key === 'ArrowLeft' || e.key === 'ArrowRight') joystickData.x = 0;
            });
        }

        function toggleTransform() {
            if (!gameActive) return;
            isRobot = !isRobot;
            
            if (isRobot) {
                carGroup.visible = false;
                robotGroup.visible = true;
                robotGroup.rotation.set(0, carGroup.rotation.y, 0);
                robotGroup.position.copy(carGroup.position);
                robotGroup.position.y += 0.5; // Lift up slightly
            } else {
                robotGroup.visible = false;
                carGroup.visible = true;
                carGroup.rotation.set(0, robotGroup.rotation.y, 0);
                carGroup.position.copy(robotGroup.position);
                carGroup.position.y -= 0.5;
            }
        }

        function shootGun() {
            if (!isRobot) return;
            
            var bulletGeo = new THREE.SphereGeometry(0.3);
            var bulletMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            var bullet = new THREE.Mesh(bulletGeo, bulletMat);
            
            // Position gun tip
            var gunWorldPos = new THREE.Vector3();
            robotArm.getWorldPosition(gunWorldPos);
            
            bullet.position.copy(gunWorldPos);
            bullet.position.y += 0.5; // Adjust height
            
            // Direction
            var direction = new THREE.Vector3(0, 0, 1);
            direction.applyAxisAngle(new THREE.Vector3(0, 1, 0), robotGroup.rotation.y);
            
            bullets.push({ mesh: bullet, dir: direction, life: 100 });
            scene.add(bullet);
        }

        function startGame() {
            startScreen.style.display = 'none';
            gameActive = true;
            score = 0;
            speed = 0;
            carGroup.position.set(0, 0, 0);
            carGroup.rotation.set(0, 0, 0);
            toggleTransform(); // Start as robot? No, start as car.
            isRobot = true; 
            toggleTransform(); // Switch to car mode visually but keep logic clean
            
            // Spawn Traffic
            for(var i=0; i<5; i++) spawnTraffic();
        }

        function spawnTraffic() {
            var geo = new THREE.BoxGeometry(2, 2, 4);
            var mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
            var car = new THREE.Mesh(geo, mat);
            
            // Random X, Far Z
            var x = (Math.random() - 0.5) * 40;
            var z = 100 + Math.random() * 100; // Spawn ahead
            
            car.position.set(x, 1, z);
            car.castShadow = true;
            scene.add(car);
            trafficCars.push({ mesh: car, speed: 0.5 + Math.random() * 0.5 });
        }

        function updatePhysics() {
            if (!gameActive) return;

            // Steering
            if (speed > 0.01) {
                var rot = isRobot ? robotGroup.rotation.y : carGroup.rotation.y;
                rot -= joystickData.x * turnSpeed * (speed * 2);
                
                if (isRobot) robotGroup.rotation.y = rot;
                else carGroup.rotation.y = rot;
            }

            // Acceleration
            if (gasPressed) speed += acceleration;
            else if (brakePressed) speed -= acceleration * 2;
            else speed *= friction;

            if (speed > maxSpeed) speed = maxSpeed;
            if (speed < -maxSpeed / 2) speed = -maxSpeed / 2;

            // Move Car/Robot
            var pos = isRobot ? robotGroup.position : carGroup.position;
            pos.x += Math.sin(rot) * speed;
            pos.z += Math.cos(rot) * speed;

            // Animate Wheels
            if (!isRobot) {
                var wheels = carGroup.userData.wheels;
                for(var i=0; i<wheels.length; i++) {
                    wheels[i].rotation.x -= speed * 0.5; // Spin wheels
                }
            }

            // Camera Follow
            var camOffset = new THREE.Vector3(0, 10, -15);
            camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), rot);
            camera.position.lerp(pos.clone().add(camOffset), 0.1);
            camera.lookAt(pos.x, pos.y + 2, pos.z);

            // Infinite Ground Texture
            groundTexture.offset.y -= speed * 0.05;
        }

        function updateTraffic() {
            for (var i = trafficCars.length - 1; i >= 0; i--) {
                var t = trafficCars[i];
                // Move traffic towards player (simulate speed) or move them independently
                // Let's make them move forward too
                t.mesh.position.z -= t.speed; 
                
                // If too far behind, remove and spawn new
                if (t.mesh.position.z < carGroup.position.z - 50) {
                    scene.remove(t.mesh);
                    trafficCars.splice(i, 1);
                    spawnTraffic();
                }
            }
        }

        function updateBullets() {
            for (var i = bullets.length - 1; i >= 0; i--) {
                var b = bullets[i];
                b.mesh.position.addScaledVector(b.dir, 2);
                b.life--;
                
                if (b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                    continue;
                }
                
                // Check collision with traffic
                for (var j = trafficCars.length - 1; j >= 0; j--) {
                    var t = trafficCars[j];
                    if (b.mesh.position.distanceTo(t.mesh.position) < 2) {
                        // Hit
                        scene.remove(t.mesh);
                        trafficCars.splice(j, 1);
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);
                        
                        score += 10;
                        scoreEl.innerText = 'Score: ' + score;
                        
                        spawnTraffic();
                        break;
                    }
                }
            }
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (gameActive) {
                updatePhysics();
                updateTraffic();
                updateBullets();
            }
            
            renderer.render(scene, camera);
        }

    </script>
</body>
</html>
