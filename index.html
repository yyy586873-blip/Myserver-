<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#120a1f" />
  <title>Demo Reward Generator</title>
  <style>
    :root{
      --bg1:#120a1f;
      --bg2:#090611;
      --panel1:rgba(98, 44, 163, 0.34);
      --panel2:rgba(28, 12, 49, 0.82);
      --border:rgba(196, 145, 255, 0.26);
      --border2:rgba(196, 145, 255, 0.42);
      --text:#f4ecff;
      --muted:#c9a8ff;
      --accent:#c77dff;
      --accent2:#8f5cff;
      --success:#cdb6ff;
      --danger:#ff7db8;
      --shadow:0 16px 60px rgba(0,0,0,.45), 0 0 28px rgba(167, 94, 255, .22);
      --radius:22px;
      --radius2:16px;
      --maxw: 470px;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body{
      margin:0;
      min-height:100%;
      font-family: Arial, Helvetica, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(199,125,255,.22), transparent 28%),
        radial-gradient(circle at 85% 20%, rgba(143,92,255,.18), transparent 26%),
        radial-gradient(circle at 50% 100%, rgba(255,125,184,.10), transparent 25%),
        linear-gradient(180deg, var(--bg1), var(--bg2) 70%);
    }

    body{ min-height:100svh; overflow-x:hidden; }

    .scanlines::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(to bottom,
          rgba(255,255,255,0.03) 0%,
          rgba(255,255,255,0.00) 2%,
          rgba(255,255,255,0.025) 4%);
      background-size:100% 8px;
      opacity:.20;
      mix-blend-mode: screen;
    }

    .float-orb{
      position:fixed;
      width:220px;
      height:220px;
      border-radius:50%;
      filter: blur(24px);
      opacity:.22;
      pointer-events:none;
      background: radial-gradient(circle, rgba(199,125,255,.9), rgba(199,125,255,0));
      animation: drift 8s ease-in-out infinite;
    }
    .orb1{ top:-70px; left:-60px; }
    .orb2{
      right:-60px;
      bottom:-80px;
      background: radial-gradient(circle, rgba(143,92,255,.85), rgba(143,92,255,0));
      animation-delay: -3s;
    }

    @keyframes drift{
      0%,100%{ transform: translate(0,0) scale(1); }
      50%{ transform: translate(18px, 22px) scale(1.08); }
    }

    .wrap{
      min-height:100svh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:
        max(18px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .panel{
      width:min(100%, var(--maxw));
      background: linear-gradient(180deg, var(--panel1), var(--panel2));
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      overflow:hidden;
      position:relative;
    }

    .panel::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius: var(--radius);
      pointer-events:none;
      border:1px solid rgba(255,255,255,.05);
      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes pulse{
      0%,100%{ opacity:.35; }
      50%{ opacity:1; }
    }

    .header{
      padding: 22px;
      text-align:center;
      border-bottom:1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, rgba(199,125,255,.10), transparent);
    }

    .title{
      margin:0;
      font-size: clamp(24px, 6vw, 32px);
      letter-spacing: 2px;
      line-height:1.1;
      color:#fff7ff;
      text-shadow:
        0 0 10px rgba(199,125,255,.75),
        0 0 22px rgba(143,92,255,.28);
      animation: titleGlow 2.4s ease-in-out infinite alternate;
    }

    @keyframes titleGlow{
      from{ transform: translateY(0); }
      to{ transform: translateY(-1px); }
    }

    .subtitle{
      margin: 8px 0 0;
      font-size: 13px;
      letter-spacing: 1.2px;
      color: var(--muted);
    }

    .content{ padding: 20px; }

    .box{
      background: rgba(12, 8, 21, .42);
      border:1px solid rgba(199,125,255,.18);
      border-radius: var(--radius2);
      padding: 16px;
      box-shadow: inset 0 0 18px rgba(199,125,255,.08);
      backdrop-filter: blur(10px);
    }

    .label{
      display:block;
      margin:0 0 8px;
      font-size:12px;
      font-weight:700;
      letter-spacing:1.4px;
      color:#e3c8ff;
    }

    .input, select{
      width:100%;
      appearance:none;
      border:none;
      outline:none;
      border-radius: 14px;
      padding: 14px 14px;
      font-size: 16px;
      color: var(--text);
      background: rgba(8, 6, 15, .82);
      border:1px solid rgba(199,125,255,.28);
      box-shadow: inset 0 0 12px rgba(199,125,255,.08);
      margin-bottom: 12px;
      transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    }

    .input:focus, select:focus{
      border-color: var(--border2);
      box-shadow:
        inset 0 0 12px rgba(199,125,255,.10),
        0 0 0 3px rgba(199,125,255,.08);
      transform: translateY(-1px);
    }

    .btn{
      width:100%;
      border:none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight:800;
      letter-spacing:1px;
      color:#fff;
      background: linear-gradient(180deg, #d39dff, #8f5cff);
      box-shadow:
        0 10px 24px rgba(143,92,255,.25),
        0 0 20px rgba(199,125,255,.18);
      cursor:pointer;
      transition: transform .16s ease, filter .16s ease, opacity .16s ease;
      touch-action: manipulation;
    }

    .btn:active{ transform: scale(.985); }
    .btn:hover{ filter: brightness(1.05); }
    .btn[disabled]{ opacity:.6; cursor:not-allowed; }

    .btn-secondary{
      margin-top:10px;
      background: transparent;
      color:#e8d7ff;
      border:1px solid rgba(199,125,255,.35);
      box-shadow: inset 0 0 10px rgba(199,125,255,.05);
    }

    .section{ margin-top: 14px; }

    .grid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap:10px;
      margin-bottom: 12px;
    }

    .pill{
      padding:12px 10px;
      border-radius: 14px;
      background: rgba(255,255,255,.04);
      border:1px solid rgba(199,125,255,.18);
      color:#f6edff;
      font-size:14px;
      text-align:center;
      cursor:pointer;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      user-select:none;
    }

    .pill:hover{ transform: translateY(-1px); }
    .pill.active{
      background: rgba(199,125,255,.18);
      border-color: rgba(199,125,255,.45);
      box-shadow: 0 0 0 3px rgba(199,125,255,.08);
    }

    .range-wrap{
      margin: 10px 0 14px;
    }

    input[type="range"]{
      width:100%;
      accent-color: #c77dff;
    }

    .range-info{
      display:flex;
      justify-content:space-between;
      font-size:12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .progress-wrap{
      display:none;
      margin-top: 14px;
    }

    .progress-label{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      margin-bottom:8px;
      font-size:12px;
      color: var(--muted);
    }

    .bar{
      width:100%;
      height:12px;
      border-radius:999px;
      overflow:hidden;
      background: rgba(199,125,255,.10);
      border:1px solid rgba(199,125,255,.18);
    }

    .bar > span{
      display:block;
      width:0%;
      height:100%;
      background: linear-gradient(90deg, #d39dff, #ffffff, #8f5cff, #d39dff);
      box-shadow: 0 0 14px rgba(199,125,255,.55);
      transition: width .12s linear;
    }

    .status{
      margin-top: 12px;
      min-height: 22px;
      text-align:center;
      font-size: 14px;
      color: var(--text);
      word-break: break-word;
      line-height:1.5;
    }

    .result{
      display:none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(10, 7, 18, .52);
      border: 1px solid rgba(199,125,255,.20);
    }

    .code{
      text-align:center;
      font-size: 17px;
      word-break: break-all;
      line-height:1.5;
      color:#fff;
      text-shadow: 0 0 10px rgba(199,125,255,.30);
      margin-bottom: 12px;
    }

    .tiny{
      margin-top: 10px;
      text-align:center;
      font-size: 12px;
      color: rgba(244,236,255,.60);
      line-height:1.5;
    }

    .hidden{ display:none; }

    .note{
      margin-top:12px;
      text-align:center;
      font-size:12px;
      color: rgba(244,236,255,.48);
      line-height:1.5;
    }

    @media (max-width: 420px){
      .grid{ grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 360px){
      .header{ padding: 16px; }
      .content{ padding: 14px; }
      .input, select{ font-size: 15px; padding: 13px 12px; }
      .btn{ font-size: 15px; }
    }

    @media (min-width: 720px){
      .panel{ width:min(100%, 520px); }
      .content{ padding: 24px; }
      .btn{ font-size:17px; }
    }
  </style>
</head>
<body class="scanlines">
  <div class="float-orb orb1"></div>
  <div class="float-orb orb2"></div>

  <div class="wrap">
    <div class="panel">
      <div class="header">
        <h1 class="title">DEMO REWARD GENERATOR</h1>
        <p class="subtitle">SMOOTH PURPLE UI • SAFE PRANK SCREEN</p>
      </div>

      <div class="content">
        <div class="box" id="loginBox">
          <span class="label">USERNAME</span>
          <input id="user" class="input" type="text" autocomplete="off" placeholder="Enter username" />

          <span class="label">PASSWORD</span>
          <input id="pass" class="input" type="password" autocomplete="off" placeholder="Enter password" />

          <button class="btn" id="loginBtn" onclick="siteLogin()">LOGIN</button>
          <div class="note">Demo access panel</div>
        </div>

        <div class="box hidden section" id="rewardBox">
          <span class="label">SELECT REWARD</span>
          <div class="grid" id="rewardGrid">
            <div class="pill active" onclick="pickReward(this,10)">₹10</div>
            <div class="pill" onclick="pickReward(this,20)">₹20</div>
            <div class="pill" onclick="pickReward(this,25)">₹25</div>
            <div class="pill" onclick="pickReward(this,50)">₹50</div>
            <div class="pill" onclick="pickReward(this,100)">₹100</div>
            <div class="pill" onclick="pickReward(this,250)">₹250</div>
          </div>

          <span class="label">CUSTOM VALUE</span>
          <div class="range-wrap">
            <input id="amountRange" type="range" min="10" max="250" value="25" oninput="updateRange()" />
            <div class="range-info">
              <span>₹10</span>
              <span id="rangeValue">₹25</span>
              <span>₹250</span>
            </div>
          </div>

          <button class="btn" id="genBtn" onclick="generateCode()">GENERATE REWARD CODE</button>

          <div class="progress-wrap" id="progressWrap">
            <div class="progress-label">
              <span>Processing request</span>
              <span id="percent">0%</span>
            </div>
            <div class="bar"><span id="barFill"></span></div>
          </div>

          <div class="status" id="status"></div>

          <div class="result" id="resultBox">
            <div class="code" id="codeText"></div>
            <button class="btn btn-secondary" onclick="copyCode()">COPY CODE</button>
          </div>

          <div class="tiny">Demo code generator • Not a real redemption system</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var currentCode = "";
    var selectedAmount = 10;
    var siteUsername = "DXXX";
    var sitePassword = "111";

    function siteLogin() {
      var user = document.getElementById("user").value.trim();
      var pass = document.getElementById("pass").value.trim();

      if (!user || !pass) {
        alert("Enter username and password");
        return;
      }

      var btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.innerText = "CHECKING...";

      if (user === siteUsername && pass === sitePassword) {
        setTimeout(function() {
          btn.disabled = false;
          btn.innerText = "LOGIN";
          document.getElementById("loginBox").classList.add("hidden");
          document.getElementById("rewardBox").classList.remove("hidden");
          document.getElementById("status").innerHTML = "Login success. Select a reward and generate a demo code.";
        }, 700);
      } else {
        btn.disabled = false;
        btn.innerText = "LOGIN";
        alert("Wrong username or password");
      }
    }

    function pickReward(el, amount) {
      selectedAmount = amount;
      var pills = document.querySelectorAll(".pill");
      for (var i = 0; i < pills.length; i++) {
        pills[i].classList.remove("active");
      }
      el.classList.add("active");
      document.getElementById("amountRange").value = amount;
      document.getElementById("rangeValue").innerHTML = "₹" + amount;
    }

    function updateRange() {
      var v = document.getElementById("amountRange").value;
      selectedAmount = parseInt(v, 10);
      document.getElementById("rangeValue").innerHTML = "₹" + v;

      var pills = document.querySelectorAll(".pill");
      for (var i = 0; i < pills.length; i++) {
        pills[i].classList.remove("active");
      }
    }

    function randomCode(len) {
      var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      var out = "";
      for (var i = 0; i < len; i++) {
        out += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return out;
    }

    function generateCode() {
      var btn = document.getElementById("genBtn");
      btn.disabled = true;
      btn.innerText = "PROCESSING...";

      document.getElementById("status").innerHTML = "Validating reward request...";
      document.getElementById("progressWrap").style.display = "block";
      document.getElementById("resultBox").style.display = "none";

      var percent = 0;
      var bar = document.getElementById("barFill");
      var p = document.getElementById("percent");

      var fake = setInterval(function () {
        percent += 3;
        if (percent > 100) percent = 100;

        bar.style.width = percent + "%";
        p.innerHTML = percent + "%";

        if (percent < 25) {
          document.getElementById("status").innerHTML = "Connecting secure panel...";
        } else if (percent < 50) {
          document.getElementById("status").innerHTML = "Preparing reward packet...";
        } else if (percent < 75) {
          document.getElementById("status").innerHTML = "Building demo code...";
        } else {
          document.getElementById("status").innerHTML = "Finalizing output...";
        }

        if (percent >= 100) {
          clearInterval(fake);

          var code = "DEMO-" + selectedAmount + "-" + randomCode(16);
          currentCode = code;

          document.getElementById("codeText").innerHTML =
            "Reward: ₹" + selectedAmount + "<br><br>Code: " + code;

          document.getElementById("resultBox").style.display = "block";
          document.getElementById("status").innerHTML = "Demo code generated. Copy it now.";
          btn.disabled = false;
          btn.innerText = "GENERATE REWARD CODE";
        }
      }, 70);
    }

    function copyCode() {
      if (!currentCode) return;
      navigator.clipboard.writeText(currentCode).then(function () {
        document.getElementById("status").innerHTML = "Code copied to clipboard.";
      });
    }
  </script>
</body>
  </html>
