
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Design</title>
<style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #2c3e50;
        font-family: Arial, sans-serif;
      }

      .phone {
        width: 300px;
        height: 600px;
        background-color: #000;
        border-radius: 40px;
        padding: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        position: relative;
        box-sizing: border-box;
        border: 4px solid #333;
      }

      /* Notch */
      .phone::before {
        content: '';
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 20px;
        background-color: #000;
        border-bottom-left-radius: 15px;
        border-bottom-right-radius: 15px;
        z-index: 2;
      }

      /* Screen */
      .screen {
        width: 100%;
        height: 100%;
        background-color: #fff;
        border-radius: 20px;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      /* Status Bar */
      .status-bar {
        height: 30px;
        background-color: #333;
        color: #fff;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 15px;
        font-size: 12px;
        padding-top: 10px;
      }

      /* Dynamic Content Area */
      .content-area {
        flex: 1;
        padding: 20px;
        background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
      }

      /* Bottom Dock */
      .dock {
        height: 70px;
        background-color: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 0 10px;
      }

      /* Home Indicator */
      .home-indicator {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 5px;
        background-color: #000;
        border-radius: 5px;
        z-index: 3;
      }
      
      /* Buttons */
      .power-btn {
        position: absolute;
        right: -4px;
        top: 150px;
        width: 4px;
        height: 50px;
        background-color: #333;
        border-radius: 0 2px 2px 0;
      }

      .vol-btn-up {
        position: absolute;
        left: -4px;
        top: 120px;
        width: 4px;
        height: 40px;
        background-color: #333;
        border-radius: 2px 0 0 2px;
      }

      .vol-btn-down {
        position: absolute;
        left: -4px;
        top: 170px;
        width: 4px;
        height: 40px;
        background-color: #333;
        border-radius: 2px 0 0 2px;
      }
</style>
  </head>
  <body>

    <div class="phone">
      <div class="power-btn"></div>
      <div class="vol-btn-up"></div>
      <div class="vol-btn-down"></div>

      <div class="screen">
        <div class="status-bar">
          <span>9:41</span>
          <span>📶 🔋</span>
        </div>

        <!-- Yehi wo area hai jahan tum content daloge -->
        <div class="content-area">
          <!-- Yahan panel se code inject karo -->
        </div>

        <div class="dock">
          <!-- Dock icons yahan rakh sakte ho ya hata sakte ho -->
        </div>

        <div class="home-indicator"></div>
      </div>
    </div>

  </body>
</html>
