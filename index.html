<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple YT Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 350px;
        }
        h2 {
            margin-bottom: 20px;
            color: #ff0000;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #2a2a2a;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #cc0000;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #bbb;
        }
        .download-link {
            display: block;
            margin-top: 15px;
            padding: 12px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            display: none; /* Hidden by default */
        }
        .download-link:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>YouTube Downloader</h2>
    <input type="text" id="videoUrl" placeholder="Paste YouTube Link Here">
    <button onclick="fetchVideo()">Get Video</button>
    <div id="status"></div>
    <a id="dlBtn" class="download-link" target="_blank">Download Video</a>
</div>

<script>
    async function fetchVideo() {
        const url = document.getElementById('videoUrl').value;
        const status = document.getElementById('status');
        const dlBtn = document.getElementById('dlBtn');

        if (!url) {
            status.innerText = "Please enter a valid URL.";
            return;
        }

        status.innerText = "Fetching...";
        dlBtn.style.display = "none";

        // Using a reliable API that handles CORS well
        const apiUrl = `https://api.vevioz.com/api/url/yt/video?u=${encodeURIComponent(url)}`;

        try {
            const response = await fetch(apiUrl);
            const data = await response.json();

            if (data.status === "ok") {
                dlBtn.href = data.url;
                dlBtn.style.display = "block";
                status.innerText = "Ready to download!";
            } else {
                status.innerText = "Error: Could not fetch video.";
            }
        } catch (error) {
            status.innerText = "Network Error. Check console.";
            console.error(error);
        }
    }
</script>

</body>
</html>
