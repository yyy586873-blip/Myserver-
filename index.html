<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLC Streamer</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --primary: #ff6600; /* VLC Orange */
            --text: #ffffff;
            --sub-text: #b3b3b3;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 90%;
            max-width: 500px;
            background-color: var(--card);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        p {
            color: var(--sub-text);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            border-radius: 50px;
            border: 2px solid #333;
            background-color: #2a2a2a;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn-vlc {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-vlc:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 102, 0, 0.4);
        }

        .btn-vlc:active {
            transform: scale(0.95);
        }

        /* Icon SVG */
        .icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .status {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #666;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>VLC Streamer</h2>
        <p>Paste any YouTube link below to open it directly in VLC Player.</p>
        
        <div class="input-wrapper">
            <input type="text" id="ytLink" placeholder="https://www.youtube.com/watch?v=..." />
        </div>

        <button class="btn-vlc" onclick="openInVLC()">
            <!-- VLC Cone Icon -->
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
            </svg>
            Play in VLC
        </button>

        <div class="status" id="statusMsg"></div>
    </div>

    <script>
        function openInVLC() {
            const urlInput = document.getElementById('ytLink').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!urlInput) {
                statusMsg.style.color = '#ff4444';
                statusMsg.innerText = "Please enter a valid URL first.";
                return;
            }

            // Check if it's a valid YouTube link
            const ytRegex = /^(https?\:\/\/)?(www\.youtube\.com|youtu\.?be)\/.+$/;
            if (!ytRegex.test(urlInput)) {
                statusMsg.style.color = '#ff4444';
                statusMsg.innerText = "That doesn't look like a YouTube link.";
                return;
            }

            statusMsg.style.color = '#666';
            statusMsg.innerText = "Opening VLC...";

            // Construct the deep link for VLC
            // Note: This works best on Mobile. On Desktop, it might ask to open the app.
            const vlcProtocol = `vlc://${encodeURIComponent(urlInput)}`;
            
            // Create a temporary link to trigger the protocol
            const tempLink = document.createElement('a');
            tempLink.href = vlcProtocol;
            tempLink.click();
        }
    </script>
</body>
</html>
