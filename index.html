
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Open World 3D Racer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue fallback */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        #speedometer {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }
        
        /* Mobile Controls */
        .controls-area {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: auto;
        }
        
        .steer-pad {
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            position: relative;
        }
        
        .steer-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .pedal-pad {
            width: 100px;
            height: 150px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            align-items: flex-end;
        }

        .pedal {
            width: 40px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid white;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            user-select: none;
        }
        .pedal:active { background: rgba(255, 255, 255, 0.5); }
        .brake { background: rgba(255, 50, 50, 0.2); border-color: red; }
        .gas { background: rgba(50, 255, 50, 0.2); border-color: lime; }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="info">Desktop: WASD/Arrows | Mobile: Swipe + Buttons</div>
        <div id="speedometer">0 km/h</div>
        
        <div class="controls-area">
            <div class="steer-pad" id="steer-zone">
                <div class="steer-knob" id="steer-knob"></div>
            </div>
            <div class="pedal-pad">
                <div class="pedal brake" id="btn-brake">B</div>
                <div class="pedal gas" id="btn-gas">G</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- Config ---
        const WORLD_SIZE = 2000;
        const CHUNK_SIZE = 200;
        
        // --- Globals ---
        let scene, camera, renderer;
        let car, wheels = [];
        let buildings = [];
        
        // Physics
        let speed = 0;
        let maxSpeed = 1.5;
        let acceleration = 0.01;
        let friction = 0.98;
        let turnSpeed = 0.04;
        let angle = 0;
        
        // Input
        let keys = { w: false, a: false, s: false, d: false, space: false };
        let touchSteer = 0; // -1 to 1
        let touchGas = false;
        let touchBrake = false;

        // --- Init ---
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 50, 300);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 150, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 500;
            dirLight.shadow.camera.left = -100;
            dirLight.shadow.camera.right = 100;
            dirLight.shadow.camera.top = 100;
            dirLight.shadow.camera.bottom = -100;
            scene.add(dirLight);

            // Ground
            createWorld();

            // Car
            createCar();

            // Events
            window.addEventListener('resize', onResize, false);
            setupInputs();

            animate();
        }

        // --- World Generation ---
        function createWorld() {
            // Base Ground
            const planeGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE);
            const planeMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a });
            const ground = new THREE.Mesh(planeGeo, planeMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Grid Helper for speed illusion
            const grid = new THREE.GridHelper(WORLD_SIZE, 100, 0x555555, 0x333333);
            grid.position.y = 0.1;
            scene.add(grid);

            // Random Buildings
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            const mat1 = new THREE.MeshStandardMaterial({ color: 0xff00ff });
            const mat2 = new THREE.MeshStandardMaterial({ color: 0x00ffff });
            const mat3 = new THREE.MeshStandardMaterial({ color: 0xffff00 });
            const mats = [mat1, mat2, mat3];

            for(let i=0; i<200; i++) {
                const h = Math.random() * 10 + 5;
                const w = Math.random() * 5 + 2;
                const mat = mats[Math.floor(Math.random() * mats.length)];
                
                const building = new THREE.Mesh(boxGeo, mat);
                building.position.x = (Math.random() - 0.5) * 800;
                building.position.z = (Math.random() - 0.5) * 800;
                building.position.y = h / 2;
                building.scale.set(w, h, w);
                building.castShadow = true;
                building.receiveShadow = true;
                scene.add(building);
                buildings.push(building);
            }
        }

        // --- Car Creation ---
        function createCar() {
            car = new THREE.Group();

            // Body
            const bodyGeo = new THREE.BoxGeometry(2, 1, 4);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0000, metalness: 0.3, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            body.castShadow = true;
            car.add(body);

            // Cabin
            const cabinGeo = new THREE.BoxGeometry(1.8, 0.6, 2);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.y = 1.5;
            cabin.position.z = -0.2;
            car.add(cabin);

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            
            const wheelPositions = [
                { x: -1.1, y: 0.4, z: 1.2 },
                { x: 1.1, y: 0.4, z: 1.2 },
                { x: -1.1, y: 0.4, z: -1.2 },
                { x: 1.1, y: 0.4, z: -1.2 }
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos.x, pos.y, pos.z);
                wheel.castShadow = true;
                car.add(wheel);
                wheels.push(wheel);
            });

            // Headlights
            const lightGeo = new THREE.BoxGeometry(0.4, 0.2, 0.1);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
            const leftLight = new THREE.Mesh(lightGeo, lightMat);
            leftLight.position.set(-0.6, 0.8, 2);
            car.add(leftLight);
            const rightLight = new THREE.Mesh(lightGeo, lightMat);
            rightLight.position.set(0.6, 0.8, 2);
            car.add(rightLight);

            scene.add(car);
        }

        // --- Input Handling ---
        function setupInputs() {
            // Keyboard
            document.addEventListener('keydown', (e) => {
                if(e.key.toLowerCase() === 'w' || e.key === 'ArrowUp') keys.w = true;
                if(e.key.toLowerCase() === 's' || e.key === 'ArrowDown') keys.s = true;
                if(e.key.toLowerCase() === 'a' || e.key === 'ArrowLeft') keys.a = true;
                if(e.key.toLowerCase() === 'd' || e.key === 'ArrowRight') keys.d = true;
            });
            document.addEventListener('keyup', (e) => {
                if(e.key.toLowerCase() === 'w' || e.key === 'ArrowUp') keys.w = false;
                if(e.key.toLowerCase() === 's' || e.key === 'ArrowDown') keys.s = false;
                if(e.key.toLowerCase() === 'a' || e.key === 'ArrowLeft') keys.a = false;
                if(e.key.toLowerCase() === 'd' || e.key === 'ArrowRight') keys.d = false;
            });

            // Touch Steer (Virtual Joystick Logic)
            const steerZone = document.getElementById('steer-zone');
            const steerKnob = document.getElementById('steer-knob');
            let startX = 0;
            let startY = 0;
            const maxMove = 50;

            steerZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });

            steerZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;
                
                let deltaX = currentX - startX;
                let deltaY = currentY - startY;
                
                // Clamp
                deltaX = Math.max(-maxMove, Math.min(maxMove, deltaX));
                deltaY = Math.max(-maxMove, Math.min(maxMove, deltaY));
                
                steerKnob.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
                
                // Map X movement to steering
                touchSteer = deltaX / maxMove;
            });

            steerZone.addEventListener('touchend', (e) => {
                steerKnob.style.transform = `translate(-50%, -50%)`;
                touchSteer = 0;
            });

            // Pedals
            const btnGas = document.getElementById('btn-gas');
            const btnBrake = document.getElementById('btn-brake');

            btnGas.addEventListener('touchstart', (e) => { e.preventDefault(); touchGas = true; });
            btnGas.addEventListener('touchend', (e) => { e.preventDefault(); touchGas = false; });
            
            btnBrake.addEventListener('touchstart', (e) => { e.preventDefault(); touchBrake = true; });
            btnBrake.addEventListener('touchend', (e) => { e.preventDefault(); touchBrake = false; });
        }

        // --- Game Loop ---
        function updatePhysics() {
            // Gas
            if (keys.w || touchGas) {
                speed += acceleration;
            } else {
                speed *= friction; // Coasting
            }
            
            // Brake
            if (keys.s || touchBrake) {
                speed -= acceleration * 2;
            }

            // Cap Speed
            speed = Math.max(-0.5, Math.min(maxSpeed, speed));
            
            // Steering
            if (speed > 0.1 || speed < -0.1) {
                // Turn
                let turn = turnSpeed * (speed / maxSpeed); // Turn slower at high speed
                if (keys.a) angle += turn;
                if (keys.d) angle -= turn;
                
                // Touch steering override/addition
                angle += touchSteer * turnSpeed * (speed / maxSpeed);
            }

            // Apply movement
            car.rotation.y = angle;
            car.position.x += Math.sin(angle) * speed;
            car.position.z += Math.cos(angle) * speed;

            // Wheel Animation
            wheels.forEach(w => {
                w.rotation.x += speed;
            });

            // Car Body Tilt
            car.rotation.z = -touchSteer * 0.1 * (speed/maxSpeed); // Lean into turn

            // Update UI
            document.getElementById('speedometer').innerText = Math.floor(Math.abs(speed) * 100) + " km/h";
        }

        function updateCamera() {
            // Camera follows car
            const relativeCameraOffset = new THREE.Vector3(0, 5, -10); // Behind and up
            
            // Calculate world position for camera
            const cameraOffset = relativeCameraOffset.applyMatrix4(car.matrixWorld);
            
            // Smoothly interpolate camera position
            camera.position.lerp(cameraOffset, 0.1);
            camera.lookAt(car.position);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            updatePhysics();
            updateCamera();
            
            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
