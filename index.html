<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Steering Wheel Racer</title>
<style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #2c3e50; /* Sky color */
            overflow: hidden;
        }

        /* The Road */
        #road {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%; 
            background-color: #34495e;
            border-left: 4px solid white;
            border-right: 4px solid white;
            z-index: 1;
        }

        /* Lane Marker */
        .lane-marker {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 40px;
            background-color: white;
        }

        /* The Player Car */
        #player {
            position: absolute;
            bottom: 180px; /* Above steering wheel */
            left: 50%;
            width: 40px;
            height: 70px;
            background-color: #e74c3c;
            border-radius: 8px;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }
        
        /* Car Details */
        #player::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 2px;
            width: 36px;
            height: 15px;
            background-color: #2c3e50;
            border-radius: 2px;
        }
        #player::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 2px;
            width: 36px;
            height: 10px;
            background-color: #2c3e50;
        }

        /* Enemy Cars */
        .enemy {
            position: absolute;
            width: 40px;
            height: 70px;
            background-color: #3498db;
            border-radius: 8px;
            z-index: 9;
            box-sizing: border-box;
            border: 1px solid #111;
        }

        /* Steering Wheel Area */
        #steering-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #wheel {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #333 20%, #000 21%, #000 60%, #444 61%);
            border-radius: 50%;
            position: relative;
            border: 4px solid #555;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transform-origin: center center;
            transition: transform 0.1s ease-out;
        }

        /* Spokes */
        #wheel::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 12px;
            background: #444;
            border-radius: 5px;
        }
        #wheel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 50px;
            background: #444;
            border-radius: 5px;
        }
        
        /* Horn Button */
        #horn-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: #888;
            border-radius: 50%;
            border: 2px solid #aaa;
            z-index: 2;
        }
        
        /* UI */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        #score-board {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }

        /* Game Over Screen */
        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 30;
        }

        h1 {
            color: #e74c3c;
            font-size: 40px;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            text-shadow: 0 0 10px black;
        }

        button {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #27ae60;
        }

        button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 0 #27ae60;
        }
        
        #controls-hint {
            position: absolute;
            bottom: 160px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            pointer-events: none;
        }

</style>
  </head>
  <body>

    <div id="game-container">
	  <div id="road">
		<!-- Lane markers injected via JS -->
	  </div>

	  <div id="player"></div>

	  <div id="ui-layer">
		<div id="score-board">Score: 0</div>
	  </div>

	  <div id="controls-hint">Use Wheel to Drive</div>

	  <!-- Steering Wheel Controls -->
	  <div id="steering-area">
		<div id="wheel">
		  <div id="horn-btn"></div>
		</div>
	  </div>

	  <div id="game-over-screen" style="display: none;">
		<h1>CRASHED!</h1>
		<div style="color:white; font-size: 20px; margin-bottom: 20px;">Score: <span id="final-score">0</span></div>
		<button id="restart-btn">TRY AGAIN</button>
	  </div>
    </div>

<script>
        // --- Configuration ---
        const GAME_SPEED_START = 6;
        const SPEED_INCREMENT = 0.005;
        const SPAWN_RATE_START = 80; 
        const MAX_STEER_ANGLE = 90; // Max degrees wheel can turn

        // --- State ---
        let isGameRunning = false;
        let score = 0;
        let gameSpeed = GAME_SPEED_START;
        let frameCount = 0;
        let spawnRate = SPAWN_RATE_START;
        
        // Steering State
        let steerAngle = 0;
        let steerVelocity = 0;
        let isSteering = false;
        let steerDirection = 0; // -1 left, 1 right

        // Player State
        let playerX = 50; // Percentage (50% is center)
        let targetX = 50;
        
        // Elements
        const road = document.getElementById('road');
        const player = document.getElementById('player');
        const wheel = document.getElementById('wheel');
        const scoreEl = document.getElementById('score-board');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        // Arrays
        let enemies = [];
        let roadMarkers = [];

        // --- Initialization ---
        function init() {
            createRoadMarkers();
            
            // Steering Wheel Touch Logic
            const wheelArea = document.getElementById('steering-area');
            
            wheelArea.addEventListener('touchstart', handleWheelStart, {passive: false});
            wheelArea.addEventListener('touchmove', handleWheelMove, {passive: false});
            wheelArea.addEventListener('touchend', handleWheelEnd, {passive: false});

            // Mouse support for testing
            wheelArea.addEventListener('mousedown', handleWheelStart);
            window.addEventListener('mousemove', handleWheelMove);
            window.addEventListener('mouseup', handleWheelEnd);

            restartBtn.addEventListener('click', startGame);
            
            startGame();
        }

        function startGame() {
            // Reset State
            isGameRunning = true;
            score = 0;
            gameSpeed = GAME_SPEED_START;
            spawnRate = SPAWN_RATE_START;
            frameCount = 0;
            steerAngle = 0;
            steerVelocity = 0;
            playerX = 50;
            targetX = 50;
            
            // Clear UI
            enemies.forEach(e => e.element.remove());
            enemies = [];
            gameOverScreen.style.display = 'none';
            scoreEl.innerText = 'Score: 0';
            
            requestAnimationFrame(gameLoop);
        }

        function handleWheelStart(e) {
            isSteering = true;
            const rect = document.getElementById('wheel').getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            
            // Get touch or mouse X
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            
            // Determine direction
            if (clientX < centerX) steerDirection = -1; // Left
            else steerDirection = 1; // Right
        }

        function handleWheelMove(e) {
            if (!isSteering || !isGameRunning) return;
            
            const rect = document.getElementById('wheel').getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            
            // Calculate distance from center
            let diff = clientX - centerX;
            
            // Clamp max angle
            if (diff > 100) diff = 100;
            if (diff < -100) diff = -100;
            
            // Map distance to angle
            steerAngle = diff; 
            
            // Apply visual rotation
            wheel.style.transform = `rotate(${steerAngle}deg)`;
        }

        function handleWheelEnd(e) {
            isSteering = false;
            // Smooth return to 0
            wheel.style.transition = 'transform 0.5s ease-out';
            wheel.style.transform = `rotate(0deg)`;
        }

        function createRoadMarkers() {
            const markerCount = 10;
            const height = 40;
            const gap = (window.innerHeight / markerCount);

            for(let i=0; i<markerCount; i++) {
                let m = document.createElement('div');
                m.className = 'lane-marker';
                m.style.height = height + 'px';
                m.style.top = (i * gap) + 'px';
                road.appendChild(m);
                roadMarkers.push({ element: m, y: i * gap });
            }
        }

        function spawnEnemy() {
            // Random Lane: 3 lanes
            // Lanes: 25%, 50%, 75% of screen width
            const xPositions = [25, 50, 75];
            const x = xPositions[Math.floor(Math.random() * 3)];

            const el = document.createElement('div');
            el.className = 'enemy';
            const r = Math.floor(Math.random() * 200);
            const g = Math.floor(Math.random() * 100);
            const b = Math.floor(Math.random() * 100);
            el.style.backgroundColor = `rgb(${r},${g},${b})`;
            
            el.style.left = x + '%';
            el.style.top = '-100px'; 
            
            road.appendChild(el);
            
            enemies.push({
                element: el,
                x: x,
                y: -100
            });
        }

        function updateRoad() {
            roadMarkers.forEach(m => {
                m.y += gameSpeed;
                if (m.y > window.innerHeight) {
                    m.y = -50;
                }
                m.element.style.top = m.y + 'px';
            });
        }

        function updateEnemies() {
            if (frameCount % Math.floor(spawnRate) === 0) {
                spawnEnemy();
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += gameSpeed * 1.5;
                e.element.style.top = e.y + 'px';

                // Improved Collision Detection
                const playerRect = player.getBoundingClientRect();
                const enemyRect = e.element.getBoundingClientRect();

                // Shrink hitboxes slightly for fairness
                const padding = 5; 

                const hit = (
                    playerRect.left + padding < enemyRect.right - padding &&
                    playerRect.right - padding > enemyRect.left + padding &&
                    playerRect.top + padding < enemyRect.bottom - padding &&
                    playerRect.bottom - padding > enemyRect.top + padding
                );

                if (hit) {
                    gameOver();
                }

                if (e.y > window.innerHeight + 100) {
                    e.element.remove();
                    enemies.splice(i, 1);
                    score += 10;
                    scoreEl.innerText = 'Score: ' + score;
                    
                    gameSpeed += 0.1;
                    if(spawnRate > 40) spawnRate -= 1;
                }
            }
        }

        function renderPlayer() {
            // Physics: Steer angle affects speed of X movement
            if (isSteering) {
                // Move towards the direction indicated by wheel
                const speed = Math.abs(steerAngle) * 0.05; // Sensitivity
                targetX += steerDirection * speed;
                
                // Clamp to road bounds (10% to 90%)
                if (targetX < 15) targetX = 15;
                if (targetX > 85) targetX = 85;
            } else {
                // Auto-center if not steering (optional, feels more like a game)
                // targetX += (50 - targetX) * 0.01; 
            }
            
            // Smooth interpolation
            playerX += (targetX - playerX) * 0.2;
            player.style.left = playerX + '%';
            
            // Tilt car based on steering
            player.style.transform = `translateX(-50%) rotate(${-steerAngle * 0.2}deg)`;
        }

        function gameLoop() {
            if (!isGameRunning) return;

            frameCount++;
            updateRoad();
            updateEnemies();
            renderPlayer();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isGameRunning = false;
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'flex';
        }

        // Start
        init();

</script>
  </body>
</html>
