
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Cinematic Experience: The Last Transmission</title>
<style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            background: radial-gradient(circle, transparent 60%, black 100%);
        }
        #subtitle {
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            font-size: 18px;
            text-align: center;
            max-width: 80%;
            margin: 0 auto;
            opacity: 0;
            transition: opacity 0.5s;
            border-left: 3px solid #ff3333;
        }
        #title-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            z-index: 10;
            pointer-events: auto;
        }
        h1 {
            font-size: 4rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 10px;
            text-shadow: 0 0 20px #ff3333;
        }
        p {
            font-size: 1.2rem;
            color: #aaa;
        }
        #start-btn {
            background: #ff3333;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 5px;
            box-shadow: 0 0 15px #ff3333;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #666;
            font-size: 12px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
        }
</style>
  </head>
  <body>

	<div id="loading">Loading 3D Engine...</div>

	<div id="canvas-container"></div>

	<div id="ui-layer">
	  <div id="subtitle"></div>
	</div>

	<div id="title-card">
	  <h1>The Last Transmission</h1>
	  <p>A Sci-Fi Mystery</p>
	  <button id="start-btn">START EXPERIENCE</button>
	</div>

	<div id="controls-hint">Touch & Drag to Rotate • Pinch to Zoom</div>

<script type="module">
    import * as THREE from 'https://unpkg.com/three@0.150.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.150.0/examples/jsm/controls/OrbitControls.js';
    import { EffectComposer } from 'https://unpkg.com/three@0.150.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://unpkg.com/three@0.150.0/examples/jsm/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'https://unpkg.com/three@0.150.0/examples/jsm/postprocessing/UnrealBloomPass.js';

    // --- Global Variables ---
    let scene, camera, renderer, composer, controls;
    let clock = new THREE.Clock();
    let mixer;
    let currentScenePhase = 0;
    let isPlaying = false;
    let particles;
    let mysteryBox;
    let lightBulbs = [];
    let drone;
    
    // Story Data
    const story = [
        { time: 0, text: "Year 2049. The colony on Kepler-186f has gone silent." },
        { time: 5, text: "You are the recovery drone. Objective: Locate the source of the signal." },
        { time: 12, text: "The landscape is harsh. Radiation levels are critical." },
        { time: 20, text: "Wait... what is that structure?" },
        { time: 28, text: "It's not from Earth. The geometry is... impossible." },
        { time: 35, text: "Signal strength increasing. 98%... 99%..." },
        { time: 42, text: "It's alive." },
        { time: 50, text: "Transmission Complete. Awaiting orders." }
    ];

    // --- Initialization ---
    function init() {
        document.getElementById('loading').style.display = 'none';
        
        // Scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        // Camera
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 10);

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Post-Processing (Bloom for "Video" look)
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);
        
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.2;
        bloomPass.strength = 1.2;
        bloomPass.radius = 0.5;
        composer.addPass(bloomPass);

        // Controls
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2;
        controls.minDistance = 2;
        controls.maxDistance = 50;

        // Lighting
        setupLighting();

        // Objects
        createEnvironment();
        createMysteryObject();
        createParticles();

        // Events
        window.addEventListener('resize', onWindowResize);
        document.getElementById('start-btn').addEventListener('click', startExperience);

        // Start Loop
        animate();
    }

    function setupLighting() {
        const ambientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Red Emergency Light
        const pointLight = new THREE.PointLight(0xff0000, 2, 20);
        pointLight.position.set(0, 5, 0);
        scene.add(pointLight);
        lightBulbs.push(pointLight);
    }

    function createEnvironment() {
        // Ground
        const groundGeo = new THREE.PlaneGeometry(100, 100, 64, 64);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x1a1a1a, 
            roughness: 0.8,
            metalness: 0.2
        });
        
        // Displace vertices for terrain
        const posAttribute = groundGeo.attributes.position;
        for (let i = 0; i < posAttribute.count; i++) {
            const x = posAttribute.getX(i);
            const y = posAttribute.getY(i);
            const z = posAttribute.getZ(i);
            // Create bumps
            const height = Math.sin(x * 0.1) * Math.cos(y * 0.1) * 2 + Math.random() * 0.5;
            posAttribute.setZ(i, z + height);
        }
        groundGeo.computeVertexNormals();

        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Ruins/Blocks
        for(let i=0; i<20; i++) {
            const h = Math.random() * 5 + 1;
            const geo = new THREE.BoxGeometry(1, h, 1);
            const mat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const block = new THREE.Mesh(geo, mat);
            
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * 30 + 10;
            block.position.set(Math.cos(angle) * dist, h/2, Math.sin(angle) * dist);
            block.rotation.y = Math.random();
            block.castShadow = true;
            block.receiveShadow = true;
            scene.add(block);
        }
    }

    function createMysteryObject() {
        // A complex geometry for the "Alien Object"
        const geometry = new THREE.IcosahedronGeometry(2, 0);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x000000,
            roughness: 0.1,
            metalness: 0.9,
            emissive: 0x111111
        });
        mysteryBox = new THREE.Mesh(geometry, material);
        mysteryBox.position.set(0, 3, -15);
        mysteryBox.castShadow = true;
        scene.add(mysteryBox);

        // Glowing Ring
        const ringGeo = new THREE.TorusGeometry(4, 0.1, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xff3333 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        mysteryBox.add(ring);
        ring.rotation.x = Math.PI / 2;

        // Inner Light
        const light = new THREE.PointLight(0xff3333, 2, 10);
        mysteryBox.add(light);
    }

    function createParticles() {
        const geometry = new THREE.BufferGeometry();
        const count = 1000;
        const positions = new Float32Array(count * 3);
        
        for(let i=0; i<count; i++) {
            positions[i*3] = (Math.random() - 0.5) * 100;
            positions[i*3+1] = Math.random() * 50;
            positions[i*3+2] = (Math.random() - 0.5) * 100;
        }
        
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        const material = new THREE.PointsMaterial({
            size: 0.1,
            color: 0xffffff,
            transparent: true,
            opacity: 0.6
        });
        
        particles = new THREE.Points(geometry, material);
        scene.add(particles);
    }

    function startExperience() {
        document.getElementById('title-card').style.display = 'none';
        isPlaying = true;
        playSubtitle(0);
        
        // Start Drone Animation
        animateDrone();
    }

    function playSubtitle(index) {
        if(index >= story.length) return;
        
        const subEl = document.getElementById('subtitle');
        subEl.style.opacity = 0;
        
        setTimeout(() => {
            subEl.innerText = story[index].text;
            subEl.style.opacity = 1;
            
            // Auto advance
            setTimeout(() => {
                playSubtitle(index + 1);
            }, story[index+1].time * 1000 - story[index].time * 1000);
        }, 500);
    }

    function animateDrone() {
        // Simple camera path animation
        const time = clock.getElapsedTime();
        
        // Move camera in a circle around the mystery box
        const radius = 15;
        const speed = 0.1;
        
        if(currentScenePhase === 0) {
            // Orbit
            const angle = time * speed;
            camera.position.x = Math.cos(angle) * radius;
            camera.position.z = Math.sin(angle) * radius - 15;
            camera.position.y = 5 + Math.sin(time * 0.5) * 2;
            camera.lookAt(0, 3, -15);
        } else if (currentScenePhase === 1) {
            // Zoom in
            const t = Math.min(1, (time - 40) * 0.1); // Start zooming after 40s
            camera.position.lerp(new THREE.Vector3(0, 3, -10), 0.05);
            camera.lookAt(0, 3, -15);
        }

        // Animate Mystery Box
        if(mysteryBox) {
            mysteryBox.rotation.y += 0.01;
            mysteryBox.rotation.x = Math.sin(time) * 0.1;
            mysteryBox.position.y = 3 + Math.sin(time * 2) * 0.5;
            
            // Change color intensity based on "signal"
            const intensity = Math.min(1, (time - 30) * 0.1);
            mysteryBox.material.emissiveIntensity = intensity;
        }

        // Rotate Particles
        if(particles) {
            particles.rotation.y += 0.001;
        }
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        
        if(isPlaying) {
            const time = clock.getElapsedTime();
            
            // Phase switching
            if(time > 40 && currentScenePhase === 0) {
                currentScenePhase = 1;
            }

            animateDrone();
            
            // Pulse lights
            lightBulbs.forEach(light => {
                light.intensity = 2 + Math.sin(time * 5) * 0.5;
            });
        }

        controls.update();
        composer.render();
    }

    init();
</script>
  </body>
</html>
