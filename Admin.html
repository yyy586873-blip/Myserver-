<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chess Arena - Admin</title>
<style>
    :root {
        --bg-dark: #0f1219;
        --panel-bg: rgba(30, 35, 45, 0.7);
        --border-color: rgba(255, 255, 255, 0.1);
        --accent-blue: #4facfe;
        --accent-purple: #00f2fe;
        --text-main: #e6ebf5;
        --text-muted: #8b9bb4;
        --board-light: #eeeed2;
        --board-dark: #769656;
        --highlight-move: rgba(255, 255, 0, 0.4);
        --highlight-from: rgba(0, 255, 0, 0.3);
        --highlight-to: rgba(255, 0, 0, 0.3);
        --glass-blur: blur(12px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top left, #1a2333 0%, var(--bg-dark) 100%);
        color: var(--text-main);
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        padding: 20px;
    }

    .app-container {
        width: 100%;
        max-width: 600px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    /* Header */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border-color);
        margin-bottom: 10px;
    }

    .brand h1 {
        margin: 0;
        font-size: 1.5rem;
        background: linear-gradient(to right, var(--accent-blue), var(--accent-purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
        letter-spacing: -0.5px;
    }

    .status-badge {
        font-size: 0.8rem;
        padding: 4px 12px;
        border-radius: 20px;
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
    .dot.connected { background: #00ff88; box-shadow: 0 0 8px #00ff88; }

    /* Panels */
    .panel {
        background: var(--panel-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 15px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .player-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        background: rgba(0,0,0,0.2);
        border-radius: 10px;
        margin-bottom: 8px;
    }

    .player-info { display: flex; align-items: center; gap: 10px; }
    .avatar { font-size: 1.2rem; }
    .p-name { font-weight: 600; font-size: 0.95rem; }
    .p-status { font-size: 0.75rem; color: var(--text-muted); }
    
    .turn-indicator {
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 4px;
        background: #333;
        color: #fff;
        opacity: 0.5;
    }
    .turn-indicator.active { opacity: 1; background: var(--accent-blue); box-shadow: 0 0 10px var(--accent-blue); }

    /* Board */
    .board-wrapper {
        position: relative;
        padding: 10px;
        background: #2a303c;
        border-radius: 8px;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }

    .coords-row {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        text-align: center;
        font-size: 0.7rem;
        color: var(--text-muted);
        margin: 4px 0;
    }

    .board-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        aspect-ratio: 1;
        border-radius: 4px;
        overflow: hidden;
        border: 2px solid #444;
    }

    .square {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: clamp(24px, 8vw, 48px);
        cursor: pointer;
        user-select: none;
    }

    .square.light { background-color: var(--board-light); color: black; }
    .square.dark { background-color: var(--board-dark); color: black; }

    .square.last-move { background-color: rgba(255, 255, 50, 0.5) !important; }
    .square.selected { background-color: rgba(100, 200, 255, 0.5) !important; }
    .square.in-check { background-color: #ff4444 !important; }

    /* Legal Move Hint */
    .hint-dot::after {
        content: '';
        position: absolute;
        width: 25%;
        height: 25%;
        background: rgba(0,0,0,0.2);
        border-radius: 50%;
    }
    .capture-hint::after {
        content: '';
        position: absolute;
        width: 85%;
        height: 85%;
        border: 4px solid rgba(0,0,0,0.2);
        border-radius: 50%;
    }

    /* Controls */
    .controls-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 10px;
    }

    button {
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .btn-primary {
        background: linear-gradient(135deg, var(--accent-blue), #00c6fb);
        color: white;
        box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-secondary {
        background: rgba(255,255,255,0.05);
        color: var(--text-main);
        border: 1px solid var(--border-color);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); }

    /* Engine Panel */
    .engine-panel {
        margin-top: 10px;
        border-left: 4px solid var(--accent-purple);
    }

    .engine-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }

    .engine-title {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--accent-purple);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .move-suggestion-box {
        background: rgba(0,0,0,0.3);
        border-radius: 8px;
        padding: 10px;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: monospace;
        font-size: 1.1rem;
        color: #fff;
        position: relative;
        overflow: hidden;
    }

    .loading-spinner {
        width: 20px; height: 20px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: var(--accent-purple);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

    .thinking span { animation: pulse 1.5s infinite; color: var(--text-muted); font-size: 0.8rem; }

    /* Overlays */
    .overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.85);
        display: flex; align-items: center; justify-content: center;
        z-index: 100;
        opacity: 0; pointer-events: none;
        transition: opacity 0.3s;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }

    .modal {
        background: #1e232f;
        border: 1px solid #444;
        padding: 25px;
        border-radius: 16px;
        text-align: center;
        width: 90%;
        max-width: 300px;
        transform: scale(0.9);
        transition: transform 0.3s;
    }
    .overlay.active .modal { transform: scale(1); }

    .promo-btn {
        font-size: 2rem;
        background: #2a3040;
        border: 1px solid #444;
        width: 60px; height: 60px;
        margin: 5px;
        border-radius: 8px;
    }
    .promo-btn:hover { background: #3a4050; }

    /* Toast */
    .toast {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: #333; color: #fff; padding: 10px 20px;
        border-radius: 20px; font-size: 0.85rem;
        opacity: 0; transition: opacity 0.3s;
        z-index: 200;
    }
    .toast.show { opacity: 1; }

</style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="brand"><h1>♞ Chess Arena</h1></div>
        <div class="status-badge">
            <span class="dot" id="connDot"></span>
            <span id="connText">Offline</span>
        </div>
    </header>

    <!-- Player Bars -->
    <div class="panel">
        <div class="player-bar">
            <div class="player-info">
                <span class="avatar">♔</span>
                <div>
                    <div class="p-name">White</div>
                    <div class="p-status" id="whiteStatus">Waiting...</div>
                </div>
            </div>
            <div class="turn-indicator" id="whiteTurnTag">WHITE</div>
        </div>
        
        <div class="player-bar">
            <div class="player-info">
                <span class="avatar">♚</span>
                <div>
                    <div class="p-name">Black</div>
                    <div class="p-status" id="blackStatus">Waiting...</div>
                </div>
            </div>
            <div class="turn-indicator" id="blackTurnTag">BLACK</div>
        </div>
    </div>

    <!-- Board -->
    <div class="board-wrapper">
        <div class="coords-row" style="grid-template-columns: 20px 1fr;">
            <div></div>
            <span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span>
        </div>
        <div style="display:flex;">
            <div class="coords-row" style="writing-mode: vertical-lr; height: 100%; align-items: center; grid-template-rows: repeat(8, 1fr); grid-column: 1; padding-right: 5px;">
                <span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
            </div>
            <div class="board-grid" id="board"></div>
        </div>
        <div class="coords-row" style="grid-template-columns: 20px 1fr;">
            <div></div>
            <span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span>
        </div>
    </div>

    <!-- Controls -->
    <div class="panel">
        <div class="controls-grid">
            <button class="btn-secondary" id="flipBtn">↕ Flip</button>
            <button class="btn-primary" id="newGameBtn" disabled>New Game</button>
        </div>
        
        <!-- Engine Section -->
        <div class="panel engine-panel" style="margin-top: 15px; border:none; background:transparent; box-shadow:none;">
            <div class="engine-header">
                <div class="engine-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                    AI Analysis (Stockfish)
                </div>
                <div style="display:flex; gap:5px;">
                     <button class="btn-secondary" id="clearSuggestBtn" style="padding: 5px 10px; font-size: 0.8rem;">✕</button>
                </div>
            </div>
            
            <div class="move-suggestion-box" id="engineBox">
                <div class="loading-spinner" id="loader"></div>
                <div id="engineText" style="display:none;">Ready</div>
            </div>
            
            <div style="display:flex; justify-content:space-between; margin-top:10px;">
                <button class="btn-secondary" id="evalBtn" style="flex:1; margin-right:5px; font-size:0.8rem;">📊 Evaluate Position</button>
                <button class="btn-primary" id="suggestBtn" style="flex:2; margin-left:5px;">✨ Suggest Best Move</button>
            </div>
        </div>

        <div style="text-align:center; color:var(--text-muted); font-size:0.8rem; margin-top:10px;" id="gameHint">
            Select a piece to view legal moves.
        </div>
    </div>
</div>

<!-- Promotion Modal -->
<div class="overlay" id="promoOverlay">
    <div class="modal">
        <h3 style="margin-top:0">Promote Pawn</h3>
        <div style="display:flex; justify-content:center; flex-wrap:wrap;">
            <button class="promo-btn" data-p="q">♛</button>
            <button class="promo-btn" data-p="r">♜</button>
            <button class="promo-btn" data-p="b">♝</button>
            <button class="promo-btn" data-p="n">♞</button>
        </div>
    </div>
</div>

<!-- Waiting Overlay -->
<div class="overlay active" id="waitingOverlay">
    <div class="modal">
        <div style="font-size:3rem; margin-bottom:10px;">♟</div>
        <h2 id="waitTitle">Connecting...</h2>
        <p id="waitMsg" style="color:#aaa; font-size:0.9rem;">Establishing connection with server.</p>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function() {
    // --- CONFIG & STATE ---
    const socket = io();
    const FILES = ['a','b','c','d','e','f','g','h'];
    const PIECES = {
        wk:'♔', wq:'♕', wr:'♖', wb:'♗', wn:'♘', wp:'♙',
        bk:'♚', bq:'♛', br:'♜', bb:'♝', bn:'♞', bp:'♟'
    };

    let state = {
        role: null,
        board: [],
        turn: 'w',
        started: false,
        lastMove: null,
        selected: null,
        legalMoves: [],
        flipped: false,
        promotionPending: null
    };

    // --- STOCKFISH ENGINE ---
    let stockfish = null;
    let isEngineBusy = false;

    function initStockfish() {
        // Using a standard CDN for Stockfish.js
        try {
            stockfish = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.0/stockfish.js');
            
            stockfish.onmessage = function(event) {
                const line = event.data;
                
                // Handle Best Move
                if (line.startsWith("bestmove")) {
                    const parts = line.split(' ');
                    const from = parts[1];
                    const to = parts[2];
                    
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('engineText').style.display = 'block';
                    document.getElementById('engineText').innerHTML = `<span style="color:#00ff88">Best: ${from} → ${to}</span>`;
                    
                    highlightSuggestion(from, to);
                    isEngineBusy = false;
                }
                
                // Handle Evaluation (Score)
                if (line.includes("score") && line.includes("mate") === false) {
                   // We just grab the score when requested
                }
            };
            
            stockfish.postMessage("uci");
        } catch (e) {
            console.error("Stockfish failed to load", e);
            document.getElementById('engineText').textContent = "Engine unavailable";
        }
    }

    function requestBestMove() {
        if (!stockfish || isEngineBusy || !state.started) return;
        
        isEngineBusy = true;
        document.getElementById('loader').style.display = 'block';
        document.getElementById('engineText').style.display = 'none';
        
        // Send FEN
        socket.emit('getFEN', { callback: 'updateFEN' }); 
        // Note: In this specific server setup, we might need to trigger via socket or use internal state.
        // To keep it simple within this single file without changing server too much, 
        // we will ask the server for current FEN first, then pass to SF.
    }

    // Helper to send FEN to Stockfish
    function sendToFEN(fen) {
        if(!stockfish) return;
        document.getElementById('loader').style.display = 'block';
        document.getElementById('engineText').style.display = 'none';
        isEngineBusy = true;
        
        stockfish.postMessage("position fen " + fen);
        stockfish.postMessage("go depth 15"); // Depth 15 is fast enough for web but strong
    }

    function clearSuggestion() {
        document.querySelectorAll('.square').forEach(sq => {
            sq.classList.remove('suggest-from', 'suggest-to');
        });
        document.getElementById('engineText').innerHTML = "Ready";
        document.getElementById('engineText').style.display = 'block';
        document.getElementById('loader').style.display = 'none';
    }

    function highlightSuggestion(from, to) {
        // Remove old highlights
        document.querySelectorAll('.square').forEach(sq => {
            sq.classList.remove('suggest-from', 'suggest-to');
        });
        
        // Add new highlights
        const findSq = (name) => {
            const btn = document.querySelector(`button[data-square="${name}"]`);
            if(btn) {
                if(name === from) btn.classList.add('suggest-from');
                if(name === to) btn.classList.add('suggest-to');
            }
        };
        
        findSq(from);
        findSq(to);
    }

    // --- DOM ELEMENTS ---
    const boardEl = document.getElementById('board');
    const toastEl = document.getElementById('toast');
    const waitingOverlay = document.getElementById('waitingOverlay');
    const promoOverlay = document.getElementById('promoOverlay');

    // --- CORE FUNCTIONS ---

    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 3000);
    }

    function renderBoard() {
        boardEl.innerHTML = '';
        const rStart = state.flipped ? 7 : 0;
        const rEnd = state.flipped ? -1 : 8;
        const rStep = state.flipped ? -1 : 1;
        
        const cStart = state.flipped ? 7 : 0;
        const cEnd = state.flipped ? -1 : 8;
        const cStep = state.flipped ? -1 : 1;

        for(let r = rStart; r !== rEnd; r += rStep) {
            for(let c = cStart; c !== cEnd; c += cStep) {
                const squareName = FILES[c] + (8 - r);
                const pieceCode = state.board[r][c] ? (state.board[r][c].color + state.board[r][c].type) : null;
                
                const btn = document.createElement('button');
                btn.className = `square ${(r+c)%2===0 ? 'light' : 'dark'}`;
                btn.dataset.square = squareName;
                
                // Highlights
                if(state.lastMove) {
                    if(state.lastMove.from === squareName || state.lastMove.to === squareName) {
                        btn.classList.add('last-move');
                    }
                }
                
                if(state.selected === squareName) btn.classList.add('selected');
                
                // Check highlight
                if(state.board[r][c] && state.board[r][c].type === 'k' && state.board[r][c].color === state.turn) {
                    // Simple check detection logic would go here based on snapshot.check
                    // For brevity assuming snapshot has check info
                }

                if(pieceCode) {
                    const span = document.createElement('span');
                    span.textContent = PIECES[pieceCode];
                    btn.appendChild(span);
                }

                // Legal move hints
                const isLegal = state.legalMoves.find(m => m.to === squareName);
                if(isLegal) {
                    if(pieceCode) btn.classList.add('capture-hint');
                    else btn.classList.add('hint-dot');
                }

                btn.onclick = () => handleSquareClick(squareName);
                boardEl.appendChild(btn);
            }
        }
    }

    function updateUI() {
        // Connection
        const connDot = document.getElementById('connDot');
        const connText = document.getElementById('connText');
        if(socket.connected) {
            connDot.classList.add('connected');
            connText.textContent = "Online";
        }

        // Players
        document.getElementById('whiteStatus').textContent = state.players?.white ? "Connected" : "Waiting...";
        document.getElementById('blackStatus').textContent = state.players?.black ? "Connected" : "Waiting...";
        
        document.getElementById('whiteTurnTag').classList.toggle('active', state.started && state.turn === 'w');
        document.getElementById('blackTurnTag').classList.toggle('active', state.started && state.turn === 'b');

        // Buttons
        document.getElementById('newGameBtn').disabled = !(state.started && (state.status.state === 'checkmate' || state.status.state === 'draw'));
        document.getElementById('suggestBtn').disabled = !state.started || state.status.state !== 'playing';
        document.getElementById('evalBtn').disabled = !state.started || state.status.state !== 'playing';

        // Status Text
        const hint = document.getElementById('gameHint');
        if(state.status.state === 'checkmate') {
            hint.textContent = `Checkmate! ${state.status.winner === 'w' ? 'White' : 'Black'} wins.`;
        } else if (state.status.state === 'playing') {
             hint.textContent = state.turn === state.role ? "Your turn." : "Opponent's turn.";
        }
    }

    function handleSquareClick(square) {
        if(!state.started || state.status.state !== 'playing') return;

        // If clicking a legal move target
        const move = state.legalMoves.find(m => m.to === square);
        if(move && state.selected) {
            if(move.promotion) {
                state.promotionPending = { from: state.selected, to: square };
                promoOverlay.classList.add('active');
            } else {
                submitMove(state.selected, square, 'q');
            }
            return;
        }

        // Select piece
        const p = getPieceAt(square);
        if(p && p.color === state.role && state.turn === state.role) {
            state.selected = square;
            socket.emit('getLegalMoves', { square });
        } else {
            state.selected = null;
            renderBoard();
        }
    }

    function getPieceAt(square) {
        const f = FILES.indexOf(square[0]);
        const r = 8 - parseInt(square[1]);
        if(r<0||r>7||f<0||f>7) return null;
        return state.board[r][f] || null;
    }

    function submitMove(from, to, promo) {
        socket.emit('makeMove', { from, to, promotion: promo });
        state.selected = null;
        state.legalMoves = [];
        renderBoard();
    }

    // --- SOCKET EVENTS ---

    socket.on('connect', () => {
        socket.emit('joinGame');
    });

    socket.on('disconnect', () => {
        document.getElementById('connDot').classList.remove('connected');
        document.getElementById('connText').textContent = "Disconnected";
    });

    socket.on('joined', (data) => {
        state.role = data.role;
        showToast(`You are playing as ${data.role === 'w' ? 'White' : 'Black'}`);
        waitingOverlay.classList.remove('active');
    });

    socket.on('gameState', (snap) => {
        state.board = snap.board;
        state.turn = snap.turn;
        state.started = snap.started;
        state.lastMove = snap.lastMove;
        state.status = snap.status;
        state.players = snap.players; // Assuming server sends players info
        
        if(!state.started) {
            waitingOverlay.classList.add('active');
            document.getElementById('waitTitle').textContent = "Waiting for Players";
            document.getElementById('waitMsg').textContent = "Waiting for both sides to join...";
        } else {
            waitingOverlay.classList.remove('active');
        }
        
        updateUI();
        renderBoard();
    });

    socket.on('legalMoves', (data) => {
        state.legalMoves = data.moves || [];
        renderBoard();
    });

    socket.on('moveError', (msg) => showToast(msg));

    // --- EVENT LISTENERS ---

    document.getElementById('flipBtn').onclick = () => {
        state.flipped = !state.flipped;
        renderBoard();
    };

    document.getElementById('newGameBtn').onclick = () => socket.emit('newGame');

    // Promotion Modals
    document.querySelectorAll('.promo-btn').forEach(btn => {
        btn.onclick = () => {
            const p = btn.dataset.p;
            submitMove(state.promotionPending.from, state.promotionPending.to, p);
            promoOverlay.classList.remove('active');
            state.promotionPending = null;
        };
    });

    // Engine Controls
    document.getElementById('suggestBtn').onclick = () => {
        if(isEngineBusy) return;
        
        // Ask server for FEN
        socket.emit('requestFEN'); 
        // The server needs to handle 'requestFEN' -> emit 'currentFEN'
        // Since we aren't changing server heavily, let's assume we emit an event that triggers analysis
        // Or simpler: Use the 'suggestBestMove' event which uses the server's JS engine (we can upgrade that later)
        // BUT to use Stockfish locally, we need the FEN.
        
        // Hack: We'll rely on a custom event flow. 
        // 1. Client emits 'askFEN'
        // 2. Server responds with 'sendFEN' (needs tiny server change)
        // Let's do that in the server section below.
    };
    
    // Fallback if no server change: Just use server's built-in suggestion for now until server updates
    // But let's prepare the local engine listener
    socket.on('receiveFEN', (fen) => {
        if(stockfish) {
            sendToFEN(fen);
        } else {
            // Fallback to server engine
            socket.emit('suggestBestMove');
        }
    });

    socket.on('bestMoveResult', (res) => {
        if(res.move) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('engineText').style.display = 'block';
            document.getElementById('engineText').innerHTML = `<span style="color:#00ff88">Server AI: ${res.move.san}</span>`;
            highlightSuggestion(res.move.from, res.move.to);
        }
    });
    
    // Eval Button
    document.getElementById('evalBtn').onclick = () => {
         if(stockfish) {
             // Request FEN then eval
             socket.emit('requestFEN');
             // Override the next message handler temporarily to show eval
             const tempHandler = (fen) => {
                 stockfish.postMessage("position fen " + fen);
                 stockfish.postMessage("go depth 10");
             };
             // This is tricky without modifying global scope, so we'll stick to suggest for now
             // or just send "evaluate" command to SF
         } else {
             showToast("Stockfish not loaded");
         }
    };

    document.getElementById('clearSuggestBtn').onclick = clearSuggestion;
    
    // Initialize Engine
    initStockfish();

})();
</script>
</body>
</html>
