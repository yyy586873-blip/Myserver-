<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Chess Room</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#263b62,#0a0e18 58%);font-family:Arial,sans-serif;color:#f5f7ff}.card{width:min(100%,420px);padding:30px;border:1px solid #ffffff24;border-radius:24px;background:#ffffff0d;backdrop-filter:blur(18px);text-align:center}h1{margin:8px 0 10px}.muted{color:#aebbd2;font-size:14px;line-height:1.5}input{width:100%;margin:22px 0 12px;padding:17px;text-align:center;font-size:28px;letter-spacing:12px;color:white;background:#080d18;border:1px solid #ffffff30;border-radius:13px;outline:none}button,a{display:block;width:100%;padding:15px;border:0;border-radius:13px;font-weight:bold;text-decoration:none;cursor:pointer}button{background:linear-gradient(135deg,#c7d8ff,#829ff0);color:#101827}a{margin-top:12px;color:#dce5fa;background:#ffffff12}.msg{min-height:20px;color:#ffaaaa;font-size:13px;margin-top:12px}</style></head><body><main class="card"><div style="font-size:42px">♔</div><h1>Create Game</h1><p class="muted">Choose any available 3-digit room code. Share it with the other player.</p><form id="form"><input id="code" inputmode="numeric" maxlength="3" pattern="[0-9]{3}" placeholder="123" required><button>Create Room</button></form><div class="msg" id="msg"></div><a id="backLink" href="/">← Back to Lobby</a></main><script>var adminMode=new URLSearchParams(location.search).get('mode')==='admin';if(adminMode){document.getElementById('backLink').href='/lobby.html?mode=admin';document.querySelector('h1').textContent='Admin '+document.querySelector('h1').textContent;}document.getElementById('form').addEventListener('submit',async function(e){e.preventDefault();var code=document.getElementById('code').value.trim(),msg=document.getElementById('msg');if(!/^\d{3}$/.test(code)){msg.textContent='Enter exactly 3 digits.';return;}try{var r=await fetch('/api/create-room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code})});var d=await r.json();if(!d.ok){msg.textContent=d.message;return;}location.href=(adminMode?'/Admin.html?room=':'/index.html?room=')+encodeURIComponent(code);}catch(err){msg.textContent='Could not reach the server. Try again.';}});</script></body></html>
