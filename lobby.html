<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chess Arena Lobby</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#263b62,#0a0e18 58%);font-family:Arial,sans-serif;color:#f5f7ff}.card{width:min(100%,430px);padding:32px;border:1px solid #ffffff24;border-radius:26px;background:#ffffff0d;backdrop-filter:blur(18px);box-shadow:0 24px 80px #0007;text-align:center}.logo{font-size:48px;color:#a9c4ff}h1{margin:8px 0;font-size:30px}.sub{color:#aebbd2;font-size:13px;letter-spacing:2px}.actions{display:grid;gap:14px;margin-top:30px}a{padding:16px;border-radius:14px;text-decoration:none;font-weight:bold;color:#101827;background:linear-gradient(135deg,#c7d8ff,#829ff0)}a.secondary{background:#ffffff12;color:#f5f7ff;border:1px solid #ffffff28}.foot{color:#8491a9;font-size:12px;margin-top:24px}</style></head><body><main class="card"><div class="logo">♞</div><h1>Chess Arena</h1><div class="sub">MULTIPLAYER LOBBY</div><div class="actions"><a id="createLink" href="/create">＋ Create Game</a><a id="joinLink" class="secondary" href="/join">⇢ Join Game</a></div><a id="openApp" class="secondary" href="#" style="display:block;margin-top:14px">Open in Chess Arena App</a><div class="foot">Create a 3-digit room code or join a friend's room.</div></main><script>(function(){var admin=new URLSearchParams(location.search).get("mode")==="admin";if(admin){document.querySelector("h1").textContent="Chess Arena Admin";document.querySelector(".sub").textContent="ADMIN GAME LOBBY";document.getElementById("createLink").href="/create?mode=admin";document.getElementById("joinLink").href="/join?mode=admin";document.querySelector(".foot").textContent="Create or join a room as a player from the Admin page.";}var appLink=document.getElementById("openApp");appLink.href="intent://open?mode="+(admin?"admin":"player")+"#Intent;scheme=chessarena;package=in.chessarena.app;S.browser_fallback_url="+(admin?"https%3A%2F%2Fmyserver-b0ls.onrender.com%2FAdmin.html":"https%3A%2F%2Fmyserver-b0ls.onrender.com%2F")+";end";})();</script></body></html>
