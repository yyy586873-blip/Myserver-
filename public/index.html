<!DOCTYPE html><html>
<head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Live Screen Share</title>

<style>

    body {
        margin: 0;
        padding: 0;
        background: #111111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h2 {
        margin: 15px;
    }

    #status {
        margin: 10px;
        color: #cccccc;
    }

    #screen {
        width: 100%;
        max-width: 1000px;
        max-height: 85vh;
        object-fit: contain;
        background: black;
    }

</style>

</head><body><h2>Live Screen Share</h2>

<div id="status">
    Connecting...
</div>

<img
    id="screen"
    alt="Waiting for screen"
>

<script>

    var screenImage =
        document.getElementById("screen");

    var status =
        document.getElementById("status");

    var loading = false;

    function updateScreen() {

        if (loading) {
            return;
        }

        loading = true;

        var image = new Image();

        image.onload = function () {

            screenImage.src = image.src;

            status.innerHTML =
                "Live - Screen Connected";

            loading = false;
        };

        image.onerror = function () {

            status.innerHTML =
                "Waiting for device...";

            loading = false;
        };

        image.src =
            "/latest.jpg?t=" +
            new Date().getTime();
    }

    setInterval(
        updateScreen,
        700
    );

    updateScreen();

</script>

</body>
</html>
